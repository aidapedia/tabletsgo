name: Release

# Step 1 of the release: bump the version and push a release/* branch, then print
# a ready-to-open PR link in the run summary. Branch protection on v0.x.x means we
# can't push the bump directly, and this org blocks GITHUB_TOKEN from opening PRs,
# so you click the link to open the PR yourself. Merging it triggers
# release-publish.yml, which tags the merged commit and builds the image — so the
# tag and the version-synced files are the SAME commit.
#
# Trigger from the Actions tab (Run workflow) or:
#   gh workflow run release.yml -f version=0.16.5
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, no leading v (e.g. 0.16.5)'
        required: true
        type: string

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  open-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push the release/* branch
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Normalize + validate version
        id: norm
        run: |
          V="${{ inputs.version }}"
          V="${V#v}"
          echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "::error::Invalid semver: '$V' (expected X.Y.Z)"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Refuse if already released
        env:
          VERSION: ${{ steps.norm.outputs.version }}
        run: |
          if git ls-remote --tags --exit-code origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "::error::Tag v${VERSION} already exists"; exit 1
          fi

      - name: Bump package.json + README badge
        env:
          VERSION: ${{ steps.norm.outputs.version }}
        run: |
          # package.json "version" (npm pkg set edits in place, no git tag).
          npm pkg set "version=${VERSION}"
          # README badge: version-<X>-<6-hex-color> — keep the color, swap version.
          sed -i -E "s|badge/version-[^-]*-([0-9A-Fa-f]{6})|badge/version-${VERSION}-\1|" README.md
          if git diff --quiet -- package.json README.md; then
            echo "::error::Nothing to bump — files already show v${VERSION}"; exit 1
          fi

      - name: Push release branch
        env:
          VERSION: ${{ steps.norm.outputs.version }}
        run: |
          BR="release/v${VERSION}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BR"
          git add package.json README.md
          git commit -m "release: v${VERSION}"
          git push -f origin "$BR"

      - name: Open pull request
        env:
          # A user PAT (RELEASE_PAT), NOT GITHUB_TOKEN: the org blocks GITHUB_TOKEN
          # from creating PRs, but a PAT acts as you, so it is allowed. If the
          # secret is missing/empty we degrade to a prefilled compare link.
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          VERSION: ${{ steps.norm.outputs.version }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          BR="release/v${VERSION}"
          PR_URL="${{ github.server_url }}/${{ github.repository }}/compare/${BASE}...${BR}?expand=1"
          if [ -z "${GH_TOKEN}" ]; then
            {
              echo "## Release v${VERSION} — open the PR manually"
              echo ""
              echo "No \`RELEASE_PAT\` secret set. Click to open the release PR into \`${BASE}\`:"
              echo ""
              echo "[**Open PR for v${VERSION}**](${PR_URL})"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "No RELEASE_PAT — open the PR here: ${PR_URL}"
            exit 0
          fi
          if [ -n "$(gh pr list --head "$BR" --state open --json number -q '.[0].number')" ]; then
            echo "PR already open for $BR."
          else
            gh pr create \
              --base "$BASE" \
              --head "$BR" \
              --title "release: v${VERSION}" \
              --body "Automated version bump to \`v${VERSION}\` (package.json + README badge). Merge to tag the merged commit, build the image, and publish the release."
          fi
