name: Quality

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tabletsgo
          POSTGRES_PASSWORD: test
          POSTGRES_DB: tabletsgo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tabletsgo -d tabletsgo_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PG_META_TEST_URL: postgresql://tabletsgo:test@127.0.0.1:5432/tabletsgo_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y libpq-dev
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
