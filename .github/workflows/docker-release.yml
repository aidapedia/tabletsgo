name: Docker release

# Build and publish the Tabletsgo image whenever a semver tag is pushed
# (e.g. v0.11.1). Push a tag with: git tag v0.11.1 && git push origin v0.11.1
on:
  push:
    tags:
      - 'v*.*.*'

# A re-pushed/moved tag (e.g. re-tagging after a merge) cancels the older
# in-progress build instead of running two builds of the same version.
concurrency:
  group: docker-release-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      # write: attach the release.json update contract to the GitHub Release.
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (multi-arch emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derives tags/labels from the git ref, e.g. tag v0.11.1 ->
      #   ghcr.io/<owner>/<repo>:0.11.1
      #   ghcr.io/<owner>/<repo>:0.11
      #   ghcr.io/<owner>/<repo>:latest
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      # Version = the tag without the leading "v" (e.g. v0.16.0 -> 0.16.0).
      - name: Derive version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Baked into the image so the running app reports its own identity and
          # the in-app update checker can compare (version, sha).
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.version }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Publish the machine-readable update contract onto the GitHub Release. The
      # in-app checker reads this to compare identity and drive the update wizard
      # (force-backup on migrations, warn on breaking, block unsafe jumps via
      # minUpgradeFrom). Maintainers can enrich the flags per release: set repo
      # variables MIN_UPGRADE_FROM and, per release, mark breaking/migrations by
      # editing the asset — defaults are safe (non-breaking, no forced backup).
      - name: Publish release.json contract
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
          SHA: ${{ github.sha }}
          MIN_UPGRADE_FROM: ${{ vars.MIN_UPGRADE_FROM }}
        run: |
          cat > release.json <<EOF
          {
            "version": "${VERSION}",
            "sha": "${SHA:0:7}",
            "channel": "stable",
            "breaking": false,
            "migrations": false,
            "minUpgradeFrom": "${MIN_UPGRADE_FROM}"
          }
          EOF
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" release.json --clobber
