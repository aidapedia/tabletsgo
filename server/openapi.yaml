          schema:
            type: string
      responses:
        "200":
          description: |-
            (SQLite) `{ "databases": ["demo.db"], "schemas": ["main"], "currentDatabase": "demo.db" }`

            (PostgreSQL) `{ "databases": ["appdb", "postgres"], "schemas": ["public"], "currentDatabase": "appdb" }`
          content:
            application/json:
              schema:
                type: object
                properties:
                  databases:
                    type: array
