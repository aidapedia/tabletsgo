  /api/connections/import:
    post:
      tags:
        - Connections
      summary: Create a new connection from an export document, in one transaction (a rejected
      description: |-
        Create a **new** connection from an export document, in one transaction (a rejected
        document leaves nothing behind). Caller must be a member of the target workspace.
        Mounted above the `/api/connections/:id` guard, so `import` is never read as an id.

        Every artifact gets a fresh id: the folder tree is re-parented onto the new ids
        (a cycle or an over-deep branch is imported at the root), items keep their folder
        when the folder groups that kind of item, and dashboard row actions are re-pointed
        at the newly created workflow ids. Storage destinations are workspace-scoped and are
        **not** part of the bundle — references this workspace doesn't have are dropped, and
        schedules (workflow + backup) arrive **paused**. The same goes for the SSH gateway: an
        `sshGatewayId` that isn't one of the importing workspace's gateways is removed (with
        a warning), and the connection connects directly until one is picked.

          `name` (optional) overrides the connection name; `settings` (optional) overrides
          individual credential fields — e.g. a password the export left out, or SQLite's
          `filepath` on this host.
      requestBody:
        description: |-
          ```json
          {
            "workspaceId": "ws_1",
            "document": { "kind": "connection", "version": 1, "...": "the export document" },
            "name": "Demo (imported)",
            "settings": { "password": "typed-in-by-the-importer" }
          }
          ```
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  connection:
                    type: object
                    properties:
                      id:
                        type: string
                        example: new-uuid
                      type:
                        type: string
                        example: sqlite
                      name:
                        type: string
                        example: Demo (imported)
                      ...:
                        type: string
                        example: full connection object
                  counts:
                    type: object
                    properties:
                      folders:
                        type: integer
                        example: 5
                      tables:
                        type: integer
                        example: 1
                      savedQueries:
                        type: integer
                        example: 1
                      workflows:
                        type: integer
                        example: 1
                      dashboards:
                        type: integer
                        example: 1
                  warnings:
                    type: array
                    items:
                      type: string
                      example: 1 scheduled workflow(s) were imported paused — enable them once the connection is verified.
              example:
                connection:
                  id: new-uuid
                  type: sqlite
                  name: Demo (imported)
                  ...: full connection object
                counts:
                  folders: 5
                  tables: 1
                  savedQueries: 1
                  workflows: 1
                  dashboards: 1
                warnings:
                  - 1 scheduled workflow(s) were imported paused — enable them once the connection is verified.
        "400":
          description: '`{ "error": "Not a connection export file." }` / `{ "error": "This file was exported by a newer version of tabletsgo." }` / `{ "error": "The file is missing its connection settings." }`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Not a connection export file.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: '`{ "error": "Forbidden" }` (not a member of `workspaceId`)'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Forbidden
  /api/connections/{id}/access:
