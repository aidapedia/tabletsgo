                    type: string
                    example: demo.db
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/connections/{id}/types:
    get:
      tags:
        - Schema & data browsing
      summary: Column data types (per dialect)
      description: Column data types the schema editor offers for this connection's dialect.
      parameters:
        - name: id
          in: path
          required: true
          description: Connection id
          schema:
            type: string
          example: demo-sqlite
      responses:
        "200":
          description: |-
            (Postgres uses the database's own type vocabulary, matching `/columns`)
            ```jsonc
            { "types": ["INTEGER", "TEXT", "REAL", "BLOB", "NUMERIC"] }   // sqlite
            // postgresql: ["serial","bigserial","smallint","integer","bigint","numeric",
            //   "character varying","timestamp without time zone", ...]
            ```
          content:
            application/json:
              schema:
                type: object
                properties:
                  types:
                    type: array
                    items:
                      type: string
                      example: INTEGER
              example:
                types:
                  - INTEGER
                  - TEXT
                  - REAL
                  - BLOB
                  - NUMERIC
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: '`{ "error": "Connection not found" }`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Connection not found
  /api/connections/{id}/diagram:
    get:
      tags:
        - Schema & data browsing
      summary: Tables, indexes + foreign keys
      description: |-
        Tables with columns and indexes + foreign-key relationships (ER diagram). This is
        the whole schema in one answer — what the schema designer's **Sync** stores with
        a draft, so it can draw (and edit) without reading the database again.

        - **`indexes`** is exactly what `/indexes/:table` returns for that table.

        ---

        **Example:** **Example (slice):** `GET http://localhost:3000/api/connections/demo-sqlite/diagram?tables=users,orders`
      parameters:
        - name: id
          in: path
          required: true
          description: Connection id
          schema:
            type: string
          example: demo-sqlite
        - name: tables
          in: query
          description: optional `database`, `schema` (PG); optional **`tables`** — a comma-separated list narrowing the read to those tables. Each such response is a *complete* answer for the tables it names (their columns, their indexes, and the foreign keys they declare), so a client can walk a large schema in slices and report progress; the union of the slices equals the unfiltered read. Names that no longer exist are simply absent rather than an error.
          schema:
            type: string
        - name: database
          in: query
          description: optional `database`, `schema` (PG); optional **`tables`** — a comma-separated list narrowing the read to those tables. Each such response is a *complete* answer for the tables it names (their columns, their indexes, and the foreign keys they declare), so a client can walk a large schema in slices and report progress; the union of the slices equals the unfiltered read. Names that no longer exist are simply absent rather than an error.
          schema:
            type: string
        - name: schema
          in: query
          description: optional `database`, `schema` (PG); optional **`tables`** — a comma-separated list narrowing the read to those tables. Each such response is a *complete* answer for the tables it names (their columns, their indexes, and the foreign keys they declare), so a client can walk a large schema in slices and report progress; the union of the slices equals the unfiltered read. Names that no longer exist are simply absent rather than an error.
          schema:
            type: string
      responses:
        "200":
          description: |-
            ```jsonc
            {
              "tables": [{ "name": "orders", "columns": [Column, ...], "indexes": [Index, ...] }],
              "foreignKeys": [
                // `constraint` (PG only) is the constraint name, used to drop/modify the FK.
                { "constraint": "orders_user_id_fkey", "table": "orders", "column": "user_id",
                  "refTable": "users", "refColumn": "id", "onDelete": "CASCADE", "onUpdate": "NO ACTION" }
              ]
            }
            ```
          content:
            application/json:
              schema:
                type: object
                properties:
                  tables:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          example: orders
                        columns:
                          type: array
                          items:
                            $ref: "#/components/schemas/Column"
                        indexes:
                          type: array
                          items: {}
                  foreignKeys:
                    type: array
                    items:
                      type: object
                      properties:
                        constraint:
                          type: string
                          example: orders_user_id_fkey
                        table:
                          type: string
                          example: orders
                        column:
                          type: string
                          example: user_id
                        refTable:
                          type: string
                          example: users
                        refColumn:
                          type: string
                          example: id
                        onDelete:
                          type: string
                          example: CASCADE
                        onUpdate:
                          type: string
                          example: NO ACTION
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/connections/{id}/insert:
    post:
      tags:
        - Mutations
      summary: Insert a row
      description: Insert a single row (parameterized — values are bound, not interpolated).
      parameters:
        - name: id
          in: path
          required: true
          description: Connection id
          schema:
            type: string
          example: demo-sqlite
      requestBody:
        description: '`{ "table": "users", "values": { "name": "A", "active": true }, "database": "appdb", "schema": "public" }` (`database`/`schema` optional, PG only; booleans are coerced to `1/0` for SQLite)'
        content:
          application/json:
            schema:
              type: object
              properties:
                table:
                  type: string
                  example: users
                values:
                  type: object
                  properties:
                    name:
                      type: string
                      example: A
                    active:
                      type: boolean
                      example: true
                database:
                  type: string
                  example: appdb
                schema:
                  type: string
                  example: public
      responses:
        "200":
          description: |-
            (SQLite) `{ "ok": true, "changes": 1, "lastInsertRowid": 42 }`

            (PostgreSQL) `{ "ok": true, "changes": 1 }`
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  changes:
                    type: integer
                    example: 1
                  lastInsertRowid:
                    type: integer
                    example: 42
        "400":
          description: '`{ "error": "A table and at least one value are required" }` or a DB error'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: A table and at least one value are required
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/connections/{id}/query:
    post:
      tags:
        - Mutations
      summary: Execute SQL / a Redis command
      description: |-
        Execute arbitrary SQL. SELECTs return rows; other statements return a message.
        For PostgreSQL, a non-`public` `schema` is set on the search path first.

        On a **Redis** connection `sql` carries raw command text instead — one command per
        line, `#` comments and blank lines ignored, arguments quoted the way `redis-cli`
        quotes them (SQL's `''` escape inside single quotes is accepted too, so a workflow
        query node's `{{input.x}}` substitution round-trips). Replies are normalized into
        the same shape: collections become rows, scalars/status replies become a message.
        Blocking and connection-mode commands (`SUBSCRIBE`, `MONITOR`, `BLPOP`, `WAIT`, …)
        are rejected — they would hold the pooled connection open indefinitely.

        **Redis reply normalization**

        | Reply | Result |
        | --- | --- |
        | `nil` | `{ "type": "message", "message": "(nil)" }` |
        | Integer | `{ "type": "message", "message": "(integer) 3" }` |
        | Simple/bulk string | `{ "type": "message", "message": "OK" }` |
        | Multi-line string (`INFO`, `CLIENT LIST`) | `{ "type": "rows", "columns": ["line"], "rows": [{ "line": "..." }] }` |
        | Array (`LRANGE`, `SMEMBERS`, `KEYS`) | `{ "type": "rows", "columns": ["#", "value"], "rows": [...] }` (nested arrays render as JSON in `value`) |
        | Map (`HGETALL`, `CONFIG GET`) | `{ "type": "rows", "columns": ["field", "value"], "rows": [...] }` |
        | More than one command in the buffer | `{ "type": "rows", "columns": ["#", "command", "status", "reply"], "rows": [...] }` — `status` is `OK` or `ERROR` per command, so a failure mid-batch is visible without aborting the rest |

        Example — `{ "sql": "SET a 1\nINCR a\nBADCMD x" }`:
        ```json
        {
          "type": "rows",
          "columns": ["#", "command", "status", "reply"],
          "rows": [
            { "#": 1, "command": "SET a 1", "status": "OK", "reply": "OK" },
            { "#": 2, "command": "INCR a", "status": "OK", "reply": 2 },
            { "#": 3, "command": "BADCMD x", "status": "ERROR", "reply": "ERR unknown command 'badcmd'..." }
          ]
        }
        ```
      parameters:
        - name: id
          in: path
          required: true
          description: Connection id
          schema:
            type: string
          example: demo-sqlite
      requestBody:
        description: |-
          `{ "sql": "SELECT * FROM users", "database": "appdb", "schema": "public" }`

          (Redis) `{ "sql": "HGETALL cfg:app", "database": "db2" }`

          (one page) `{ "sql": "SELECT * FROM users", "page": { "limit": 21, "offset": 40 } }` — optional, any engine. A SQL engine wraps the statement (`SELECT * FROM (…) AS _page LIMIT … OFFSET …`); a command-driven one (Redis, Kafka) runs the command and slices the reply's rows. The caller never rewrites the statement itself, which is what lets a paged dashboard table run a Kafka command.
        content:
          application/json:
            schema:
              type: object
              properties:
                sql:
                  type: string
                  example: SELECT * FROM users
                database:
                  type: string
                  example: appdb
                schema:
                  type: string
                  example: public
            examples:
              Example 1:
                value:
                  sql: SELECT * FROM users
                  database: appdb
                  schema: public
              Redis:
                value:
                  sql: HGETALL cfg:app
                  database: db2
              one page:
                value:
                  sql: SELECT * FROM users
                  page:
                    limit: 21
                    offset: 40
      responses:
        "200":
          description: |-
            (SELECT) `{ "type": "rows", "columns": [...], "rows": [...] }`

            (other) `{ "type": "message", "message": "Query OK · 3 row(s) affected.", "rowCount": 3 }` (`rowCount` absent on Redis replies)

            (SQL error) `{ "error": "<driver message>" }` (note: HTTP 200, error in body)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryResult"
        "400":
          description: |-
            `{ "error": "SQL query required" }`

            `{ "error": "page needs an integer limit ≥ 1 and offset ≥ 0" }`
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: SQL query required
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: '`{ "error": "Connection not found" }`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Connection not found
  /api/connections/{id}/analyze:
    post:
      tags:
        - Mutations
      summary: Analyze query performance
      description: |-
        Analyze one statement's performance. Runs the dialect's EXPLAIN machinery
        (SQLite `EXPLAIN QUERY PLAN`, PostgreSQL `EXPLAIN (FORMAT JSON)`) and normalizes
        the result into a dialect-agnostic shape with index and query suggestions.
        Read-only SELECTs are additionally executed for real timings (`mode: "actual"`);
        DML statements are only estimated and **never executed**. Any `EXPLAIN` prefix
        already present in the SQL is stripped first. Suggested indexes are deduped
        against the table's existing indexes.

        ---
      parameters:
        - name: id
          in: path
          required: true
          description: Connection id
          schema:
            type: string
          example: demo-sqlite
      requestBody:
        description: "`{ \"sql\": \"SELECT * FROM users WHERE email = 'a@b.c'\", \"database\": \"appdb\", \"schema\": \"public\" }` (`database`/`schema` optional, PG only)"
        content:
          application/json:
            schema:
              type: object
              properties:
                sql:
                  type: string
                  example: SELECT * FROM users WHERE email = 'a@b.c'
                database:
                  type: string
                  example: appdb
                schema:
                  type: string
                  example: public
      responses:
        "200":
          description: |-
            ```json
            {
              "dialect": "sqlite",
              "summary": { "mode": "actual", "executed": true, "elapsedMs": 1.42, "rowsReturned": 3 },
              "plan": [
                { "depth": 0, "step": "SCAN", "detail": "SCAN users", "table": "users",
                  "index": null, "rows": null, "warning": "Full table scan" }
              ],
              "rawPlan": { "columns": ["id", "parent", "notused", "detail"], "rows": [...] },
              "indexSuggestions": [
                { "table": "users", "columns": ["email"],
                  "reason": "Full table scan on \"users\" while filtering — …",
                  "ddl": "CREATE INDEX \"idx_users_email\" ON \"users\" (\"email\");" }
              ],
              "querySuggestions": [
                { "code": "leading-wildcard-like", "message": "LIKE with a leading wildcard ('%…') cannot use an index — …" }
              ]
            }
            ```
            `summary.mode` is `"actual"` (query executed, real timings) or `"estimated"`
            (plan only). PostgreSQL responses also carry `summary.estimatedCost`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  dialect:
                    type: string
                    example: sqlite
                  summary:
                    type: object
                    properties:
                      mode:
                        type: string
                        example: actual
                      executed:
                        type: boolean
                        example: true
                      elapsedMs:
                        type: number
                        example: 1.42
                      rowsReturned:
                        type: integer
                        example: 3
                  plan:
                    type: array
                    items:
                      type: object
                      properties:
                        depth:
                          type: integer
                          example: 0
                        step:
                          type: string
                          example: SCAN
                        detail:
                          type: string
                          example: SCAN users
                        table:
                          type: string
                          example: users
                        index:
                          type: "null"
                        rows:
                          type: "null"
                        warning:
                          type: string
                          example: Full table scan
                  rawPlan:
                    type: object
                    properties:
                      columns:
                        type: array
                        items:
                          type: string
                          example: id
                      rows:
                        type: array
                        items: {}
                  indexSuggestions:
                    type: array
                    items:
                      type: object
                      properties:
                        table:
                          type: string
                          example: users
                        columns:
                          type: array
                          items:
                            type: string
                            example: email
                        reason:
                          type: string
                        ddl:
                          type: string
                          example: CREATE INDEX \"idx_users_email\" ON \"users\" (\"email\");
                  querySuggestions:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: leading-wildcard-like
                        message:
                          type: string
        "400":
          description: '`{ "error": "SQL query required" }`, `{ "error": "Only a single statement can be analyzed." }`, `{ "error": "Only SELECT and data-modification statements can be analyzed." }`, `{ "error": "Query analysis is not supported for <type> connections." }`, or a driver error message'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: SQL query required
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: '`{ "error": "Connection not found" }`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Connection not found
  /api/connections/{id}/data/export:
    get:
      tags:
        - Table data export / import
      summary: Export tables as CSV/JSON/SQL
      description: |-
        Stream an export file (`Content-Disposition: attachment`).

        **Example:** **Example (SQL body):**
        ```sql
        -- tabletsgo.data v1 · sqlite · 2026-10-02T08:00:00.000Z

        -- Schema: users
        CREATE TABLE IF NOT EXISTS users (id INTEGER PRIMARY KEY, name TEXT NOT NULL);

        -- Data: users
        INSERT INTO "users" ("id", "name") VALUES (1, 'Ada');
        ```
      parameters:
        - name: id
          in: path
          required: true
          description: Connection id
          schema:
            type: string
          example: demo-sqlite
        - name: tables
          in: query
          description: "- `tables` — comma-separated table names (required; must be tables the database reports) - `format` — `csv` | `json` | `sql` (required; `csv` takes exactly one table) - `includeSchema` — `1` to include the DDL (`json`/`sql` only) - `limit` — rows per table (optional; the panel's preview uses `50`); omitted = every row - `database`, `schema` — the namespace, as everywhere else"
          schema:
            type: string
          example: users,orders
        - name: format
          in: query
          description: "- `tables` — comma-separated table names (required; must be tables the database reports) - `format` — `csv` | `json` | `sql` (required; `csv` takes exactly one table) - `includeSchema` — `1` to include the DDL (`json`/`sql` only) - `limit` — rows per table (optional; the panel's preview uses `50`); omitted = every row - `database`, `schema` — the namespace, as everywhere else"
          schema:
            type: string
          example: sql
        - name: includeSchema
          in: query
          description: "- `tables` — comma-separated table names (required; must be tables the database reports) - `format` — `csv` | `json` | `sql` (required; `csv` takes exactly one table) - `includeSchema` — `1` to include the DDL (`json`/`sql` only) - `limit` — rows per table (optional; the panel's preview uses `50`); omitted = every row - `database`, `schema` — the namespace, as everywhere else"
          schema:
            type: string
          example: "1"
        - name: limit
          in: query
          description: "- `tables` — comma-separated table names (required; must be tables the database reports) - `format` — `csv` | `json` | `sql` (required; `csv` takes exactly one table) - `includeSchema` — `1` to include the DDL (`json`/`sql` only) - `limit` — rows per table (optional; the panel's preview uses `50`); omitted = every row - `database`, `schema` — the namespace, as everywhere else"
          schema:
            type: string
        - name: database
          in: query
          description: "- `tables` — comma-separated table names (required; must be tables the database reports) - `format` — `csv` | `json` | `sql` (required; `csv` takes exactly one table) - `includeSchema` — `1` to include the DDL (`json`/`sql` only) - `limit` — rows per table (optional; the panel's preview uses `50`); omitted = every row - `database`, `schema` — the namespace, as everywhere else"
          schema:
            type: string
        - name: schema
          in: query
          description: "- `tables` — comma-separated table names (required; must be tables the database reports) - `format` — `csv` | `json` | `sql` (required; `csv` takes exactly one table) - `includeSchema` — `1` to include the DDL (`json`/`sql` only) - `limit` — rows per table (optional; the panel's preview uses `50`); omitted = every row - `database`, `schema` — the namespace, as everywhere else"
          schema:
            type: string
      responses:
        "200":
          description: the file — `text/csv`, `application/json` or `application/sql`, named `<table or connection>-<YYYY-MM-DD>.<ext>`
          content:
            text/csv:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                type: string
                format: binary
            application/sql:
              schema:
                type: string
                format: binary
        "400":
          description: '`{ "error": "Unknown table: nope" }`, `{ "error": "A CSV file holds one table — export the tables one at a time." }`, `{ "error": "Unknown export format \"xml\" — use csv, json or sql." }`, `{ "error": "Pick at least one table to export." }`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Unknown table: nope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/connections/{id}/data/import:
    post:
      tags:
        - Table data export / import
      summary: Import a CSV/JSON/SQL file
      description: |-
        Import a file. The file is the **raw request body** (`Content-Type: text/plain`),
        not JSON-wrapped — up to 50 MB. **The file name is all it needs**; everything else
        is read from the file:

        - **Format:** from the extension (`.csv` / `.json` / `.sql`), else sniffed from the
          content — a leading `[`/`{` is JSON, a leading SQL keyword or comment is SQL,
          anything else CSV.
        - **Target table:** a CSV or a bare JSON array goes into the table named after the
          file, minus the extension and an export's date stamp (`users-2026-10-02.csv` →
          `users`). A `tabletsgo.data` JSON or a `{ "<table>": [rows] }` map names its own
          tables. An existing table matching a name in any letter case is the one used.
        - **Missing tables are created**: from the file's own `ddl` when it is a
          `tabletsgo.data` export from the **same engine**, otherwise with column types
          inferred from the rows — `INTEGER`/`BIGINT`, `DOUBLE PRECISION`, `BOOLEAN`, else
          `TEXT` (portable names every engine reads; a CSV number with a leading zero, like a
          zip code, stays `TEXT`). CSV values are converted to those types for a table the
          import creates; for an existing table they go in as text and the database casts.
        - **SQL** runs as a script.

        - **Atomicity:** missing tables are created first; then rows land table by table,
          each table in one transaction — a failure rolls that table back and stops the
          import (the error names the tables already imported). A SQL script runs whole in
          one transaction, unless it opens its own (`BEGIN`/`COMMIT`).

        ---

        **Example:** `POST http://localhost:3000/api/connections/demo-sqlite/data/import?filename=users.csv&dryRun=1`
        with body
        ```
        id,name
        1,Ada
        2,"Lovelace, A."
        ```
      parameters:
        - name: id
          in: path
          required: true
          description: Connection id
          schema:
            type: string
          example: demo-sqlite
        - name: filename
          in: query
          description: "- `filename` — the uploaded file's name (what the format and target table come from) - `dryRun` — `1` to parse and report without writing anything - `format` — override the detected format (`csv` | `json` | `sql`) - `table` — override the target table for a CSV / bare JSON array - `createTables` — `0` to refuse instead of creating missing tables (default: create) - `database`, `schema` — the namespace"
          schema:
            type: string
          example: users.csv
        - name: format
          in: query
          description: "- `filename` — the uploaded file's name (what the format and target table come from) - `dryRun` — `1` to parse and report without writing anything - `format` — override the detected format (`csv` | `json` | `sql`) - `table` — override the target table for a CSV / bare JSON array - `createTables` — `0` to refuse instead of creating missing tables (default: create) - `database`, `schema` — the namespace"
          schema:
            type: string
        - name: table
          in: query
          description: "- `filename` — the uploaded file's name (what the format and target table come from) - `dryRun` — `1` to parse and report without writing anything - `format` — override the detected format (`csv` | `json` | `sql`) - `table` — override the target table for a CSV / bare JSON array - `createTables` — `0` to refuse instead of creating missing tables (default: create) - `database`, `schema` — the namespace"
          schema:
            type: string
        - name: createTables
          in: query
          description: "- `filename` — the uploaded file's name (what the format and target table come from) - `dryRun` — `1` to parse and report without writing anything - `format` — override the detected format (`csv` | `json` | `sql`) - `table` — override the target table for a CSV / bare JSON array - `createTables` — `0` to refuse instead of creating missing tables (default: create) - `database`, `schema` — the namespace"
          schema:
            type: string
        - name: dryRun
          in: query
          description: "- `filename` — the uploaded file's name (what the format and target table come from) - `dryRun` — `1` to parse and report without writing anything - `format` — override the detected format (`csv` | `json` | `sql`) - `table` — override the target table for a CSV / bare JSON array - `createTables` — `0` to refuse instead of creating missing tables (default: create) - `database`, `schema` — the namespace"
          schema:
            type: string
          example: "1"
        - name: database
          in: query
          description: "- `filename` — the uploaded file's name (what the format and target table come from) - `dryRun` — `1` to parse and report without writing anything - `format` — override the detected format (`csv` | `json` | `sql`) - `table` — override the target table for a CSV / bare JSON array - `createTables` — `0` to refuse instead of creating missing tables (default: create) - `database`, `schema` — the namespace"
          schema:
            type: string
        - name: schema
          in: query
          description: "- `filename` — the uploaded file's name (what the format and target table come from) - `dryRun` — `1` to parse and report without writing anything - `format` — override the detected format (`csv` | `json` | `sql`) - `table` — override the target table for a CSV / bare JSON array - `createTables` — `0` to refuse instead of creating missing tables (default: create) - `database`, `schema` — the namespace"
          schema:
            type: string
      requestBody:
        description: the file's text
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: |-
            (`dryRun=1`, rows) ```json
            { "format": "csv", "kind": "rows", "tables": [
              { "table": "products", "columns": ["id","price","active","zip"], "total": 2,
                "rows": [ /* first 50 */ ], "exists": false, "schemaFrom": "inferred",
                "types": { "id": "INTEGER", "price": "DOUBLE PRECISION", "active": "BOOLEAN", "zip": "TEXT" },
                "ddl": ["CREATE TABLE IF NOT EXISTS \"products\" (…);"] },
              { "table": "users", "columns": ["id","name"], "total": 2500, "rows": [ /* … */ ], "exists": true } ] }
            ```
            `schemaFrom` / `ddl` / `types` appear only on a table the import will create
            (`types` is `null` when the schema comes from the file).

            (`dryRun=1`, SQL) `{ "format": "sql", "kind": "script", "statements": 12, "sample": "-- first 8000 characters…" }`

            (rows) `{ "format": "json", "kind": "rows", "created": ["posts"], "tables": [{ "table": "users", "inserted": 2500 }, { "table": "posts", "inserted": 1 }] }`

            (SQL) `{ "format": "sql", "kind": "script", "statements": 12 }`
        "400":
          description: '`{ "error": "The file is not valid JSON: …" }`, `{ "error": "The file is empty." }`, `{ "error": "Importing \"users\" failed: UNIQUE constraint failed: users.id" }`, `{ "error": "No such table: posts — create it first." }` (with `createTables=0`), `{ "error": "Data import is not supported for redis connections." }`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          description: '`{ "error": "The file is larger than the 50 MB import limit." }`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: The file is larger than the 50 MB import limit.
  /api/connections/{id}/redis/keys:
    get:
      tags:
        - Redis keyspace
      summary: SCAN one page of the keyspace
      description: |-
        One `SCAN` page of the keyspace, each key enriched with its type and TTL (pipelined
        `TYPE` + `PTTL`). Uses `SCAN`, never `KEYS`, so a keyspace with millions of keys
        stays responsive. `cursor` is Redis's own opaque cursor — hand back what you got to
        fetch the next page; `done` is true once it wraps to `"0"`. Note that a page can
        legitimately come back empty while `done` is false.
      parameters:
        - name: id
          in: path
          required: true
          description: Connection id
          schema:
            type: string
          example: <id>
        - name: pattern
          in: query
          description: '`pattern` (glob, default `*`), `cursor` (default `"0"`), `count` (SCAN hint, clamped to 10–5000, default 300), `type` (filter to one Redis type), `database`'
          schema:
            type: string
          example: user:*
        - name: cursor
          in: query
          description: '`pattern` (glob, default `*`), `cursor` (default `"0"`), `count` (SCAN hint, clamped to 10–5000, default 300), `type` (filter to one Redis type), `database`'
          schema:
            type: string
        - name: count
          in: query
          description: '`pattern` (glob, default `*`), `cursor` (default `"0"`), `count` (SCAN hint, clamped to 10–5000, default 300), `type` (filter to one Redis type), `database`'
          schema:
            type: string
          example: "500"
        - name: type
          in: query
          description: '`pattern` (glob, default `*`), `cursor` (default `"0"`), `count` (SCAN hint, clamped to 10–5000, default 300), `type` (filter to one Redis type), `database`'
          schema:
            type: string
        - name: database
          in: query
          description: '`pattern` (glob, default `*`), `cursor` (default `"0"`), `count` (SCAN hint, clamped to 10–5000, default 300), `type` (filter to one Redis type), `database`'
          schema:
            type: string
          example: db2
        - name: schema
          in: query
          description: Target schema (PostgreSQL; default `public`).
          schema:
            type: string
      responses:
        "200":
          description: "`ttlMs` is `null` when the key never expires."
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                      properties:
                        key:
                          type: string
                          example: user:1:name
                        type:
                          type: string
                          example: string
                        ttlMs:
                          type: integer
                          example: 299985
                  cursor:
                    type: string
                    example: "0"
                  done:
                    type: boolean
                    example: true
              example:
                keys:
                  - key: user:1:name
                    type: string
                    ttlMs: 299985
                  - key: queue:jobs
                    type: list
                    ttlMs: null
                cursor: "0"
                done: true
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags:
        - Redis keyspace
      summary: Delete keys
      description: Delete one or more keys (`DEL`).
      parameters:
        - name: id
          in: path
          required: true
          description: Connection id
          schema:
            type: string
          example: <id>
        - name: database
          in: query
          description: "`database`"
          schema:
            type: string
        - name: schema
          in: query
          description: Target schema (PostgreSQL; default `public`).
          schema:
            type: string
      requestBody:
        description: '`{ "keys": ["user:1:name", "user:2:name"] }`'
        content:
          application/json:
            schema:
              type: object
              properties:
                keys:
                  type: array
                  items:
                    type: string
                    example: user:1:name
      responses:
        "200":
          description: "`{ \"deleted\": 2 }` (the count Redis actually removed — missing keys don't count)"
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: integer
                    example: 2
        "400":
          description: '`{ "error": "At least one key is required." }`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: At least one key is required.
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/connections/{id}/redis/overview:
    get:
      tags:
        - Redis keyspace
      summary: Redis db / key count / version
