  /api/system/update/check:
    get:
      tags:
        - System updates
      summary: Check for a newer release
      description: |-
        Resolve update state. Cached in-memory ~30 min; `refresh=1` bypasses the cache.
        On network failure it degrades to `{ ..., unreachable: true, updateAvailable: false }`.

        - `updateAvailable` is purely version-tag driven: it is `true` only when the latest release version is newer than the running version. Same-version rebuilds (moving-tag re-pushes with a different commit `sha`) are ignored and never prompt an update.
      parameters:
        - name: refresh
          in: query
          description: "`refresh` — `1`/`true` to force a fresh fetch."
          schema:
            type: string
          example: "1"
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  current:
                    type: object
                    properties:
                      version:
                        type: string
                        example: 0.15.2
                      sha:
                        type: string
                        example: 20f10b5
                  latest:
                    type: object
                    properties:
                      version:
                        type: string
                        example: 0.16.0
                      sha:
                        type: string
                        example: a1b2c3d
                  updateAvailable:
                    type: boolean
                    example: true
                  breaking:
                    type: boolean
                    example: false
                  migrations:
                    type: boolean
                    example: true
                  minUpgradeFrom:
                    type: string
                    example: 0.14.0
                  upgradeBlocked:
                    type: boolean
                    example: false
                  image:
                    type: string
                    example: ghcr.io/aidapedia/tabletsgo:0.16.0
                  applyMethod:
                    type: string
                    example: webhook
                  checkedAt:
                    type: integer
                    example: 1752800000000
                  releases:
                    type: array
                    items:
                      type: object
                      properties:
                        version:
                          type: string
                          example: 0.16.0
                        name:
                          type: string
                          example: v0.16.0
                        notes:
                          type: string
                          example: "# What's new\\n- ..."
                        url:
                          type: string
                          example: https://github.com/aidapedia/tabletsgo/releases/tag/v0.16.0
                        publishedAt:
                          type: string
                          example: 2026-07-18T00:00:00Z
              example:
                current:
                  version: 0.15.2
                  sha: 20f10b5
                latest:
                  version: 0.16.0
                  sha: a1b2c3d
                updateAvailable: true
                breaking: false
                migrations: true
                minUpgradeFrom: 0.14.0
                upgradeBlocked: false
                image: ghcr.io/aidapedia/tabletsgo:0.16.0
                applyMethod: webhook
                checkedAt: 1752800000000
                releases:
                  - version: 0.16.0
                    name: v0.16.0
                    notes: |-
                      # What's new
                      - ...
                    url: https://github.com/aidapedia/tabletsgo/releases/tag/v0.16.0
                    publishedAt: 2026-07-18T00:00:00Z
        "401":
          $ref: "#/components/responses/Unauthorized"
