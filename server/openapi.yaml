  /api/connections/{id}/streams/schemas/{subject}:
    get:
      tags:
        - Kafka ecosystem services
      summary: A subject's versions
      description: "One subject: every version's schema (newest first), and its compatibility rule — its own, or the registry's when `compatibilityInherited`."
      parameters:
        - name: id
          in: path
          required: true
          description: Connection id
          schema:
            type: string
          example: <id>
        - name: subject
          in: path
          required: true
          schema:
            type: string
          example: orders.paid-value
        - name: database
          in: query
          description: Target database on the same server (PostgreSQL multi-database browsing; on Redis the numbered database, as `db0`…`dbN` or a bare index).
          schema:
            type: string
        - name: schema
          in: query
          description: Target schema (PostgreSQL; default `public`).
          schema:
            type: string
      responses:
        "200":
          description: '`{ "subject": "orders.paid-value", "compatibility": "BACKWARD", "compatibilityInherited": true, "registryCompatibility": "BACKWARD", "versions": [{ "version": 3, "id": 12, "type": "AVRO", "schema": "{\"type\":\"record\",…}", "references": [] }] }`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  subject:
                    type: string
                    example: orders.paid-value
                  compatibility:
                    type: string
                    example: BACKWARD
                  compatibilityInherited:
                    type: boolean
                    example: true
                  registryCompatibility:
                    type: string
                    example: BACKWARD
                  versions:
                    type: array
                    items:
                      type: object
                      properties:
                        version:
                          type: integer
                          example: 3
                        id:
                          type: integer
                          example: 12
                        type:
                          type: string
                          example: AVRO
                        schema:
                          type: string
                          example: '{\"type\":\"record\",…}'
                        references:
                          type: array
                          items: {}
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags:
        - Kafka ecosystem services
      summary: Register / check a schema
      description: |-
        Register a schema — a new subject, or its next version. With `validateOnly` it is
        only tested against the subject's compatibility rule. A schema without references is
        compiled locally first, so a syntax error is named precisely.
      parameters:
        - name: id
          in: path
          required: true
          description: Connection id
          schema:
            type: string
          example: <id>
        - name: subject
          in: path
          required: true
          schema:
            type: string
          example: orders.paid-value
        - name: database
          in: query
          description: Target database on the same server (PostgreSQL multi-database browsing; on Redis the numbered database, as `db0`…`dbN` or a bare index).
          schema:
            type: string
        - name: schema
          in: query
          description: Target schema (PostgreSQL; default `public`).
          schema:
            type: string
      requestBody:
        description: '`{ "schema": "syntax = \"proto3\"; …", "type": "PROTOBUF", "references": [], "validateOnly": false }` — `type`: AVRO (default), PROTOBUF or JSON.'
        content:
          application/json:
            schema:
              type: object
              properties:
                schema:
                  type: string
                type:
                  type: string
                  example: PROTOBUF
                references:
                  type: array
                  items: {}
                validateOnly:
                  type: boolean
                  example: false
      responses:
        "200":
          description: "`{ \"id\": 13, \"version\": 4 }`; with `validateOnly`: `{ \"compatible\": false, \"messages\": [\"{errorType:'READER_FIELD_MISSING_DEFAULT_VALUE', …}\"] }`"
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    example: 13
                  version:
                    type: integer
                    example: 4
        "400":
          description: '`{ "error": "Invalid Avro schema: unknown type: \"recrd\"" }`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: 'Invalid Avro schema: unknown type: \"recrd\"'
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: '`{ "error": "The schema is incompatible with \"orders.paid-value\" under its compatibility rule: …" }`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
    delete:
      tags:
        - Kafka ecosystem services
      summary: Delete subject / version (confirm)
      description: |-
        Delete a subject or one version. Soft by default — the schema still resolves by id,
        so messages written with it stay readable; `permanent` erases it (the soft delete
        the registry requires first is done for you).
      parameters:
        - name: id
          in: path
          required: true
          description: Connection id
