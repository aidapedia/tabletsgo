        The name (spaces → `-`) becomes the public key's comment.
      requestBody:
        description: |-
          (generate) `{ "workspaceId": "ws-1", "name": "Prod bastion", "mode": "generate", "algorithm": "ed25519" }` — `algorithm`: `ed25519` (default) | `ecdsa` (P-256) | `rsa` (4096)

          (import) `{ "workspaceId": "ws-1", "name": "Laptop key", "mode": "import", "privateKey": "-----BEGIN OPENSSH PRIVATE KEY-----\n…", "passphrase": "optional" }`
        content:
          application/json:
            schema:
              type: object
              properties:
                workspaceId:
                  type: string
                  example: ws-1
                name:
                  type: string
                  example: Prod bastion
                mode:
                  type: string
                  example: generate
                algorithm:
                  type: string
                  example: ed25519
            examples:
              generate:
                value:
                  workspaceId: ws-1
                  name: Prod bastion
                  mode: generate
                  algorithm: ed25519
              import:
                value:
                  workspaceId: ws-1
                  name: Laptop key
                  mode: import
                  privateKey: |-
                    -----BEGIN OPENSSH PRIVATE KEY-----
                    …
                  passphrase: optional
      responses:
        "200":
          description: the key (same shape as the list) — copy `publicKey` into `authorized_keys`
        "400":
          description: '`{ "error": "A name is required." }` · `{ "error": "That is a public key — paste the private key (the file without .pub)." }` · `{ "error": "This key is encrypted — enter its passphrase." }`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: A name is required.
        "401":
