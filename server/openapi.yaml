  /api/workspaces/{id}/workflows:
    get:
      tags:
        - Workflows
      summary: Every workflow in a workspace, across the connections the caller can open —
      description: |-
        Every workflow in a workspace, across the connections the caller can open —
        what the home area's **Workflow** section lists (one request instead of one per
        connection). Newest first, no graph body. `lastRun` is the most recent recorded
        run (`null` if it has never run), `nextRunAt` the scheduled next fire.

        Membership gates the workspace; each connection is then filtered by connection
        access, so this never shows a workflow the per-connection route below would
        refuse.
      parameters:
        - name: id
          in: path
          required: true
          description: Workspace id
          schema:
            type: string
          example: ws-1
      responses:
        "200":
          description: '`[{ "id", "connectionId", "connectionName", "connectionType", "name", "ts", "protected", "scheduleEnabled", "nextRunAt", "folderId", "lastRun": { "status": "success" | "failed", "at" } | null }]`'
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: {}
                    connectionId: {}
                    connectionName: {}
                    connectionType: {}
                    name: {}
                    ts: {}
                    protected: {}
                    scheduleEnabled: {}
                    nextRunAt: {}
                    folderId: {}
                    lastRun:
                      type:
                        - object
                        - "null"
                      properties:
                        status:
                          type: string
                          enum:
                            - success
                            - failed
                        at: {}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: '`{ "error": "Forbidden" }` — not a member of the workspace.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Forbidden
