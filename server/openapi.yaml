  /api/connections/{id}/streams/sql:
    post:
      tags:
        - Kafka ecosystem services
      summary: Run KSQL (bounded queries)
      description: |-
        Run KSQL. Statements (CREATE, SHOW, DESCRIBE, DROP, TERMINATE, …) run together in one
        call and each answers on its own; a `SELECT` or `PRINT` must be sent alone and is
        **bounded like a topic read** — a push query (`EMIT CHANGES`) returns what arrived
        within `limit` rows (max the module's messages per read) or its read time limit, then
        stops. `properties` are streams properties.
      parameters:
        - name: id
          in: path
          required: true
          description: Connection id
          schema:
            type: string
          example: <id>
        - name: database
          in: query
          description: Target database on the same server (PostgreSQL multi-database browsing; on Redis the numbered database, as `db0`…`dbN` or a bare index).
          schema:
            type: string
        - name: schema
          in: query
          description: Target schema (PostgreSQL; default `public`).
          schema:
            type: string
      requestBody:
        description: '`{ "sql": "SELECT * FROM pageviews EMIT CHANGES;", "properties": { "auto.offset.reset": "earliest" }, "limit": 100 }`'
        content:
          application/json:
            schema:
              type: object
              properties:
                sql:
                  type: string
                  example: SELECT * FROM pageviews EMIT CHANGES;
                properties:
                  type: object
                  properties:
                    auto.offset.reset:
                      type: string
                      example: earliest
                limit:
                  type: integer
                  example: 100
      responses:
        "200":
          description: |-
            A statement answers `{ "statement": "CREATE STREAM …", "type": "message", "message": "Stream created" }`;
            `DESCRIBE` answers its fields as rows plus a `message` summary.
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        statement:
                          type: string
                          example: SELECT * FROM pageviews EMIT CHANGES
                        type:
                          type: string
                          example: rows
                        columns:
                          type: array
                          items:
                            type: string
                            example: USER
                        rows:
                          type: array
                          items:
                            type: object
                            properties:
                              USER:
                                type: string
                                example: u0
                              PAGE:
                                type: string
                                example: /p0
                        queryId:
                          type: string
                        truncated:
                          type: boolean
                          example: true
                        cappedBy:
                          type: string
                          example: rows
              example:
                results:
                  - statement: SELECT * FROM pageviews EMIT CHANGES
                    type: rows
                    columns:
                      - USER
                      - PAGE
                    rows:
                      - USER: u0
                        PAGE: /p0
                    queryId: transient_…
                    truncated: true
                    cappedBy: rows
        "400":
          description: "`{ \"error\": \"Run a SELECT or PRINT on its own — not together with other statements.\" }` or ksqlDB's own, e.g. `{ \"error\": \"Exception while preparing statement: NOPE does not exist.\" }`"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Run a SELECT or PRINT on its own — not together with other statements.
        "401":
          $ref: "#/components/responses/Unauthorized"
