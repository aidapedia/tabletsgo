  /api/connections/{id}/workflows/{wid}/run:
    post:
      tags:
        - Workflows
      summary: Execute a workflow
      description: |-
        Execute a workflow. Runs the posted `graph` (so unsaved edits can be tested), or
        the stored graph when `graph` is omitted. Always records the outcome in `workflow_runs`
        (`trigger_kind` from `trigger`).
      parameters:
        - name: id
          in: path
          required: true
          description: Connection id
          schema:
            type: string
          example: demo-sqlite
        - name: wid
          in: path
          required: true
          description: Workflow id
          schema:
            type: string
          example: wf-1
      requestBody:
        description: '`{ "graph"?: { "nodes": [...], "edges": [...] }, "input"?: <any JSON>, "trigger"?: "manual" | "dashboard" }` - `input` (optional) seeds the trigger node — it flows to downstream nodes as their initial input (JS nodes read it as `input`, query nodes can inline scalars via `{{input.field}}`). Dashboard table-widget row actions post the clicked row here as a column→value object. - `trigger` (optional) tags the run in `workflow_runs.trigger_kind` for auditing: `"dashboard"` for dashboard row-action runs; anything else records `"manual"`.'
        content:
          application/json:
            schema:
              type: object
              properties:
                graph:
                  type: object
                  properties:
                    nodes:
                      type: array
                      items: {}
                    edges:
                      type: array
                      items: {}
                input: {}
                trigger:
                  type: string
                  enum:
                    - manual
                    - dashboard
      responses:
        "200":
          description: "`{ \"ok\": true, \"log\": [{ \"nodeId\", \"nodeType\", \"status\", \"ms\", \"output\", \"logs\"?, \"error\"? }], \"output\": <terminal output> }` - On a failed node: `{ \"ok\": false, \"log\": [...], \"error\": \"<message>\" }` (the failing node's `log` entry has `status: \"error\"`)"
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  log:
                    type: array
                    items:
                      type: object
                      properties:
                        nodeId: {}
                        nodeType: {}
                        status: {}
                        ms: {}
                        output: {}
                        logs: {}
                        error: {}
                  output: {}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: '`{ "error": "Connection not found" }` or `{ "error": "Not found" }`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Connection not found
  /api/connections/{id}/workflows/{wid}/runs:
    get:
      tags:
        - Workflows
      summary: The workflow's activity trail — recent runs (newest first), across every trigger
      description: |-
        The workflow's activity trail — recent runs (newest first), across every trigger
        (`manual` / `dashboard` / `schedule` / `webhook`). The per-node `log` is omitted here;
        fetch a single run for it.
      parameters:
        - name: id
          in: path
          required: true
          description: Connection id
          schema:
            type: string
          example: demo-sqlite
        - name: wid
          in: path
          required: true
          description: Workflow id
          schema:
