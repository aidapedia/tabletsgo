              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: {}
                    workspaceId: {}
                    name: {}
                    host:
                      type: string
                      example: bastion.example.com
                    port:
                      type: integer
                      example: 22
                    username:
                      type: string
                      example: ubuntu
                    auth:
                      type: string
                      example: key
                    keyId:
                      type: string
                      example: key-1
                    keyName:
                      type: string
                      example: Prod bastion
                    transport:
                      type: string
                      example: tcp
                    serviceTokenId:
                      type: string
                      example: ""
                    hasServiceToken:
                      type: boolean
                      example: false
                    hostFingerprint:
                      type:
                        - string
                        - "null"
                      enum:
                        - SHA256:…
                        - null
                    hasPassword:
                      type: boolean
                      example: false
                    createdAt: {}
                    updatedAt: {}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: '`{ "error": "Forbidden" }`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Forbidden
    post:
      tags:
        - SSH keys & gateways
      summary: Create a gateway
      description: Create a gateway. Requires `ssh.manage`.
      requestBody:
        description: |-
          (key) `{ "workspaceId": "ws-1", "name": "Bastion", "host": "bastion.example.com", "port": 22, "username": "ubuntu", "auth": "key", "keyId": "key-1" }`

          (password) `{ "workspaceId": "ws-1", "name": "Bastion", "host": "10.0.0.5", "port": 22, "username": "ops", "auth": "password", "password": "…" }`

          (Railway) `{ "workspaceId": "ws-1", "name": "Railway — api", "host": "ssh.railway.com", "port": 22, "username": "api.up.railway.app", "auth": "key", "keyId": "key-1" }`

          (Cloudflare Access) `{ "workspaceId": "ws-1", "name": "Office (Cloudflare)", "transport": "cloudflare", "host": "ssh.example.com", "username": "ubuntu", "auth": "key", "keyId": "key-1", "serviceTokenId": "abc123.access", "serviceTokenSecret": "…" }` — the token is optional only if the Access application bypasses authentication
        content:
          application/json:
            schema:
              type: object
              properties:
                workspaceId:
                  type: string
                  example: ws-1
                name:
                  type: string
                  example: Bastion
                host:
                  type: string
                  example: bastion.example.com
                port:
                  type: integer
                  example: 22
                username:
                  type: string
                  example: ubuntu
                auth:
                  type: string
                  example: key
                keyId:
                  type: string
                  example: key-1
            examples:
              key:
                value:
                  workspaceId: ws-1
                  name: Bastion
                  host: bastion.example.com
                  port: 22
                  username: ubuntu
                  auth: key
                  keyId: key-1
              password:
                value:
                  workspaceId: ws-1
                  name: Bastion
                  host: 10.0.0.5
                  port: 22
                  username: ops
                  auth: password
                  password: …
              Railway:
                value:
                  workspaceId: ws-1
                  name: Railway — api
                  host: ssh.railway.com
                  port: 22
                  username: api.up.railway.app
                  auth: key
                  keyId: key-1
              Cloudflare Access:
                value:
                  workspaceId: ws-1
                  name: Office (Cloudflare)
                  transport: cloudflare
                  host: ssh.example.com
                  username: ubuntu
                  auth: key
                  keyId: key-1
                  serviceTokenId: abc123.access
                  serviceTokenSecret: …
      responses:
        "200":
          description: the gateway
        "400":
          description: "`{ \"error\": \"A host is required.\" }` · `{ \"error\": \"Pick one of this workspace's SSH keys.\" }` (missing key, or one from another workspace) · `{ \"error\": \"The port must be between 1 and 65535.\" }` · `{ \"error\": \"Enter the service token secret.\" }` · `{ \"error\": \"Unknown transport \\\"x\\\".\" }`"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: A host is required.
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/ssh/gateways/{gid}:
    put:
      tags:
        - SSH keys & gateways
      summary: Update a gateway (partial patch)
      description: |-
        Update a gateway (partial patch). An omitted `password` or `serviceTokenSecret`
        keeps the stored one (a stored secret only stays with the same `serviceTokenId`;
        `"serviceTokenId": ""` clears the token). Changing `host`, `port` or `transport`
        forgets the pinned host key, and so does `"resetHostKey": true`. Every connection using the
        gateway has its tunnel, pools and sessions dropped.
      parameters:
        - name: gid
          in: path
          required: true
          schema:
            type: string
          example: gw-1
      requestBody:
        description: '`{ "name"?, "host"?, "port"?, "username"?, "auth"?, "keyId"?, "password"?, "transport"?, "serviceTokenId"?, "serviceTokenSecret"?, "resetHostKey"? }`'
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {}
                host: {}
                port: {}
                username: {}
                auth: {}
                keyId: {}
                password: {}
                transport: {}
                serviceTokenId: {}
                serviceTokenSecret: {}
                resetHostKey: {}
      responses:
        "200":
          description: the gateway
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags:
        - SSH keys & gateways
      summary: Delete an SSH gateway
      parameters:
        - name: gid
          in: path
          required: true
          schema:
            type: string
          example: gw-1
      responses:
        "200":
          description: '`{ "ok": true }`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: '`{ "error": "This SSH host is used by \"Prod DB\". Switch those connections to another SSH host (or none) first." }`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: This SSH host is used by \"Prod DB\". Switch those connections to another SSH host (or none) first.
  /api/ssh/gateways/{gid}/test:
    post:
      tags:
        - SSH keys & gateways
      summary: Log in to the gateway with its stored credentials (pins the host key on first
      description: |-
        Log in to the gateway with its stored credentials (pins the host key on first
        success). Requires `ssh.manage`. Never fails with a 5xx.

        ---
      parameters:
        - name: gid
          in: path
          required: true
          schema:
            type: string
          example: gw-1
      responses:
        "200":
          description: |-
            (success) `{ "ok": true, "message": "Logged in to bastion.example.com as ubuntu.", "hostFingerprint": "SHA256:…" }`

            (failure) `{ "ok": false, "message": "The SSH host bastion.example.com:22 rejected user \"ubuntu\".", "hint": "Add the key \"Prod bastion\"'s public key to ~ubuntu/.ssh/authorized_keys on the SSH host." }`

            (Cloudflare refused) `{ "ok": false, "message": "Cloudflare Access refused ssh.example.com (HTTP 403).", "hint": "Check the service token ID and secret, …" }` — a `302` means Access wanted a login (no accepted token); `502`/`503`/`530` mean nothing answered behind the tunnel.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Logged in to bastion.example.com as ubuntu.
                  hostFingerprint:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/connections/{id}/backup/schedule:
    get:
      tags:
        - Backup
      summary: Current backup schedule
      description: Current backup schedule for this connection (`null` if none exists yet).
      parameters:
        - name: id
          in: path
          required: true
          description: Connection id
          schema:
            type: string
          example: demo-sqlite
      responses:
        "200":
          description: '`{ "schedule": { "connectionId", "enabled", "frequency": "hourly"|"daily", "hourOfDay", "destinationIds", "retryLimit", "retryDelaySec", "retentionDays", "encrypt", "includeConfig" } | null }`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  schedule:
                    type:
                      - object
                      - "null"
                    properties:
                      connectionId: {}
                      enabled: {}
                      frequency:
                        type: string
                        enum:
                          - hourly
                          - daily
                      hourOfDay: {}
                      destinationIds: {}
                      retryLimit: {}
                      retryDelaySec: {}
                      retentionDays: {}
                      encrypt: {}
                      includeConfig: {}
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags:
        - Backup
      summary: Create the backup schedule
      description: Create the connection's backup schedule. 409s if one already exists.
      parameters:
        - name: id
          in: path
          required: true
          description: Connection id
          schema:
            type: string
          example: demo-sqlite
      requestBody:
        description: "`{ \"frequency\": \"hourly\"|\"daily\", \"hourOfDay\"?: 0-23, \"destinationIds\": string[], \"retryLimit\"?: 0-5, \"retryDelaySec\"?: number, \"retentionDays\"?: number, \"encrypt\"?: boolean, \"includeConfig\"?: boolean, \"enabled\"?: boolean }` - `includeConfig` (default `false`) also uploads the connection's export JSON with each run — see the note above. - `destinationIds` may include real `storage_destinations.id`s and/or the reserved `\"local\"` (server disk). An **empty array is allowed** and falls back to `[\"local\"]` at run time — see the \"local\" destination note under Storage destinations above."
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: '`{ "schedule": {...} }` (same shape as GET)'
          content:
            application/json:
              schema:
                type: object
                properties:
                  schedule:
                    type: object
        "400":
          description: invalid frequency/destinations, or connection type isn't sqlite/postgresql
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: '`{ "error": "This connection already has a backup schedule." }`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: This connection already has a backup schedule.
    put:
      tags:
        - Backup
      summary: Update the backup schedule
      description: |-
        Update any subset of the schedule's fields — same body shape as POST, all
        fields optional (unset ones keep their stored value). This is also how
        Active/Paused toggles, via a lightweight `{ "enabled": false }` body.
      parameters:
        - name: id
          in: path
          required: true
          description: Connection id
          schema:
            type: string
          example: demo-sqlite
      responses:
        "200":
          description: '`{ "schedule": {...} }`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  schedule:
                    type: object
        "400":
          description: invalid frequency/destinations
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: '`{ "error": "No backup schedule exists for this connection." }`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: No backup schedule exists for this connection.
      requestBody:
        description: Same shape as `POST`, every field optional — unset ones keep their stored value.
        content:
          application/json:
            schema:
              type: object
  /api/connections/{id}/backup/run:
    post:
      tags:
        - Backup
      summary: Run the backup schedule now
      description: |-
        Run the schedule immediately ("Run now") — a single attempt, no retry.

        Scheduled runs (the minutely cron tick, `WORKFLOW_SCHEDULER_ENABLED`) retry on
        failure up to `retryLimit` times with `retryDelaySec` between attempts, each
        attempt its own `backup_runs` row (`trigger: "retry"`). If the schedule still
        ends up failed after retries, the workspace's backup-failure notification
        fires (see Workspaces → Notifications above).
      parameters:
        - name: id
          in: path
          required: true
          description: Connection id
          schema:
            type: string
          example: demo-sqlite
      responses:
        "200":
          description: '`{ "ok": true|false, "error"?, "uploads": [...] }`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    oneOf:
                      - type: boolean
                        example: true
                      - type: boolean
                        example: false
                  error: {}
                  uploads:
                    type: array
                    items: {}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: connection or schedule not found
  /api/connections/{id}/backup/calendar:
    get:
      tags:
        - Backup
      summary: Per-day backup run counts
      description: |-
        Per-day run counts (feeds the GitHub-style calendar — one color for "backed up
        that day"; failures get their own reserved color).
      parameters:
        - name: id
          in: path
          required: true
          description: Connection id
          schema:
            type: string
          example: demo-sqlite
        - name: days
          in: query
          schema:
            type: string
          example: "90"
      responses:
        "200":
          description: '`{ "days": [{ "day": "2026-07-05", "runs": 2, "success": 2, "failed": 0 }, ...] }`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  days:
                    type: array
                    items:
                      type: object
                      properties:
                        day:
                          type: string
                          example: 2026-07-05
                        runs:
                          type: integer
                          example: 2
                        success:
                          type: integer
                          example: 2
                        failed:
                          type: integer
                          example: 0
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/connections/{id}/backup/runs:
    get:
      tags:
        - Backup
      summary: Paginated backup runs
      description: |-
        Paginated backup runs, including per-destination upload results (size,
        encrypted, pruned count) the version list needs. Optional `date=YYYY-MM-DD`
        filters to one UTC day (what clicking a calendar cell does in the UI).
      parameters:
        - name: id
          in: path
          required: true
          description: Connection id
          schema:
            type: string
          example: demo-sqlite
        - name: limit
          in: query
          description: Row cap (default `200` for table data).
          schema:
            type: string
          example: "20"
        - name: offset
          in: query
          schema:
            type: string
          example: "20"
        - name: date
          in: query
          schema:
            type: string
      responses:
        "200":
          description: '`{ "total": number, "runs": [{ "id", "trigger": "manual"|"schedule"|"retry", "status", "error"?, "startedAt", "finishedAt", "uploads": [{ "destinationId", "ok", "key"?, "sizeBytes"?, "error"?, "encrypted"?, "prunedCount"?, "pruneError"?, "deleted"?, "configKey"?, "configSizeBytes"?, "configEncrypted"?, "configError"? }] }] }`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: number
                  runs:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {}
                        trigger:
                          type: string
                          enum:
                            - manual
                            - schedule
                            - retry
                        status: {}
                        error: {}
                        startedAt: {}
                        finishedAt: {}
                        uploads:
                          type: array
                          items:
                            type: object
                            properties:
                              destinationId: {}
                              ok: {}
                              key: {}
                              sizeBytes: {}
                              error: {}
                              encrypted: {}
                              prunedCount: {}
                              pruneError: {}
                              deleted: {}
                              configKey: {}
                              configSizeBytes: {}
                              configEncrypted: {}
                              configError: {}
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/connections/{id}/backup/runs/{runId}/uploads/{destinationId}:
    delete:
      tags:
        - Backup
      summary: Delete a backup version
      description: |-
        Permanently deletes that uploaded artifact from storage — together with the
        connection-config JSON (`configKey`) the same run shipped, so no orphan is left
        behind. The `backup_runs` row and other uploads in it are untouched — this
        upload is marked `deleted: true` (history stays visible; Restore/Download
        disappear for it). Irreversible.
      parameters:
        - name: id
          in: path
          required: true
          description: Connection id
          schema:
            type: string
          example: demo-sqlite
        - name: runId
          in: path
          required: true
          schema:
            type: string
          example: run-1
        - name: destinationId
          in: path
          required: true
          schema:
            type: string
          example: storage-1
      responses:
        "200":
          description: '`{ "ok": true }`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: run or deletable upload not found
        "500":
          description: '`{ "error": "<message>" }` (storage delete failure)'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /api/connections/{id}/backup/runs/{runId}/uploads/{destinationId}/download:
    get:
      tags:
        - Backup
      summary: Download a backup version
      description: |-
        Downloads that uploaded artifact (decrypted server-side first if `encrypted`)
        as a file attachment (`Content-Disposition`).
      parameters:
        - name: id
          in: path
          required: true
          description: Connection id
          schema:
            type: string
          example: demo-sqlite
        - name: runId
          in: path
          required: true
          schema:
            type: string
          example: run-1
        - name: destinationId
          in: path
          required: true
          schema:
            type: string
          example: storage-1
        - name: artifact
          in: query
          description: "`artifact` (optional — `config` downloads the connection JSON the run shipped beside the dump, named `<connection>-<date>.connection.json`; omitted/`dump` downloads the database dump)"
          schema:
            type: string
          example: config
      responses:
        "200":
          description: binary file stream
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: run or downloadable upload not found (`No downloadable configuration found for this destination` when the run shipped no config)
        "500":
          description: '`{ "error": "<message>" }`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /api/connections/{id}/backup/restore:
    post:
      tags:
        - Backup
      summary: Restore a backup version
      description: |-
        Download a past backup artifact and overwrite a connection's live data in
        place (sqlite: atomic file replace; postgresql: `pg_restore --clean --if-exists`;
        mysql: the dump replayed with `mysql`, which drops and recreates each table it holds).
        Defaults to overwriting the source connection (`:id`); pass
        `targetConnectionId` to restore into any **other** connection instead, as long
        as it's in the same workspace and the same database type. If the matched
        upload was `encrypted`, it's decrypted automatically first.
      parameters:
        - name: id
          in: path
          required: true
          description: Connection id
          schema:
            type: string
          example: demo-sqlite
      requestBody:
        description: "`{ \"runId\", \"destinationId\", \"confirmName\": \"<must equal the TARGET connection's name>\", \"targetConnectionId\"?: string }`"
        content:
          application/json:
            schema:
              type: object
              properties:
                runId: {}
                destinationId: {}
                confirmName:
                  type: string
                targetConnectionId:
                  type: string
      responses:
        "200":
          description: '`{ "ok": true }`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
        "400":
          description: confirmation mismatch, target in a different workspace/type, or no successful upload found for that destination
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: connection/run/destination not found
        "500":
          description: '`{ "ok": false, "error": "<message>" }` (download/dialect-restore failure)'
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: false
                  error:
                    type: string
  /api/connections/{id}/restore/storage-objects:
    get:
      tags:
        - Backup
      summary: Browse a storage destination's files
      description: |-
        Lists a storage destination's stored files (newest first, capped at 500) so
        the restore-from-storage picker can browse what's actually in the bucket (or
        under `data/backups/` for `destinationId=local`). The destination must be the
        built-in local disk or belong to the connection's workspace. S3 listings are
        scoped to the destination's `pathPrefix`.
      parameters:
        - name: id
          in: path
          required: true
          description: Connection id
          schema:
            type: string
          example: demo-sqlite
        - name: destinationId
          in: query
          schema:
            type: string
          example: storage-1
      responses:
        "200":
          description: '`{ "objects": [{ "key": "myconn/2026-07-18/abc.dump.enc", "sizeBytes": 12345, "lastModified": 1752800000000|null }] }`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  objects:
                    type: array
                    items:
                      type: object
                      properties:
                        key:
                          type: string
                          example: myconn/2026-07-18/abc.dump.enc
                        sizeBytes:
                          type: integer
                          example: 12345
                        lastModified:
                          type:
                            - integer
                            - "null"
                          example: 1752800000000
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: connection or storage destination not found
        "500":
          description: '`{ "error": "<message>" }` (S3 listing failure)'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /api/connections/{id}/restore/from-storage:
    post:
      tags:
        - Backup
      summary: Restore from a picked storage object
      description: |-
        Restores connection `:id` from any object in a storage destination — not just
        tracked backup runs (use `POST .../backup/restore` for those). Keys ending in
        `.enc` are decrypted server-side with this server's `ENCRYPTION_KEY` first.
        SQLite targets are validated against the SQLite file header before the live
        file is overwritten. Gated by typing the connection's name.
      parameters:
        - name: id
          in: path
          required: true
          description: Connection id
          schema:
            type: string
          example: demo-sqlite
      requestBody:
        description: "`{ \"destinationId\", \"key\", \"confirmName\": \"<must equal the connection's name>\" }`"
        content:
          application/json:
            schema:
              type: object
              properties:
                destinationId: {}
                key: {}
                confirmName:
                  type: string
      responses:
        "200":
          description: '`{ "ok": true }`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
        "400":
          description: confirmation mismatch, missing key, unsupported connection type, or invalid local key
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: connection or storage destination not found
        "500":
          description: '`{ "ok": false, "error": "<message>" }` (fetch/decrypt/restore failure)'
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: false
                  error:
                    type: string
  /api/connections/{id}/restore/upload:
    post:
      tags:
        - Backup
      summary: Restore from an uploaded file
      description: |-
        Restores connection `:id` from a backup file uploaded by the client. The file
        is the **raw request body** (`Content-Type: application/octet-stream` — not
        multipart), streamed to a temp file; `filename` and `confirmName` ride the
        query string (URL-encoded). Max 2 GB. A `filename` ending in `.enc` is
        decrypted server-side first; SQLite targets are header-validated as above.

        ---
      parameters:
        - name: id
          in: path
          required: true
          description: Connection id
          schema:
            type: string
          example: demo-sqlite
        - name: confirmName
          in: query
          schema:
            type: string
          example: Demo SQLite
        - name: filename
          in: query
          schema:
            type: string
          example: backup.sqlite
      requestBody:
        description: raw file bytes
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: '`{ "ok": true }`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
        "400":
          description: confirmation mismatch, unsupported connection type, or empty upload
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          description: upload exceeds the 2 GB limit
        "500":
          description: '`{ "ok": false, "error": "<message>" }` (decrypt/restore failure)'
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: false
                  error:
                    type: string
  /api/connections/{id}/schema/migrations:
    post:
      tags:
        - Schema migrations
      summary: Record a DDL commit, bump version
      description: Record a successfully-executed DDL batch and bump `schema_version`.
      parameters:
        - name: id
          in: path
          required: true
          description: Connection id
          schema:
            type: string
          example: demo-sqlite
      requestBody:
        description: '`{ "statements": [{ "sql": "CREATE TABLE \"orders\" (...)", "rollbackSql": "DROP TABLE \"orders\";", "reversible": true, "label": "Create table orders" }, ...] }`'
        content:
          application/json:
            schema:
              type: object
              properties:
                statements:
                  type: array
                  items:
                    type: object
                    properties:
                      sql:
                        type: string
                        example: CREATE TABLE \"orders\" (...)
                      rollbackSql:
                        type: string
                        example: DROP TABLE \"orders\";
                      reversible:
                        type: boolean
                        example: true
                      label:
                        type: string
                        example: Create table orders
      responses:
        "200":
          description: '`{ "version": 2, "migration": { "id", "connectionId", "version", "forwardSql": [...], "rollbackSql": [...], "reversible": true, "status": "active", "executorId", "executorName", "ts" } }`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: integer
                    example: 2
                  migration:
                    type: object
                    properties:
                      id: {}
                      connectionId: {}
                      version: {}
                      forwardSql:
                        type: array
                        items: {}
                      rollbackSql:
                        type: array
                        items: {}
                      reversible:
                        type: boolean
                        example: true
                      status:
                        type: string
                        example: active
                      executorId: {}
                      executorName: {}
                      ts: {}
        "400":
          description: '`{ "error": "At least one statement is required" }`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: At least one statement is required
        "401":
          $ref: "#/components/responses/Unauthorized"
    get:
      tags:
        - Schema migrations
      summary: List schema migration history
      description: List a connection's migration history, newest first (ordered by timestamp).
      parameters:
        - name: id
          in: path
          required: true
          description: Connection id
          schema:
            type: string
          example: demo-sqlite
      responses:
        "200":
          description: '`[{ "id", "version", "forwardSql": [...], "rollbackSql": [...], "reversible", "status": "active" | "rollbacked", "executorId", "executorName", "ts" }]`'
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: {}
                    version: {}
                    forwardSql:
                      type: array
                      items: {}
                    rollbackSql:
                      type: array
                      items: {}
                    reversible: {}
                    status:
                      type: string
                      enum:
                        - active
                        - rollbacked
                    executorId: {}
                    executorName: {}
                    ts: {}
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/connections/{id}/schema/rollback:
    post:
      tags:
        - Schema migrations
      summary: Roll schema back to a version
      description: |-
        Roll the schema back to `toVersion`. Runs the down SQL for every still-active
        version newer than `toVersion` (newest first), marks those `rollbacked`, and
        resets the connection's `schemaVersion` to `toVersion`. Requires every affected
        version to be reversible. The target version itself stays active.

        ---
      parameters:
        - name: id
          in: path
          required: true
          description: Connection id
          schema:
            type: string
          example: demo-sqlite
      requestBody:
        description: '`{ "toVersion": 1, "database": "…"?, "schema": "…"? }` (`database`/`schema` optional, PG only)'
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: '`{ "version": 1, "rolledBack": [3, 2] }`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: integer
                    example: 1
                  rolledBack:
                    type: array
                    items:
                      type: integer
                      example: 3
        "400":
          description: "`{ \"error\": \"Nothing to roll back for that version\" }` / `{ \"error\": \"v3 is not reversible — can't roll back past it\" }`"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Nothing to roll back for that version
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: '`{ "error": "Connection not found" }`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Connection not found
        "500":
          description: '`{ "error": "Rollback failed: <db message>" }`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Rollback failed: <db message>"
  /api/connections/{id}/ping:
    get:
      tags:
        - Schema & data browsing
      summary: Connectivity check `{ ok }`
      description: |-
        Connectivity check — tries to reach the database (`SELECT 1`). Generic across
        engines; the client uses it to detect a dropped connection.
      parameters:
        - name: id
          in: path
          required: true
          description: Connection id
          schema:
            type: string
          example: demo-pg
        - name: database
          in: query
          description: optional `database`, `schema` (PG)
          schema:
            type: string
        - name: schema
          in: query
          description: optional `database`, `schema` (PG)
          schema:
            type: string
      responses:
        "200":
          description: '`{ "ok": true }` or `{ "ok": false, "error": "<msg>" }` (both HTTP 200)'
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: '`{ "ok": false, "error": "Connection not found" }`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: false
                  error:
                    type: string
                    example: Connection not found
  /api/connections/{id}/server-version:
    get:
      tags:
        - Schema & data browsing
      summary: The engine's release `{ version }`
      description: |-
        The engine's release, for the console's status bar and the SQL / Redis command
        reference (which dims commands newer than it). Generic across engines — each
        driver answers through its optional `serverVersion`: SQLite `sqlite_version()`,
        PostgreSQL `SHOW server_version` (distro suffix stripped), Redis `INFO server`,
        Kafka the brokers' `inter.broker.protocol.version` (3.x; Kafka 4 dropped it).
        Always `200`; `version` is `null` when the engine can't say or isn't reachable.
      parameters:
        - name: id
          in: path
          required: true
          description: Connection id
          schema:
            type: string
          example: demo-pg
        - name: database
          in: query
          description: optional `database`, `schema` (PG)
          schema:
            type: string
        - name: schema
          in: query
          description: optional `database`, `schema` (PG)
          schema:
            type: string
      responses:
        "200":
          description: |-
            `{ "version": "16.4" }`

            (unknown) `{ "version": null }` or `{ "version": null, "error": "<msg>" }`
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string
                    example: "16.4"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: '`{ "error": "Connection not found" }`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Connection not found
  /api/connections/{id}/handshake:
    get:
      tags:
        - Schema & data browsing
      summary: Pre-flight check + root cause
      description: |-
        Pre-flight connectivity check the console runs **before** it opens a connection
        (the "Connect" button on the connections list). Same probe as `/ping`, but a
        failure explains itself with a likely root cause instead of a bare `ok: false`,
        so the user isn't dropped into a console where every panel fails on its own.
        Never returns a 5xx: a failed handshake is a normal 200 payload. Times out after
        `HANDSHAKE_TIMEOUT_MS` (default 8000) so a black-holed host answers in seconds.
      parameters:
        - name: id
          in: path
          required: true
          description: Connection id
          schema:
            type: string
          example: demo-pg
        - name: database
          in: query
          description: optional `database`, `schema` (PG) / `database` (Redis db index)
          schema:
            type: string
        - name: schema
          in: query
          description: optional `database`, `schema` (PG) / `database` (Redis db index)
          schema:
            type: string
      responses:
        "200":
          description: |-
            (reachable) `{ "ok": true, "latencyMs": 26, "type": "redis", "target": "127.0.0.1:6379" }`

            (failed) ```jsonc
            {
              "ok": false,
              "latencyMs": 4,
              "type": "postgresql",
              "target": "db.internal:5432",       // host:port, file path, or a URI's host — never credentials
              "reason": "auth",                   // stable code to branch on (see below)
              "cause": "PostgreSQL rejected the username or password.",
              "hint": "Re-enter the credentials in the connection settings; a rotated password is the usual cause.",
              "code": "28P01",                    // driver/libuv error code, when there is one
              "detail": "password authentication failed for user \"app\""   // raw driver error
            }
            ```
            - `reason` is one of `dns` | `refused` | `timeout` | `network` | `tls` | `auth` |
              `permission` | `missing_database` | `missing_file` | `busy` | `unsupported` |
              `disabled` | `ssh` | `unknown`. `disabled` means an instance admin turned the
              connection's database type off (Admin → Modules). `ssh` means the connection's SSH tunnel failed before the
              database was reached (gateway unreachable, login rejected, host key changed,
              or the gateway can't reach the database host). `cause`/`hint` are prose meant to be rendered as-is, so a client
              that doesn't know a newer `reason` still shows something useful.
            - Transport failures (refused/DNS/timeout/TLS) are classified generically for
              every engine; engine-specific replies (Postgres SQLSTATEs, Redis `NOAUTH`/
              `WRONGPASS`, SQLite file errors) come from that driver's `explainError` —
              see `server/db/diagnose.js`.
            - `reason: "at_capacity"` means the connection is reachable but already at its
              session limit. It carries two extra fields: `sessions` (the live sessions, same
              shape as `GET /sessions`) and `limit` (`{ max, source, active }`) so the UI can
              show who's holding them. See "Connection sessions" below.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  latencyMs:
                    type: integer
                    example: 26
                  type:
                    type: string
                    example: redis
                  target:
                    type: string
                    example: 127.0.0.1:6379
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: '`{ "error": "Connection not found" }`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Connection not found
  /api/connections/{id}/sessions:
    get:
      tags:
        - Schema & data browsing
      summary: Open sessions + the limit
      description: Who's connected right now, and against what cap.
      parameters:
        - name: id
          in: path
          required: true
          description: Connection id
          schema:
            type: string
          example: demo-pg
      responses:
        "200":
          description: |-
            ```jsonc
            {
              "active": 2,
              "max": 5,                    // 0 = unlimited
              "source": "connection",      // "connection" | "workspace" | "instance" | "unlimited"
              "sessions": [
                {
                  "id": "postgresql:appdb/public",  // engine + the target the handle is on
                  "connectionId": "…",
                  "connectionName": "Prod",
                  "type": "postgresql",
                  "target": "appdb/public",
                  "instanceId": "b0f864f2",         // which app replica holds the handle
                  "openedAt": 1785485843801,
                  "lastSeenAt": 1785485901120,
                  "participants": { "<userId>": { "name": "Ada", "lastSeenAt": 1785485901120 } }
                }
              ]
            }
            ```
          content:
            application/json:
              schema:
                type: object
                properties:
                  active:
                    type: integer
                    example: 2
                  max:
                    type: integer
                    example: 5
                  source:
                    type: string
                    example: connection
                  sessions:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: postgresql:appdb/public
                        connectionId:
                          type: string
                        connectionName:
                          type: string
                          example: Prod
                        type:
                          type: string
                          example: postgresql
                        target:
                          type: string
                          example: appdb/public
                        instanceId:
                          type: string
                          example: b0f864f2
                        openedAt:
                          type: integer
                          example: 1785485843801
                        lastSeenAt:
                          type: integer
                          example: 1785485901120
                        participants:
                          type: object
                          properties:
                            <userId>:
                              type: object
                              properties:
                                name:
                                  type: string
                                  example: Ada
                                lastSeenAt:
                                  type: integer
                                  example: 1785485901120
              example:
                active: 2
                max: 5
                source: connection
                sessions:
                  - id: postgresql:appdb/public
                    connectionId: …
                    connectionName: Prod
                    type: postgresql
                    target: appdb/public
                    instanceId: b0f864f2
                    openedAt: 1785485843801
                    lastSeenAt: 1785485901120
                    participants:
                      <userId>:
                        name: Ada
                        lastSeenAt: 1785485901120
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: '`{ "error": "Connection not found" }`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Connection not found
  /api/connections/{id}/sessions/{sessionId}:
    delete:
      tags:
        - Schema & data browsing
      summary: Leave (or owner-close) a session
      description: |-
        Leave a session. The caller is only removed as a participant; the session ends
        (and its database handle is released) once the last participant is gone.
        `?force=1` closes it outright for everyone — **workspace admins only**.

        - **Path:** `sessionId` is the session's `id`, URL-encoded (it contains `:` and `/`)
      parameters:
        - name: id
          in: path
          required: true
          description: Connection id
          schema:
            type: string
          example: demo-pg
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
          example: redis:(default)
        - name: force
          in: query
          description: "`force` (optional — `1`/`true`/`yes`, admin only)"
          schema:
            type: string
      responses:
        "200":
          description: '`{ "ok": true, …the same shape as GET /sessions… }`'
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: '`{ "error": "Admin only" }` (force, non-admin)'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Admin only
        "404":
          description: '`{ "error": "Connection not found" }`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Connection not found
  /api/connections/{id}/tables:
    get:
      tags:
        - Schema & data browsing
      summary: List tables
      description: |-
        List table names.

        - **PG example:** `GET .../tables?database=appdb&schema=public`
      parameters:
        - name: id
          in: path
          required: true
          description: Connection id
          schema:
            type: string
          example: demo-sqlite
        - name: database
          in: query
          description: Target database on the same server (PostgreSQL multi-database browsing; on Redis the numbered database, as `db0`…`dbN` or a bare index).
          schema:
            type: string
        - name: schema
          in: query
          description: Target schema (PostgreSQL; default `public`).
          schema:
            type: string
      responses:
        "200":
          description: '`string[]` → `["users", "orders"]`'
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  example: users
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: '`{ "error": "Connection not found" }`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Connection not found
  /api/connections/{id}/objects:
    get:
      tags:
        - Schema & data browsing
      summary: List objects (tables/views/fns)
      description: |-
        Generic list of every browsable database object, so the data browser can group
        them by kind. Dialect-agnostic contract — each engine maps its own catalog onto
        `{ name, type }` (SQLite: tables/views; PostgreSQL: tables/views/functions;
        Redis (roadmap): keys by type).
      parameters:
        - name: id
          in: path
          required: true
          description: Connection id
          schema:
            type: string
          example: demo-sqlite
        - name: database
          in: query
          description: optional `database`, `schema` (PG)
          schema:
            type: string
        - name: schema
          in: query
          description: optional `database`, `schema` (PG)
          schema:
            type: string
      responses:
        "200":
          description: |-
            `Object[]`

            - `type` is one of `table` | `view` | `function` (extensible per dialect).
            - Optional extras: `schema`, `materialized` (views), `detail` (function args).
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                      example: users
                    type:
                      type: string
                      example: table
              example:
                - name: users
                  type: table
                - name: active_users
                  type: view
                  materialized: false
                - name: calc_total
                  type: function
                  detail: integer, integer
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/connections/{id}/function/{name}:
    get:
      tags:
        - Schema & data browsing
      summary: Function definition(s)
      description: |-
        Definition(s) of a function/routine by name (a name may have several overloads).
        Empty for engines without listable functions (e.g. SQLite).
      parameters:
        - name: id
          in: path
          required: true
          description: Connection id
          schema:
            type: string
          example: demo-pg
        - name: name
          in: path
          required: true
          schema:
            type: string
          example: calc_total
        - name: database
          in: query
          description: optional `database`, `schema` (PG)
          schema:
            type: string
        - name: schema
          in: query
          description: optional `database`, `schema` (PG)
          schema:
            type: string
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                      example: calc_total
                    args:
                      type: string
                      example: a integer, b integer
                    definition:
                      type: string
                      example: CREATE OR REPLACE FUNCTION public.calc_total(...) ...
              example:
                - name: calc_total
                  args: a integer, b integer
                  definition: CREATE OR REPLACE FUNCTION public.calc_total(...) ...
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/connections/{id}/table/{table}:
    get:
      tags:
        - Schema & data browsing
      summary: Read table rows
      description: |-
        Read rows from a table (capped by `limit`).

        - **Row order:** ordered by primary key when the table has one. Postgres writes a
          new tuple version on `UPDATE`, so an unordered read returns an edited row at the
          end of the heap — it looks like the edit was lost.
        - **`__tg_rowid` (tables with no primary key only):** each row object also carries
          its physical row id — SQLite `rowid`, Postgres `ctid` (as text, e.g. `"(0,4)"`).
          It is deliberately **absent from `columns`**, so it never renders or exports; it
          exists so an edit can target the one row it came from. Views, `WITHOUT ROWID`
          tables and any table with a PK omit it.

        **Example:** **Example (no PK):** `{ "columns": ["rule_id","value"], "rows": [{ "__tg_rowid": "(0,4)", "rule_id": 2, "value": "…" }] }`
      parameters:
        - name: id
          in: path
          required: true
          description: Connection id
          schema:
            type: string
          example: demo-sqlite
        - name: table
          in: path
          required: true
          description: Table name
          schema:
            type: string
          example: users
        - name: limit
          in: query
          description: "`limit` (default `200`), `offset` (default `0`), plus optional `database`, `schema`. `limit` is capped at the engine's **table row limit** (Admin → Modules, default `50000`) whatever the client asks for."
          schema:
            type: string
          example: "50000"
        - name: database
          in: query
          description: "`limit` (default `200`), `offset` (default `0`), plus optional `database`, `schema`. `limit` is capped at the engine's **table row limit** (Admin → Modules, default `50000`) whatever the client asks for."
          schema:
            type: string
        - name: schema
          in: query
          description: "`limit` (default `200`), `offset` (default `0`), plus optional `database`, `schema`. `limit` is capped at the engine's **table row limit** (Admin → Modules, default `50000`) whatever the client asks for."
          schema:
            type: string
      responses:
        "200":
          description: '`{ "columns": ["id", "name"], "rows": [ {…} ] }` - On a DB error the body is `{ "columns": [], "rows": [], "error": "<msg>" }` (HTTP 200)'
          content:
            application/json:
              schema:
                type: object
                properties:
                  columns:
                    type: array
                    items:
                      type: string
                      example: id
                  rows:
                    type: array
                    items:
                      type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/connections/{id}/columns/{table}:
    get:
      tags:
        - Schema & data browsing
      summary: Column metadata
      description: Column metadata for a table (used for PK detection, inserts, editing).
      parameters:
        - name: id
          in: path
          required: true
          description: Connection id
          schema:
            type: string
          example: demo-sqlite
        - name: table
          in: path
          required: true
          description: Table name
          schema:
            type: string
          example: users
        - name: database
          in: query
          description: Target database on the same server (PostgreSQL multi-database browsing; on Redis the numbered database, as `db0`…`dbN` or a bare index).
          schema:
            type: string
        - name: schema
          in: query
          description: Target schema (PostgreSQL; default `public`).
          schema:
            type: string
      responses:
        "200":
          description: '`Column[]` → `[{ "name", "type", "notnull", "pk", "default", "autoIncrement", "references": { "table", "column" } | null }]`'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Column"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/connections/{id}/indexes/{table}:
    get:
      tags:
        - Schema & data browsing
      summary: Table indexes
      description: |-
        Indexes on a table (the schema tab's index grid, and the Indexes view of the
        create/edit table panels).

        - **`columns`** is the index's columns in order, comma-separated.
        - **`condition`** is a partial index's predicate, without `WHERE` — the real
          clause on both engines (SQLite reads it from `sqlite_master`; a predicate it
          can't recover reads `(partial)`).
        - **`primary` / `constraint`** say the index was created *by* a constraint
          (`PRIMARY KEY`, `UNIQUE`, PG `EXCLUDE`) rather than by a `CREATE INDEX`. Such
          an index can't be dropped on its own, which is why the schema editor shows it
          read-only. SQLite also reports its own `origin` (`'c' | 'u' | 'pk'`).
      parameters:
        - name: id
          in: path
          required: true
          description: Connection id
          schema:
            type: string
          example: demo-sqlite
        - name: table
          in: path
          required: true
          description: Table name
          schema:
            type: string
          example: users
        - name: database
          in: query
          description: optional `database`, `schema` (PG)
          schema:
            type: string
        - name: schema
          in: query
          description: optional `database`, `schema` (PG)
          schema:
            type: string
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                      example: assets_pkey
                    algorithm:
                      type: string
                      example: BTREE
                    unique:
                      type: boolean
                      example: true
                    columns:
                      type: string
                      example: id
                    condition:
                      type: string
                      example: ""
                    include:
                      type: string
                      example: ""
                    comment:
                      type: string
                      example: ""
                    primary:
                      type: boolean
                      example: true
                    constraint:
                      type: boolean
                      example: true
              example:
                - name: assets_pkey
                  algorithm: BTREE
                  unique: true
                  columns: id
                  condition: ""
                  include: ""
                  comment: ""
                  primary: true
                  constraint: true
                - name: idx_assets_active
                  algorithm: BTREE
                  unique: false
                  columns: owner_id, name
                  condition: status = 'active'
                  include: ""
                  comment: ""
                  primary: false
                  constraint: false
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/connections/{id}/schema:
    get:
      tags:
        - Schema & data browsing
      summary: Table → columns map
      description: Map of every table to its column names (editor autocomplete).
      parameters:
        - name: id
          in: path
          required: true
          description: Connection id
          schema:
            type: string
          example: demo-sqlite
        - name: database
          in: query
          description: Target database on the same server (PostgreSQL multi-database browsing; on Redis the numbered database, as `db0`…`dbN` or a bare index).
          schema:
            type: string
        - name: schema
          in: query
          description: Target schema (PostgreSQL; default `public`).
          schema:
            type: string
      responses:
        "200":
          description: '`{ "users": ["id", "name"], "orders": ["id", "user_id"] }`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      type: string
                      example: id
                  orders:
                    type: array
                    items:
                      type: string
                      example: id
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/connections/{id}/namespaces:
    get:
      tags:
        - Schema & data browsing
      summary: Databases + schemas
      description: Databases + schemas available on the connection (breadcrumb selector).
      parameters:
