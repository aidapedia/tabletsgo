        - name: id
          in: path
          required: true
          description: Connection id
          schema:
            type: string
          example: <id>
        - name: group
          in: path
          required: true
          schema:
            type: string
          example: payments-service
        - name: database
          in: query
          description: Target database on the same server (PostgreSQL multi-database browsing; on Redis the numbered database, as `db0`…`dbN` or a bare index).
          schema:
            type: string
        - name: schema
          in: query
          description: Target schema (PostgreSQL; default `public`).
          schema:
            type: string
      requestBody:
        description: '`{ "confirm": "payments-service" }`'
        content:
          application/json:
            schema:
              type: object
              properties:
                confirm:
                  type: string
                  example: payments-service
      responses:
        "200":
          description: '`{ "ok": true }`'
