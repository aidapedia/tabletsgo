                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: integrity
                        label:
                          type: string
                          example: Metadata database integrity
                        status:
                          type: string
                          example: pass
                        detail:
                          type: string
                          example: No corruption detected
              example:
                checks:
                  - id: integrity
                    label: Metadata database integrity
                    status: pass
                    detail: No corruption detected
                  - id: disk
                    label: Free disk for snapshot
                    status: pass
                    detail: 12040 MB free
                  - id: apply
                    label: Update apply method
                    status: warn
                    detail: No webhook — a manual pull will be required
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/system/update/apply:
    post:
      tags:
        - System updates
      summary: Trigger the update (admin)
      description: |-
        Trigger the update using the auto-detected `applyMethod` (docker → manual). Admin only.

        ---
      requestBody:
        description: '(optional) `{ "tag": "0.16.0" }` — defaults to the latest known version.'
        content:
          application/json:
            schema:
              type: object
              properties:
                tag:
                  type: string
                  example: 0.16.0
      responses:
        "200":
          description: |-
            (docker) `{ "ok": true, "method": "docker", "message": "Pulling the new image and recreating the container — this will restart shortly.", "newContainerId": "…" }`

            (manual) `{ "ok": false, "method": "manual", "command": "docker compose pull && docker compose up -d", "image": "ghcr.io/aidapedia/tabletsgo:0.16.0" }`
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  method:
                    type: string
                    example: docker
                  message:
                    type: string
                    example: Pulling the new image and recreating the container — this will restart shortly.
                  newContainerId:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          description: '(docker self-update failed) `{ "error": "Docker self-update failed: …" }`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /api/health:
    get:
      tags:
        - Health
      summary: Health check + readiness/identity
      description: |-
        Liveness probe. Also reports boot readiness and the running identity.

        ---
      security: []
      responses:
        "200":
          description: '`{ "status": "ok", "ready": true, "version": "0.15.2", "sha": "20f10b5" }` (`status` is `starting` until migrations finish).'
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  ready:
                    type: boolean
                    example: true
                  version:
                    type: string
                    example: 0.15.2
                  sha:
                    type: string
                    example: 20f10b5
  /api/openapi.json:
    get:
      tags:
        - Health
      summary: This API description
      description: The OpenAPI document Swagger UI at `/api/docs` reads. `info.version` is the running app's version.
      security: []
      responses:
        "200":
          description: The OpenAPI document.
          content:
            application/json:
              schema:
                type: object
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: An access token — Hayat's in enterprise mode, from signing in at Hayat; tabletsgo's own in solo mode, from POST /api/auth/solo/login (see GET /api/auth/config).
  responses:
    Unauthorized:
      description: Missing, expired or revoked token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    SoloSetup:
      type: object
      required: [code, email, password]
      properties:
        code:
          type: string
          description: The setup code from the instance's log
        name:
          type: string
        email:
          type: string
        password:
          type: string
          minLength: 8
        timezone:
          type:
            - string
            - "null"
    SoloTokens:
      type: object
      properties:
        accessToken:
          type: string
          description: "Send as `Authorization: Bearer`"
        expiresIn:
          type: integer
          description: Seconds until the access token expires (900)
        user:
          type: object
          description: The owner, as `GET /api/auth/me` shows them
      example:
        accessToken: eyJhbGciOiJIUzI1NiJ9.eyJjbGllbnRfaWQiOiJ0YWJsZXRzZ28tc29sbyJ9.c2lnbmF0dXJl
        expiresIn: 900
        user:
          id: 6f1c2a3b-4d5e-4f60-8a7b-9c0d1e2f3a4b
          email: dev@example.com
          name: Dev
          role: admin
          timezone: Asia/Jakarta
          picture: null
    WorkspaceMember:
      type: object
      properties:
        userId: { type: string }
        email: { type: string }
        name: { type: string }
        status: { type: string, enum: [pending, active, disabled] }
        role: { type: string, enum: [owner, member], description: "A label: `owner` for the tenant's owner." }
        isOwner: { type: boolean }
        createdAt: { type: integer, nullable: true, description: When they joined (ms) }
        roles:
          type: array
          description: The roles they hold on the workspace itself, once each.
          items:
            type: object
            properties:
              role: { type: string, description: "Hayat role slug, e.g. `tabletsgo.owner`" }
              name: { type: string }
              via: { type: string, enum: [user, group, everyone] }
              groupName: { type: string, nullable: true }
        permissions:
          type: array
          items: { type: string }
          description: What they may do in the workspace (short keys).
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: Connection not found
      description: Every failure answers in this shape. The query, insert and test routes report database errors in the body of a `200` instead — see each route.
    PermissionError:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: You do not have permission to do that.
        permission:
          type: string
          example: connections.create
          description: 'The permission the caller lacks. Present when they are a member of the workspace; a non-member gets `{ "error": "Forbidden" }`.'
    User:
      type: object
      description: "`role` is `admin` for whoever holds tabletsgo's admin role at Hayat's root, else `user`."
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum:
            - admin
            - user
        timezone:
          type:
            - string
            - "null"
          description: An IANA zone, or `null` to follow the browser.
    Connection:
      type: object
      additionalProperties: true
      description: |-
        A flat object on the wire. Storage is split (dialect-agnostic fields as plain columns, everything else encrypted), but every read reassembles this same shape. Fields another engine does not use are absent.

        Redis reuses the PostgreSQL field names, so nothing downstream needs a Redis branch. A `redis://` / `rediss://` URI's `/N` path is only the *default* database: an explicit `?database=` on a request always wins.

        **SSH tunnel (PostgreSQL, Redis).** Any network connection may carry `sshGatewayId` (stored in the encrypted credentials blob). `host`/`port` (or the URI's host) are then dialed **from the gateway**, so they are the address the gateway sees. `""`/absent means connect directly. The gateway must belong to the connection's workspace (`400` otherwise).
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
        type:
          type: string
          enum:
            - sqlite
            - postgresql
            - redis
            - kafka
          description: Fixed at creation.
        environment:
          type: string
          example: production
        folder:
          type: string
        schemaVersion:
          type: integer
          readOnly: true
          description: Bumped by `POST /api/connections/{id}/schema/migrations`. Never bumps on Redis, which has no DDL.
        ownerId:
          type: string
          description: The creator by default.
        ownerName:
          type: string
          readOnly: true
          description: The owner's display name, resolved.
        ownerEmail:
          type: string
          readOnly: true
          description: The owner's email, resolved.
        filepath:
          type: string
          description: SQLite only.
        host:
          type: string
        port:
          type: integer
        username:
          type: string
          description: "Redis: optional, a Redis 6+ ACL user."
        password:
          type: string
        database:
          type: string
          description: "Redis: the numeric db index to open by default."
        auth:
          type: string
          description: '`"none"` skips user/password.'
        sslmode:
          type: string
          enum:
            - disable
            - require
            - verify-full
          description: PostgreSQL.
        tls:
          type: string
          enum:
            - ""
            - require
            - insecure
          description: Redis. `""` is plain.
        uri:
          type: string
          description: Redis. Wins over the fields above.
        sshGatewayId:
          type: string
          description: A gateway of the same workspace, or `""` for a direct connection.
      examples:
        - id: demo-sqlite
          name: Demo Database
          type: sqlite
          environment: local
          filepath: ./demo.db
          folder: Demo
          schemaVersion: 1
          ownerId: user_1
          ownerName: Alice
          ownerEmail: alice@x.com
        - id: f1e2…
          name: Prod
          type: postgresql
          environment: production
          host: db.example.com
          port: 5432
          username: app
          password: secret
          database: appdb
          auth: none
          sslmode: verify-full
          schemaVersion: 1
        - id: a1b2…
          name: Session cache
          type: redis
          environment: production
          host: cache.example.com
          port: 6379
          username: app
          password: secret
          auth: password
          database: "0"
          tls: require
          schemaVersion: 1
    SavedQuery:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          example: Active users
        sql:
          type: string
          example: SELECT * FROM users WHERE active = 1
        kind:
          type: string
          enum:
            - query
            - schema
        folderId:
          type:
            - string
            - "null"
          description: Folder id, or `null` for the root.
        ts:
          type: integer
          description: Epoch ms.
    Folder:
      type: object
      description: "Folders of `type: \"table\"` group the connected database's tables. A table belongs to **at most one** folder; membership lives server-side in `connection_tables`, the per-table metadata row (tables themselves aren't rows in the metadata DB). These replaced the old *domains* concept in meta migration v5 — each domain became a root-level table folder, keeping its id, name and color, so old domain ids still resolve."
      properties:
        id:
          type: string
        name:
          type: string
          example: Reports
        color:
          type:
            - string
            - "null"
          description: Hex accent color, or `null`. Any type; used by table folders.
        parentId:
          type:
            - string
            - "null"
          description: Parent folder id, or `null` for the root. Folders nest into subdirectories.
        type:
          type: string
          enum:
            - query
            - dashboard
            - workflow
            - table
        ts:
          type: integer
          description: Epoch ms.
        tables:
          type: array
          items:
            type: string
          description: '`type: "table"` only: the tables grouped in this folder.'
    QueryHistoryEntry:
      type: object
      properties:
        id:
          type: string
        table:
          type:
            - string
            - "null"
          description: Best-effort table name.
        query:
          type: string
          example: SELECT * FROM users
        status:
          type: string
          enum:
            - success
            - failed
        latency:
          type:
            - integer
            - "null"
          description: Execution latency in ms.
        error:
          type:
            - string
            - "null"
          description: The error message when `status` is `failed`.
        executorId:
          type: string
        executorName:
          type: string
          description: Resolved display name; falls back to the id.
        executedAt:
          type: integer
          description: Epoch ms.
    Column:
      type: object
      description: "`autoIncrement` is normalized per dialect so clients never have to sniff the `default` string: PostgreSQL reports it for identity columns (`is_identity = 'YES'`) and `serial` (`nextval(...)` default); SQLite reports it for the rowid alias (the sole `INTEGER PRIMARY KEY` on a rowid table). A column is safe to omit from an `INSERT` when it is nullable, has a `default`, or is `autoIncrement`."
      properties:
        name:
          type: string
          example: user_id
        type:
          type: string
          example: integer
        notnull:
          type: boolean
        pk:
          type: boolean
        default:
          type:
            - string
            - "null"
          description: The raw default expression as the dialect reports it, e.g. `nextval('t_id_seq'::regclass)`.
        autoIncrement:
          type: boolean
          description: The database assigns this column when the INSERT omits it.
        references:
          type:
            - object
            - "null"
          description: "`null` when not a foreign key. Only on `/columns`."
          properties:
            table:
              type: string
            column:
              type: string
    QueryResult:
      description: 'A failed statement still answers HTTP 200, with `{ "error": "…" }` in the body.'
      oneOf:
        - type: object
          title: Rows
          properties:
            type:
              const: rows
            columns:
              type: array
              items:
                type: string
            rows:
              type: array
              items:
                type: object
          example:
            type: rows
            columns:
              - id
              - name
            rows:
              - id: 1
                name: A
        - type: object
          title: Message
          description: "`rowCount` tells a statement that changed nothing (a 0-row UPDATE/DELETE: not an error, but not a success either) from one that did."
          properties:
            type:
              const: message
            message:
              type: string
            rowCount:
              type: integer
          example:
            type: message
            message: Query OK · 3 row(s) affected.
            rowCount: 3
        - type: object
          title: Failure
          properties:
            error:
              type: string
          example:
            error: "no such table: foo"
