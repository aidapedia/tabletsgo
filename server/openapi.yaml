  /api/workspaces/{id}/schemas:
    get:
      tags:
        - Saved queries
      summary: Every schema draft in a workspace — what the home area's Schema Editor
      description: |-
        Every **schema draft** in a workspace — what the home area's **Schema Editor**
        section lists (one request instead of one per connection). Newest first.

        Two kinds come back in the one list, told apart by `connectionId`:

        | `connectionId` | Kind | Where it lives | What the editor draws |
        | --- | --- | --- | --- |
        | an id | designed **against a connection** | a saved query with `kind = "schema"` | that database's live tables |
        | `null` | designed **from scratch** | `schema_drafts` (see below) | an empty canvas |

        Both open at the same address — `/schemas/:id`, which loads the draft through
        `GET /api/workspaces/:id/schemas/:draftId` below.

        For a from-scratch draft `connectionName` is `null` and `connectionType` is the
        dialect the row stored rather than a connection's engine.

        **The target's schema version.** An attached draft also carries
        `connectionSchemaVersion` — the connection's `schema_version` counter, which
        every committed DDL migration bumps (see `POST /api/connections/:id/schema/migrations`).
        It is what the draft is staged *against*, so a caller can tell a draft drawn
        from the current schema from one drawn two migrations ago. It is `null` for a
        from-scratch draft: no database behind it, nothing committed to be a version of.

        Either way the DDL is summarised rather than returned — `statementCount` is all
        the list needs, and rendering a draft needs the editor. It counts the
        `;`-separated statements, the same split the editor uses to seed a tab.

        **The audit trail.** Every row carries who started the design and who last saved
        it, already resolved to names — `createdBy`/`updatedBy` are user ids,
        `createdByName`/`updatedByName` the display names, and `createdAt`/`ts` the two
        timestamps (first write, last write). One lookup answers the whole page, so the
        caller never resolves a user itself. A name is `null` when the account has been
        deleted or the row predates the trail (meta migration v20): the id may still be
        there, and an unknown writer is a real answer — never render it as nobody. Both
        kinds of draft answer this identically, whichever table they live in.

        Membership gates the workspace; each connection is then filtered by connection
        access, so this never shows an attached draft the per-connection route below
        would refuse. A workspace with no reachable connection is **not** an empty
        answer — its from-scratch drafts hang off the workspace and are still listed.

        **Example:** `GET http://localhost:3000/api/workspaces/ws-1/schemas`
        ```json
        [
          {
            "id": "sq-9",
            "connectionId": "demo-sqlite",
            "connectionName": "Demo SQLite",
            "connectionType": "sqlite",
            "connectionSchemaVersion": 3,
            "name": "orders ERD",
            "ts": 1754812800000,
            "createdAt": 1754640000000,
            "createdBy": "u-1",
            "createdByName": "Dana Reyes",
            "updatedBy": "u-2",
            "updatedByName": "Sam Okoro",
            "statementCount": 4
          },
          {
            "id": "0ec3a7a4-f43b-49f6-99e8-2404fbc2687c",
            "connectionId": null,
            "connectionName": null,
            "connectionType": "postgresql",
            "connectionSchemaVersion": null,
            "name": "Billing schema",
            "ts": 1754812000000,
            "createdAt": 1754812000000,
            "createdBy": "u-1",
            "createdByName": "Dana Reyes",
            "updatedBy": "u-1",
            "updatedByName": "Dana Reyes",
            "statementCount": 2
          }
        ]
        ```
      parameters:
        - name: id
          in: path
          required: true
          description: Workspace id
          schema:
            type: string
          example: ws-1
      responses:
        "200":
          description: '`[{ "id", "connectionId", "connectionName", "connectionType", "connectionSchemaVersion", "name", "ts", "createdAt", "createdBy", "createdByName", "updatedBy", "updatedByName", "statementCount" }]`'
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: {}
                    connectionId: {}
                    connectionName: {}
                    connectionType: {}
                    connectionSchemaVersion: {}
                    name: {}
                    ts: {}
                    createdAt: {}
                    createdBy: {}
                    createdByName: {}
                    updatedBy: {}
                    updatedByName: {}
                    statementCount: {}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: '`{ "error": "Forbidden" }` — not a member of the workspace.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Forbidden
  /api/workspaces/{id}/schemas/{draftId}:
    get:
      tags:
        - Saved queries
      summary: One draft with its DDL, whichever kind it is — what the schema editor page
      description: |-
        One draft **with its DDL**, whichever kind it is — what the schema editor page
        (`/schemas/:id`) loads. The list above returns two kinds from two tables; this
        resolves both through the one address, so the caller never has to know which
        table the id came from. The shape is the list's row with `sql` in place of
        `statementCount`.

        Access is the list's rule enforced per draft rather than by filtering:
        membership to reach the workspace, then connection access for a draft that
        targets one. A member who cannot open that database gets **403** here, exactly
        as they would from that connection's own `/saved` route — which is what lets the
        editor page host a connection-linked draft without the console.

        `layout` comes back beside the DDL: the **design** — where every table, group
        region and note sits on the canvas. It is opaque to the server (stored as one
        JSON document, never queried into), and `null` on a draft that has never been
        saved from the editor, which is what tells the editor to arrange the diagram
        itself. See *The schema design document* below for its shape.

        Saving is not here: a from-scratch draft writes back through
        `PUT /api/workspaces/:id/schema-drafts/:draftId`, a connection-linked one
        through `PUT /api/connections/:id/saved/:sid` — each row keeps its one owner.

        **Example:** `GET http://localhost:3000/api/workspaces/ws-1/schemas/sq-9`
        ```json
        {
          "id": "sq-9",
          "name": "orders ERD",
          "sql": "CREATE TABLE \"orders\" (\n  \"id\" serial PRIMARY KEY\n);",
          "layout": {
            "version": 1,
            "tables": { "orders": { "x": 120, "y": 80 }, "customers": { "x": 460, "y": 80 } },
            "notes": [
              { "id": "n1", "x": 120, "y": 300, "w": 220, "h": 120, "text": "Waiting on billing to confirm the FK.", "color": "#eab308" }
            ],
            "groups": [
              { "id": "fld-3", "name": "Billing", "color": "#3b82f6", "tables": ["orders"], "x": 98, "y": 32, "w": 274, "h": 220 }
            ]
          },
          "ts": 1754812800000,
          "createdAt": 1754640000000,
          "createdBy": "u-1",
          "createdByName": "Dana Reyes",
          "updatedBy": "u-2",
          "updatedByName": "Sam Okoro",
          "connectionId": "demo-sqlite",
          "connectionName": "Demo SQLite",
          "connectionType": "sqlite"
        }
        ```
      parameters:
        - name: id
          in: path
          required: true
          description: Workspace id
          schema:
            type: string
          example: ws-1
        - name: draftId
          in: path
          required: true
          schema:
            type: string
          example: sq-9
      responses:
        "200":
          description: "`{ \"id\", \"name\", \"sql\", \"layout\", \"ts\", \"createdAt\", \"createdBy\", \"createdByName\", \"updatedBy\", \"updatedByName\", \"connectionId\", \"connectionName\", \"connectionType\" }` — the audit fields exactly as the list returns them; the editor's header names the last writer with them."
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {}
                  name: {}
                  sql: {}
                  layout: {}
                  ts: {}
                  createdAt: {}
                  createdBy: {}
                  createdByName: {}
                  updatedBy: {}
                  updatedByName: {}
                  connectionId: {}
                  connectionName: {}
                  connectionType: {}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: '`{ "error": "Forbidden" }` — not a member of the workspace — or `{ "error": "You do not have access to this connection" }` — a member, but the draft targets a connection they cannot open.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Forbidden
        "404":
          description: '`{ "error": "Schema draft not found" }` — no such draft, or it belongs to another workspace.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Schema draft not found
  /api/schema-engines:
    get:
      tags:
        - Saved queries
      summary: The engines a from-scratch schema can be designed for — what fills the New
      description: |-
        The engines a from-scratch schema can be designed for — what fills the **New
        schema → From scratch** database-type picker. Read from the driver registry: an
        engine that reports no column types is schemaless (Redis), so there is no schema
        to draw and it is absent. Authentication only; the answer is the same for
        everyone.
      responses:
        "200":
          description: '`[{ "type": "postgresql", "label": "PostgreSQL", "dataTypes": ["serial", "integer", …] }]`'
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    type:
                      type: string
                      example: postgresql
                    label:
                      type: string
                      example: PostgreSQL
                    dataTypes:
                      type: array
                      items:
                        type: string
                        example: serial
        "401":
          description: '`{ "error": "Unauthorized" }`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized
  /api/workspaces/{id}/schema-drafts:
    post:
      tags:
        - Saved queries
      summary: Start a schema with no database behind it
      description: |-
        Start a schema with no database behind it. The workspace holds it and the row
        carries `dbType`, the dialect its DDL is written for — the one thing a
        connection would otherwise have answered.

        Membership is the whole gate: designing a schema is not a permission (using a
        database is per-connection access, and this draft has no database at all).
      parameters:
        - name: id
          in: path
          required: true
          description: Workspace id
          schema:
            type: string
          example: ws-1
      requestBody:
        description: '`{ "name": "Billing schema", "dbType": "postgresql", "sql"?: "CREATE TABLE …;", "layout"?: { … } }`'
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Billing schema
                dbType:
                  type: string
                  example: postgresql
                sql:
                  type: string
                  example: CREATE TABLE …;
                layout:
                  type: object
      responses:
        "200":
          description: '`{ "id", "workspaceId", "name", "dbType", "sql", "layout", "createdBy", "updatedBy", "createdAt", "ts" }` — the caller is stamped as both creator and last writer; these routes return **ids only**, the workspace-wide reads above are what resolve them to names.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {}
                  workspaceId: {}
                  name: {}
                  dbType: {}
                  sql: {}
                  layout: {}
                  createdBy: {}
                  updatedBy: {}
                  createdAt: {}
                  ts: {}
        "400":
          description: '`{ "error": "A schema name is required" }` / `{ "error": "Pick a database type a schema can be designed for" }` — the latter for an unknown or schemaless `dbType`.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: A schema name is required
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: '`{ "error": "Forbidden" }` — not a member of the workspace.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Forbidden
  /api/workspaces/{id}/schema-drafts/{draftId}:
    get:
      tags:
        - Saved queries
      summary: One from-scratch draft with its DDL and its design — what the standalone
      description: |-
        One from-scratch draft **with its DDL and its design** — what the standalone
        editor loads. `layout` is the design document described above, or `null`.
      parameters:
        - name: id
          in: path
          required: true
          description: Workspace id
          schema:
            type: string
          example: ws-1
        - name: draftId
          in: path
          required: true
          schema:
            type: string
          example: dr-1
      responses:
        "200":
          description: '`{ "id", "workspaceId", "name", "dbType", "sql", "layout", "createdBy", "updatedBy", "createdAt", "ts" }`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {}
                  workspaceId: {}
                  name: {}
                  dbType: {}
                  sql: {}
                  layout: {}
                  createdBy: {}
                  updatedBy: {}
                  createdAt: {}
                  ts: {}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: '`{ "error": "Schema draft not found" }` — also when the draft belongs to another workspace.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Schema draft not found
    put:
      tags:
        - Saved queries
      summary: Update a from-scratch draft
      description: |-
        Update a from-scratch draft. Partial — send `name`, `sql`, `layout`, or any
        combination; saving the editor sends `sql` **and** `layout` (the DDL and the
        arrangement are one save), a rename sends `name` alone. `sql` is the staged
        statements joined by `;`, the same shape a saved schema query has. `layout: null`
        forgets the arrangement.

        The write is stamped: `updated_by` becomes the caller and `ts` the moment, both
        only when something actually changed — a call that carries no writable field
        leaves the trail (and the timestamp) exactly where it was, so "last updated" and
        "last updated by" always describe the same save.
      parameters:
        - name: id
          in: path
          required: true
          description: Workspace id
          schema:
            type: string
          example: ws-1
        - name: draftId
          in: path
          required: true
          schema:
            type: string
          example: dr-1
      requestBody:
        description: '`{ "name"?: "Billing schema v2", "sql"?: "CREATE TABLE \"invoices\" (id INTEGER);", "layout"?: { "version": 1, "tables": { … }, "notes": [ … ], "groups": [ … ] } }`'
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Billing schema v2
                sql:
                  type: string
                  example: CREATE TABLE \"invoices\" (id INTEGER);
                layout:
                  type: object
                  properties:
                    version:
                      type: integer
                      example: 1
                    tables:
                      type: object
                    notes:
                      type: array
                      items: {}
                    groups:
                      type: array
                      items: {}
      responses:
        "200":
          description: the updated draft
        "400":
          description: '`{ "error": "A schema name is required" }` — `name` sent but blank.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: A schema name is required
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: '`{ "error": "Schema draft not found" }`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Schema draft not found
    delete:
      tags:
        - Saved queries
      summary: Delete a from-scratch draft
      description: |-
        Delete a from-scratch draft. Nothing points at these rows, so there is no
        cascade; every draft in a workspace also dies with the workspace.
      parameters:
        - name: id
          in: path
          required: true
          description: Workspace id
          schema:
            type: string
          example: ws-1
        - name: draftId
          in: path
          required: true
          schema:
            type: string
          example: dr-1
      responses:
        "200":
          description: '`{ "ok": true }`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: '`{ "error": "Schema draft not found" }`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Schema draft not found
  /api/connections/{id}/saved:
    get:
      tags:
        - Saved queries
      summary: List saved queries
      description: List saved queries for a connection (newest first).
      parameters:
        - name: id
          in: path
          required: true
          description: Connection id
          schema:
            type: string
          example: demo-sqlite
      responses:
        "200":
          description: "`SavedQuery[]` — each includes `folderId` (null = root), `kind`, and `layout` (the schema **design** document; `null` on anything but a saved schema draft)"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SavedQuery"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags:
        - Saved queries
      summary: Create saved query
      description: |-
        Create a saved query — or, with `kind: "schema"`, a schema draft designed
        against this connection.

        `sql` is required for a saved **query**, which is nothing without it, and
        optional for a schema **draft**: an empty draft is a real state (a diagram with
        nothing staged yet). A name is always required.

        The caller is recorded as the row's creator and its first writer
        (`created_by`/`updated_by`/`created_at`, meta migration v20) — that is what the
        workspace-wide schema list names for a connection-linked draft.
      parameters:
        - name: id
          in: path
          required: true
          description: Connection id
          schema:
            type: string
          example: demo-sqlite
      requestBody:
        description: '`{ "name": "Active users", "sql": "SELECT ...", "kind": "query", "layout"?: { … } }` (`kind` optional, defaults `"query"`; `layout` only means anything for `kind: "schema"`)'
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Active users
                sql:
                  type: string
                  example: SELECT ...
                kind:
                  type: string
                  example: query
                layout:
                  type: object
      responses:
        "200":
          description: '`{ "id", "name", "sql", "kind", "layout", "createdBy", "updatedBy", "createdAt", "ts" }`'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedQuery"
        "400":
          description: '`{ "error": "A name and SQL are required" }`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: A name and SQL are required
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/connections/{id}/saved/{sid}:
    put:
      tags:
        - Saved queries
      summary: Update saved query / move
      description: |-
        Update fields of a saved query. Any subset of `name`, `sql`, `folderId`,
        `layout`. `folderId: null` moves the query back to the root; `layout: null`
        forgets a schema draft's arrangement.

        Same split as the create above, decided by the stored row's `kind` rather than
        anything in the body: `"sql": ""` empties a **schema draft** (that is how the
        editor records removing the last staged statement) and is refused on a saved
        **query**.

        Every accepted update stamps `updated_by` with the caller and moves `ts` to now.
        `ts` used to be written once, at insert — which made a draft saved this morning
        report the age of its creation and left the workspace-wide list nothing to
        attribute a save to. Moving it also reorders `GET /api/connections/:id/saved`
        (newest first) by *last touched*, which is what `/schemas/connection/:id` means
        by the draft to resume.
      parameters:
        - name: id
          in: path
          required: true
          description: Connection id
          schema:
            type: string
          example: demo-sqlite
        - name: sid
          in: path
          required: true
          schema:
            type: string
          example: abc-123
      requestBody:
        description: '**Body examples:** - Rename: `{ "name": "New name" }` - Update SQL: `{ "sql": "SELECT 1" }` - Save a schema draft: `{ "sql": "CREATE TABLE …;", "layout": { "version": 1, "tables": { … }, "notes": [ … ], "groups": [ … ] } }` - Move to folder: `{ "folderId": "folder-uuid" }` - Move to root: `{ "folderId": null }`'
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: New name
      responses:
        "200":
          description: '`{ "ok": true }`'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedQuery"
        "400":
          description: '`{ "error": "Nothing to update" }` / `{ "error": "A name is required" }` / `{ "error": "SQL is required" }` — the last only for `kind = "query"`.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Nothing to update
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: '`{ "error": "Not found" }`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Not found
    delete:
      tags:
        - Saved queries
      summary: Delete saved query
      description: |-
        Delete a saved query.

        ---
      parameters:
        - name: id
          in: path
          required: true
          description: Connection id
          schema:
            type: string
          example: demo-sqlite
        - name: sid
          in: path
          required: true
          schema:
            type: string
          example: abc-123
      responses:
        "200":
          description: '`{ "ok": true }`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/connections/{id}/folders:
    get:
      tags:
        - Folders
      summary: List folders (`?type=`; tables embed `tables`)
      description: List folders of a given `type` (oldest first). Folders nest via `parentId` (null = root).
      parameters:
        - name: id
          in: path
          required: true
          description: Connection id
          schema:
            type: string
          example: demo-sqlite
        - name: type
          in: query
          schema:
            type: string
          example: workflow
      responses:
        "200":
          description: '`Folder[]` → `[{ "id", "name", "color", "parentId", "type", "ts" }]` (`type=table` rows also carry `"tables": ["orders", …]`)'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Folder"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags:
        - Folders
      summary: Create folder (opt. `parentId`, `color`)
      description: Create a folder. Pass `parentId` to create a subfolder under an existing folder.
      parameters:
        - name: id
          in: path
          required: true
          description: Connection id
          schema:
            type: string
          example: demo-sqlite
      requestBody:
        description: '`{ "type": "workflow", "name": "Reports", "parentId": null, "color": null }`  // `type` defaults to `query`; `parentId` (root) and `color` optional'
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  example: workflow
                name:
                  type: string
                  example: Reports
                parentId:
                  type: "null"
                color:
                  type: "null"
      responses:
        "200":
          description: '`{ "id", "name", "color", "parentId", "type", "ts" }` (plus `"tables": []` when `type=table`)'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Folder"
        "400":
          description: '`{ "error": "A folder name is required" }` / `{ "error": "Parent folder not found" }` / `{ "error": "Folders can only nest 3 levels deep" }`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: A folder name is required
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/connections/{id}/folders/{fid}:
    put:
      tags:
        - Folders
      summary: Rename / recolor / move folder
      description: |-
        Rename, recolor and/or move (reparent) a folder. Send any subset of `name`,
        `color`, `parentId`. `parentId: null` moves the folder to the root; `color: null`
        clears the color.
      parameters:
        - name: id
          in: path
          required: true
          description: Connection id
          schema:
            type: string
          example: demo-sqlite
        - name: fid
          in: path
          required: true
          description: Folder id
          schema:
            type: string
          example: fld-1
      requestBody:
        description: '`{ "name": "Renamed" }` and/or `{ "color": "#ef4444" }` and/or `{ "parentId": "fld-2" }`'
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Renamed
      responses:
        "200":
          description: '`{ "ok": true }`'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Folder"
        "400":
          description: "`{ \"error\": \"A folder name is required\" }` / `{ \"error\": \"Parent folder not found\" }` / `{ \"error\": \"Can't move a folder into its own subfolder\" }` / `{ \"error\": \"A folder can't be its own parent\" }` / `{ \"error\": \"Nothing to update\" }`"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: A folder name is required
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: '`{ "error": "Not found" }`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Not found
    delete:
      tags:
        - Folders
      summary: Delete folder (contents move up)
      description: |-
        Delete a folder. Its contents move up one level (to the deleted folder's parent,
        or the root for a top-level folder): child subfolders are reparented and the
        folder's items (queries/dashboards/workflows/tables, per `type`) are re-attached
        (`folder_id`/`parent_id` set to the parent), not deleted. For `type=table`,
        items that land at the root are simply ungrouped (their mapping row is dropped).

        ---
      parameters:
        - name: id
          in: path
          required: true
          description: Connection id
          schema:
            type: string
          example: demo-sqlite
        - name: fid
          in: path
          required: true
          description: Folder id
          schema:
            type: string
          example: fld-1
      responses:
        "200":
          description: '`{ "ok": true }`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/connections/{id}/tables/{table}/folder:
    put:
      tags:
        - Table folders
      summary: Set/clear a table's folder
      description: |-
        Set (or clear) which folder a table belongs to. Reassigning replaces the table's
        previous folder (upsert); `folderId: null` ungroups it.

