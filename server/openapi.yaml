      description: "Hayat's resolved answer for `tabletsgo.connection.open` at this connection — every way in (a grant on it or a group above it, the roster of a group it is filed under, owning it), each with Hayat's `reason`. Not the raw grant list. Access is changed in Hayat's console: `manageUrl` opens this connection's node there (`null` without `HAYAT_CONSOLE_URL`). `parentNodeId` is the Hayat node it is filed under."
      parameters:
