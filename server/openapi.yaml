  /api/connections/{id}/streams/topics:
    get:
      tags:
        - Streams
      summary: List topics
      description: Topics for the sidebar tree, sorted by name.
      parameters:
        - name: id
          in: path
          required: true
          description: Connection id
          schema:
            type: string
          example: <id>
        - name: pattern
          in: query
          description: "`pattern` (a glob like `orders.*`, or a case-insensitive substring), `internal` (`1` to include `__consumer_offsets` & co.)"
          schema:
            type: string
          example: orders.*
        - name: internal
          in: query
          description: "`pattern` (a glob like `orders.*`, or a case-insensitive substring), `internal` (`1` to include `__consumer_offsets` & co.)"
          schema:
            type: string
        - name: database
          in: query
          description: Target database on the same server (PostgreSQL multi-database browsing; on Redis the numbered database, as `db0`…`dbN` or a bare index).
          schema:
            type: string
        - name: schema
          in: query
          description: Target schema (PostgreSQL; default `public`).
          schema:
            type: string
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                      example: orders.paid
                    internal:
                      type: boolean
                      example: false
                    partitions:
                      type: integer
                      example: 12
                    replication:
                      type: integer
                      example: 3
                    underReplicated:
                      type: integer
                      example: 1
              example:
                - name: orders.paid
                  internal: false
                  partitions: 12
                  replication: 3
                  underReplicated: 1
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags:
        - Streams
      summary: Create a topic
      description: Create a topic. `partitions`/`replication` default to the broker's defaults.
      parameters:
        - name: id
          in: path
          required: true
