        content:
          application/json:
            schema:
              type: object
              properties:
                folderId:
                  type: string
                  example: fld-1
      responses:
        "200":
          description: '`{ "ok": true }`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: '`{ "error": "Folder not found" }`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Folder not found
