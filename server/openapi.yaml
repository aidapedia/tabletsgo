        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: the broker's refusal while members are connected.
  /api/connections/{id}/streams/groups/{group}/offsets:
    put:
      tags:
        - Streams
      summary: Reset offsets (dry run by default)
      description: |-
        Move a group's committed offsets on one topic. A **dry run by default**: it returns
        the before → after table without changing anything. Applying needs
        `"dryRun": false` plus `confirm`, and an empty group — Kafka refuses a reset while
        members are connected.
      parameters:
        - name: id
          in: path
          required: true
          description: Connection id
          schema:
            type: string
          example: <id>
        - name: group
          in: path
          required: true
          schema:
            type: string
          example: payments-service
        - name: database
          in: query
          description: Target database on the same server (PostgreSQL multi-database browsing; on Redis the numbered database, as `db0`…`dbN` or a bare index).
          schema:
            type: string
        - name: schema
          in: query
          description: Target schema (PostgreSQL; default `public`).
          schema:
            type: string
      requestBody:
        description: '`{ "topic": "orders.paid", "strategy": "timestamp", "value": "2026-10-29T08:00:00Z", "partitions": [0, 1], "dryRun": true }` — `strategy` is `earliest` | `latest` | `timestamp` (`value` = ISO or epoch ms) | `offset` (`value` = N) | `shift` (`value` = ±N); `partitions` defaults to all. Applying adds `"dryRun": false, "confirm": "payments-service"`.'
        content:
          application/json:
            schema:
              type: object
              properties:
                topic:
                  type: string
                  example: orders.paid
                strategy:
                  type: string
                  example: timestamp
                value:
                  type: string
                  example: 2026-10-29T08:00:00Z
                partitions:
                  type: array
                  items:
                    type: integer
                    example: 0
                dryRun:
                  type: boolean
                  example: true
      responses:
        "200":
          description: "`{ \"topic\": \"orders.paid\", \"strategy\": \"timestamp\", \"dryRun\": true, \"offsets\": [{ \"partition\": 0, \"current\": 5200926, \"target\": 5100400, \"delta\": -100526 }] }` (targets are clamped into each partition's retained range)"
          content:
            application/json:
              schema:
                type: object
                properties:
                  topic:
                    type: string
                    example: orders.paid
                  strategy:
                    type: string
                    example: timestamp
                  dryRun:
                    type: boolean
                    example: true
                  offsets:
                    type: array
                    items:
                      type: object
                      properties:
                        partition:
                          type: integer
                          example: 0
                        current:
                          type: integer
                          example: 5200926
                        target:
                          type: integer
                          example: 5100400
                        delta:
                          type: integer
                          example: -100526
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: '`{ "error": "Group \"payments-service\" is Stable with 4 member(s) (payments-7f9c, …). Stop the consumers first — Kafka only resets an empty group.", "reason": "group_active" }`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Group \"payments-service\" is Stable with 4 member(s) (payments-7f9c, …). Stop the consumers first — Kafka only resets an empty group.
                  reason:
                    type: string
                    example: group_active
  /api/connections/{id}/streams/brokers:
    get:
      tags:
        - Streams
      summary: "Brokers: leaders, replicas, skew"
      description: |-
        Every broker with what it carries — partitions it leads and replicates, replicas it
        has fallen out of sync on, and its leadership skew (percent off an even share of
        leaders) — plus cluster totals, read from the metadata of every topic.
      parameters:
        - name: id
          in: path
          required: true
          description: Connection id
          schema:
            type: string
          example: <id>
        - name: database
          in: query
          description: Target database on the same server (PostgreSQL multi-database browsing; on Redis the numbered database, as `db0`…`dbN` or a bare index).
          schema:
            type: string
        - name: schema
          in: query
          description: Target schema (PostgreSQL; default `public`).
          schema:
            type: string
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  clusterId:
                    type: string
                    example: 5L6g3nShT-eMCtK--X86sw
                  controller:
                    type: integer
                    example: 1
                  topics:
                    type: integer
                    example: 42
                  partitions:
                    type: integer
                    example: 318
                  underReplicated:
                    type: integer
                    example: 0
                  offlinePartitions:
                    type: integer
                    example: 0
                  brokers:
                    type: array
                    items:
                      type: object
                      properties:
                        nodeId:
                          type: integer
                          example: 1
                        host:
                          type: string
                          example: b-1.kafka
                        port:
                          type: integer
                          example: 9092
                        controller:
                          type: boolean
                          example: true
                        leaders:
                          type: integer
                          example: 106
                        replicas:
                          type: integer
                          example: 318
                        outOfSync:
                          type: integer
                          example: 0
                        offline:
                          type: integer
                          example: 0
                        leaderSkew:
                          type: integer
                          example: 0
              example:
                clusterId: 5L6g3nShT-eMCtK--X86sw
                controller: 1
                topics: 42
                partitions: 318
                underReplicated: 0
                offlinePartitions: 0
                brokers:
                  - nodeId: 1
                    host: b-1.kafka
                    port: 9092
                    controller: true
                    leaders: 106
                    replicas: 318
                    outOfSync: 0
                    offline: 0
                    leaderSkew: 0
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/connections/{id}/streams/brokers/{broker}:
    get:
      tags:
        - Streams
      summary: One broker's configs
      description: One broker's configuration. `dynamic` marks an override set on this broker at runtime.
      parameters:
        - name: id
          in: path
          required: true
          description: Connection id
          schema:
            type: string
          example: <id>
        - name: broker
          in: path
          required: true
          schema:
            type: string
          example: "1"
        - name: database
          in: query
          description: Target database on the same server (PostgreSQL multi-database browsing; on Redis the numbered database, as `db0`…`dbN` or a bare index).
          schema:
            type: string
        - name: schema
          in: query
          description: Target schema (PostgreSQL; default `public`).
          schema:
            type: string
      responses:
        "200":
          description: '`{ "nodeId": 1, "host": "b-1.kafka", "port": 9092, "configs": [{ "name": "log.cleaner.threads", "value": "2", "isDefault": false, "readOnly": false, "sensitive": false, "dynamic": true }] }`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  nodeId:
                    type: integer
                    example: 1
                  host:
                    type: string
                    example: b-1.kafka
                  port:
                    type: integer
                    example: 9092
                  configs:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          example: log.cleaner.threads
                        value:
                          type: string
                          example: "2"
                        isDefault:
                          type: boolean
                          example: false
                        readOnly:
                          type: boolean
                          example: false
                        sensitive:
                          type: boolean
                          example: false
                        dynamic:
                          type: boolean
                          example: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: '`{ "error": "Broker 9 is not in this cluster." }`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Broker 9 is not in this cluster.
    patch:
      tags:
        - Streams
      summary: Change dynamic broker configs
      description: |-
        Change a broker's dynamic configs at runtime. Like a topic's, the change **merges**
        into the broker's current overrides; `null` removes one. A broker holding a
        *sensitive* dynamic override (whose value is never returned, so can't be carried
        over) is refused. The change reaches the GET a moment later.
      parameters:
        - name: id
          in: path
          required: true
          description: Connection id
          schema:
            type: string
          example: <id>
        - name: broker
          in: path
          required: true
          schema:
            type: string
          example: "1"
        - name: database
          in: query
          description: Target database on the same server (PostgreSQL multi-database browsing; on Redis the numbered database, as `db0`…`dbN` or a bare index).
          schema:
            type: string
        - name: schema
          in: query
          description: Target schema (PostgreSQL; default `public`).
          schema:
            type: string
      requestBody:
        description: '`{ "configs": { "log.cleaner.threads": "2", "message.max.bytes": null } }`'
        content:
          application/json:
            schema:
              type: object
              properties:
                configs:
                  type: object
                  properties:
                    log.cleaner.threads:
                      type: string
                      example: "2"
                    message.max.bytes:
                      type: "null"
      responses:
        "200":
          description: '`{ "ok": true }`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: "`{ \"error\": \"Broker 1 has a sensitive dynamic setting (listener.name.internal.ssl.keystore.password) that can't be carried over — change it with kafka-configs.sh --alter instead.\" }`"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Broker 1 has a sensitive dynamic setting (listener.name.internal.ssl.keystore.password) that can't be carried over — change it with kafka-configs.sh --alter instead.
