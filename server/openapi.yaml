  /api/connections/{id}/redis/command-docs:
    get:
      tags:
        - Redis keyspace
      summary: A command's reference (COMMAND DOCS)
      description: |-
        The connected server's own reference for one command — the data redis.io renders,
        read from `COMMAND DOCS` (Redis 7+) and `COMMAND INFO`. Powers the details view of
        the console's command reference. Always `200`: on an older server, an ACL that
        forbids `COMMAND`, or an unknown name it answers `available: false` with the reason
        and the console falls back to its static docs.
      parameters:
        - name: id
          in: path
          required: true
          description: Connection id
          schema:
            type: string
          example: <id>
        - name: name
          in: query
          description: "`name` (**required**, a command name such as `SET` or `CONFIG`), `database`"
          schema:
            type: string
          example: SET
        - name: database
          in: query
          description: "`name` (**required**, a command name such as `SET` or `CONFIG`), `database`"
          schema:
            type: string
        - name: schema
          in: query
          description: Target schema (PostgreSQL; default `public`).
          schema:
            type: string
      responses:
        "200":
          description: |-
            `subcommands` is filled for container commands (`CONFIG`, `CLIENT`, `XINFO`, …):
            `[{ "name": "CONFIG SET", "summary": "…", "since": "2.0.0" }]`.

            (no docs) `{ "available": false, "version": "6.2.14", "reason": "ERR unknown subcommand 'DOCS'…" }`
          content:
            application/json:
              schema:
                type: object
                properties:
                  available:
                    type: boolean
                    example: true
                  version:
                    type: string
                    example: 7.4.8
                  name:
                    type: string
                    example: SET
                  summary:
                    type: string
                    example: Sets the string value of a key, ignoring its type. The key is created if it doesn't exist.
                  since:
                    type: string
                    example: 1.0.0
                  group:
                    type: string
                    example: string
                  complexity:
                    type: string
                    example: O(1)
                  deprecatedSince:
                    type: "null"
                  replacedBy:
                    type: "null"
                  history:
                    type: array
                    items:
                      type: object
                      properties:
                        version:
                          type: string
                          example: 6.0.0
                        change:
                          type: string
                          example: Added the `KEEPTTL` option.
                  arguments:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          example: key
                        type:
                          type: string
                          example: key
                        display:
                          type: string
                          example: key
                        token:
                          type: "null"
                        since:
                          type: "null"
                        optional:
                          type: boolean
                          example: false
                        multiple:
                          type: boolean
                          example: false
                        arguments:
                          type: array
                          items: {}
                  subcommands:
                    type: array
                    items: {}
                  flags:
                    type: array
                    items:
                      type: string
                      example: write
                  aclCategories:
                    type: array
                    items:
                      type: string
                      example: "@write"
              example:
                available: true
                version: 7.4.8
                name: SET
                summary: Sets the string value of a key, ignoring its type. The key is created if it doesn't exist.
                since: 1.0.0
                group: string
                complexity: O(1)
                deprecatedSince: null
                replacedBy: null
                history:
                  - version: 6.0.0
                    change: Added the `KEEPTTL` option.
                arguments:
                  - name: key
                    type: key
                    display: key
                    token: null
                    since: null
                    optional: false
                    multiple: false
                    arguments: []
                  - name: condition
                    type: oneof
                    display: condition
                    token: null
                    since: 2.6.12
                    optional: true
                    multiple: false
                    arguments:
                      - name: nx
                        type: pure-token
                        display: nx
                        token: NX
                        since: null
                        optional: false
                        multiple: false
                        arguments: []
                      - name: xx
                        type: pure-token
                        display: xx
                        token: XX
                        since: null
                        optional: false
                        multiple: false
                        arguments: []
                subcommands: []
                flags:
                  - write
                  - denyoom
                aclCategories:
                  - "@write"
                  - "@string"
                  - "@slow"
        "400":
          description: '`{ "error": "A command name is required." }`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: A command name is required.
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/connections/{id}/redis/key:
    get:
      tags:
        - Redis keyspace
      summary: Read one key's value (paged)
      description: |-
        One key's value as a generic `{ columns, rows }` page, plus its metadata. Every
        collection type is paged by `offset`/`limit` so a million-element list can still be
        opened. Columns per type: string → `["value"]`, list → `["index","value"]`, set →
        `["#","member"]`, zset → `["rank","member","score"]`, hash → `["field","value"]`,
        stream → `["id","fields"]`.
      parameters:
        - name: id
          in: path
          required: true
          description: Connection id
          schema:
            type: string
          example: <id>
        - name: key
          in: query
          description: "`key` (**required**), `offset` (default `0`), `limit` (1–5000, default `200`), `database`"
          schema:
            type: string
          example: cfg:app
        - name: offset
          in: query
          description: "`key` (**required**), `offset` (default `0`), `limit` (1–5000, default `200`), `database`"
          schema:
            type: string
          example: "0"
        - name: limit
          in: query
          description: "`key` (**required**), `offset` (default `0`), `limit` (1–5000, default `200`), `database`"
          schema:
            type: string
          example: "200"
        - name: database
          in: query
          description: "`key` (**required**), `offset` (default `0`), `limit` (1–5000, default `200`), `database`"
          schema:
            type: string
        - name: schema
          in: query
          description: Target schema (PostgreSQL; default `public`).
          schema:
            type: string
      responses:
        "200":
          description: |-
            `length` is the byte size for a string and the entry count for every collection
            type (`hasMore` is always `false` for a string — it isn't paged).
          content:
            application/json:
              schema:
                type: object
                properties:
                  key:
                    type: string
                    example: cfg:app
                  type:
                    type: string
                    example: hash
                  encoding:
                    type: string
                    example: listpack
                  ttlMs:
                    type: "null"
                  length:
                    type: integer
                    example: 2
                  offset:
                    type: integer
                    example: 0
                  limit:
                    type: integer
                    example: 200
                  hasMore:
                    type: boolean
                    example: false
                  columns:
                    type: array
                    items:
                      type: string
                      example: field
                  rows:
                    type: array
                    items:
                      type: object
                      properties:
                        field:
                          type: string
                          example: debug
                        value:
                          type: string
                          example: "true"
              example:
                key: cfg:app
                type: hash
                encoding: listpack
                ttlMs: null
                length: 2
                offset: 0
                limit: 200
                hasMore: false
                columns:
                  - field
                  - value
                rows:
                  - field: debug
                    value: "true"
                  - field: ver
                    value: "2"
        "400":
          description: '`{ "error": "A key is required." }` or `{ "error": "Key \"ghost\" does not exist." }`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: A key is required.
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/connections/{id}/redis/ttl:
    put:
      tags:
        - Redis keyspace
      summary: Set / clear a key's expiry
      description: |-
        Set or clear a key's expiry. `ttlMs` of `null` or `0` runs `PERSIST`; anything
        positive runs `PEXPIRE`.

        ---
      parameters:
        - name: id
          in: path
          required: true
          description: Connection id
          schema:
            type: string
          example: <id>
        - name: database
          in: query
          description: "`database`"
          schema:
            type: string
        - name: schema
          in: query
          description: Target schema (PostgreSQL; default `public`).
          schema:
            type: string
      requestBody:
        description: '`{ "key": "session:abc", "ttlMs": 60000 }`'
        content:
          application/json:
            schema:
              type: object
              properties:
                key:
                  type: string
                  example: session:abc
                ttlMs:
                  type: integer
                  example: 60000
      responses:
        "200":
          description: '`{ "ok": true, "ttlMs": 60000 }` (or `"ttlMs": null` after a clear)'
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  ttlMs:
                    type: integer
                    example: 60000
        "400":
          description: '`{ "error": "A key is required." }` or `{ "error": "Key \"session:abc\" does not exist or already has no expiry." }`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: A key is required.
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/connections/{id}/streams/overview:
