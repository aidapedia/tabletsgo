  /api/connections/{id}/streams/topics/{topic}/messages:
    get:
      tags:
        - Streams
      summary: Bounded message read
      description: A bounded read, returned in the grid shape every engine uses.
      parameters:
        - name: id
          in: path
          required: true
          description: Connection id
          schema:
            type: string
          example: <id>
        - name: topic
          in: path
          required: true
          schema:
            type: string
          example: orders.paid
        - name: partition
          in: query
          description: "- `partition` — one partition (default: all) - `from` — `latest` (default; the newest `limit` per partition), `earliest`, `-N` (the last N per partition), `offset:N`, `ts:<ISO time or epoch ms>` - `limit` — rows returned (1–the module's messages per read, default 100) - `filter` — a WHERE clause: `key`, `value`, `value.<json.path>`, `header.<name>`, `partition`, `offset`, `timestamp` compared with `= != > >= < <=` or `~` (case-insensitive contains), joined by `AND`. With a filter, newest-first reads walk back through the topic until they have `limit` matches or hit a cap. - `decode` — `auto` (UTF-8, hex for binary, Schema Registry payloads labelled), `string`, `hex`, `base64`"
          schema:
            type: string
          example: "3"
        - name: from
          in: query
          description: "- `partition` — one partition (default: all) - `from` — `latest` (default; the newest `limit` per partition), `earliest`, `-N` (the last N per partition), `offset:N`, `ts:<ISO time or epoch ms>` - `limit` — rows returned (1–the module's messages per read, default 100) - `filter` — a WHERE clause: `key`, `value`, `value.<json.path>`, `header.<name>`, `partition`, `offset`, `timestamp` compared with `= != > >= < <=` or `~` (case-insensitive contains), joined by `AND`. With a filter, newest-first reads walk back through the topic until they have `limit` matches or hit a cap. - `decode` — `auto` (UTF-8, hex for binary, Schema Registry payloads labelled), `string`, `hex`, `base64`"
          schema:
            type: string
          example: "-20"
        - name: limit
          in: query
          description: "- `partition` — one partition (default: all) - `from` — `latest` (default; the newest `limit` per partition), `earliest`, `-N` (the last N per partition), `offset:N`, `ts:<ISO time or epoch ms>` - `limit` — rows returned (1–the module's messages per read, default 100) - `filter` — a WHERE clause: `key`, `value`, `value.<json.path>`, `header.<name>`, `partition`, `offset`, `timestamp` compared with `= != > >= < <=` or `~` (case-insensitive contains), joined by `AND`. With a filter, newest-first reads walk back through the topic until they have `limit` matches or hit a cap. - `decode` — `auto` (UTF-8, hex for binary, Schema Registry payloads labelled), `string`, `hex`, `base64`"
          schema:
            type: string
          example: "20"
        - name: filter
          in: query
          description: "- `partition` — one partition (default: all) - `from` — `latest` (default; the newest `limit` per partition), `earliest`, `-N` (the last N per partition), `offset:N`, `ts:<ISO time or epoch ms>` - `limit` — rows returned (1–the module's messages per read, default 100) - `filter` — a WHERE clause: `key`, `value`, `value.<json.path>`, `header.<name>`, `partition`, `offset`, `timestamp` compared with `= != > >= < <=` or `~` (case-insensitive contains), joined by `AND`. With a filter, newest-first reads walk back through the topic until they have `limit` matches or hit a cap. - `decode` — `auto` (UTF-8, hex for binary, Schema Registry payloads labelled), `string`, `hex`, `base64`"
          schema:
            type: string
          example: value.amount > 100
        - name: decode
          in: query
          description: "- `partition` — one partition (default: all) - `from` — `latest` (default; the newest `limit` per partition), `earliest`, `-N` (the last N per partition), `offset:N`, `ts:<ISO time or epoch ms>` - `limit` — rows returned (1–the module's messages per read, default 100) - `filter` — a WHERE clause: `key`, `value`, `value.<json.path>`, `header.<name>`, `partition`, `offset`, `timestamp` compared with `= != > >= < <=` or `~` (case-insensitive contains), joined by `AND`. With a filter, newest-first reads walk back through the topic until they have `limit` matches or hit a cap. - `decode` — `auto` (UTF-8, hex for binary, Schema Registry payloads labelled), `string`, `hex`, `base64`"
          schema:
            type: string
        - name: database
          in: query
          description: Target database on the same server (PostgreSQL multi-database browsing; on Redis the numbered database, as `db0`…`dbN` or a bare index).
          schema:
            type: string
        - name: schema
          in: query
          description: Target schema (PostgreSQL; default `public`).
          schema:
            type: string
      responses:
        "200":
          description: |-
            `value` is `null` for a tombstone; `cappedBy` is `"time"` or `"bytes"` when a cap
            cut the read short; `cursor[p]` is the offset older messages of partition `p` end at.
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    example: rows
                  columns:
                    type: array
                    items:
                      type: string
                      example: partition
                  rows:
                    type: array
                    items:
                      type: object
                      properties:
                        partition:
                          type: integer
                          example: 3
                        offset:
                          type: integer
                          example: 1204861
                        timestamp:
                          type: string
                          example: 2026-10-29T09:41:07.211Z
                        key:
                          type: string
                          example: ord_8f2k1
                        value:
                          type: string
                          example: '{\"orderId\":\"ord_8f2k1\",\"amount\":129.5}'
                        headers:
                          type: string
                          example: '{\"trace-id\":\"9a1f0c3e\"}'
                        size:
                          type: integer
                          example: 412
                  scanned:
                    type: integer
                    example: 1742
                  matched:
                    type: integer
                    example: 20
                  truncated:
                    type: boolean
                    example: false
                  cappedBy:
                    type: "null"
                  cursor:
                    type: object
                    properties:
                      "3":
                        type: integer
                        example: 1204841
                  elapsedMs:
                    type: integer
                    example: 380
              example:
                type: rows
                columns:
                  - partition
                  - offset
                  - timestamp
                  - key
                  - value
                  - headers
                  - size
                rows:
                  - partition: 3
                    offset: 1204861
                    timestamp: 2026-10-29T09:41:07.211Z
                    key: ord_8f2k1
                    value: '{"orderId":"ord_8f2k1","amount":129.5}'
                    headers: '{"trace-id":"9a1f0c3e"}'
                    size: 412
                scanned: 1742
                matched: 20
                truncated: false
                cappedBy: null
                cursor:
                  "3": 1204841
                elapsedMs: 380
        "400":
          description: 'a bad filter, e.g. `{ "error": "Unknown field \"nope\" in WHERE." }`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unknown field \"nope\" in WHERE.
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags:
        - Streams
      summary: Clear a topic, keep it (confirm)
      description: |-
        Clear a topic: delete every message up to each partition's end, and keep the topic —
        its configs, ACLs and consumer groups stay. Kafka refuses this on a compact-only topic.
      parameters:
        - name: id
          in: path
          required: true
          description: Connection id
          schema:
            type: string
          example: <id>
        - name: topic
          in: path
          required: true
          schema:
            type: string
          example: orders.paid
        - name: database
          in: query
          description: Target database on the same server (PostgreSQL multi-database browsing; on Redis the numbered database, as `db0`…`dbN` or a bare index).
          schema:
            type: string
        - name: schema
          in: query
          description: Target schema (PostgreSQL; default `public`).
          schema:
            type: string
      requestBody:
        description: '`{ "confirm": "orders.paid", "partitions": [0, 3] }` — `partitions` defaults to all.'
        content:
          application/json:
            schema:
              type: object
              properties:
                confirm:
                  type: string
                  example: orders.paid
                partitions:
                  type: array
                  items:
                    type: integer
                    example: 0
      responses:
        "200":
          description: '`{ "ok": true, "cleared": 120443, "partitions": [0, 3] }`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  cleared:
                    type: integer
                    example: 120443
                  partitions:
                    type: array
                    items:
                      type: integer
                      example: 0
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: '`{ "error": "Topic \"orders.paid\" is compacted (cleanup.policy=compact), and Kafka only clears topics that delete old segments. Add \"delete\" to its cleanup.policy first, or delete and re-create it." }`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Topic \"orders.paid\" is compacted (cleanup.policy=compact), and Kafka only clears topics that delete old segments. Add \"delete\" to its cleanup.policy first, or delete and re-create it.
    post:
      tags:
        - Streams
      summary: Produce one message
      description: |-
        Produce one message (acks = all). An object `value` is sent as JSON. With a Schema
        Registry on the connection, `keySchema` / `valueSchema` write that side in the
        registry's wire format from its JSON (`{ subject, version? = "latest", message? }` —
        `message` picks a Protobuf message other than the schema's first).
      parameters:
        - name: id
          in: path
          required: true
          description: Connection id
          schema:
            type: string
          example: <id>
        - name: topic
          in: path
          required: true
          schema:
            type: string
          example: orders.paid
        - name: database
          in: query
          description: Target database on the same server (PostgreSQL multi-database browsing; on Redis the numbered database, as `db0`…`dbN` or a bare index).
          schema:
            type: string
        - name: schema
          in: query
          description: Target schema (PostgreSQL; default `public`).
          schema:
            type: string
      requestBody:
        description: '`{ "key": "ord_123", "value": { "orderId": "ord_123" }, "headers": { "source": "tabletsgo" }, "partition": null }` — `value: null` sends a tombstone; omit `partition` to hash the key. With a schema: `{ "key": "ord_123", "value": "{\"id\":\"ord_123\",\"amount\":12.5}", "valueSchema": { "subject": "orders.paid-value" } }`'
        content:
          application/json:
            schema:
              type: object
              properties:
                key:
                  type: string
                  example: ord_123
                value:
                  type: object
                  properties:
                    orderId:
                      type: string
                      example: ord_123
                headers:
                  type: object
                  properties:
                    source:
                      type: string
                      example: tabletsgo
                partition:
                  type: "null"
      responses:
        "200":
          description: '`{ "topic": "orders.paid", "partition": 4, "offset": 4021377, "timestamp": 1793271234567 }`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  topic:
                    type: string
                    example: orders.paid
                  partition:
                    type: integer
                    example: 4
                  offset:
                    type: integer
                    example: 4021377
                  timestamp:
                    type: integer
                    example: 1793271234567
        "400":
          description: "`{ \"error\": \"A value is required (null sends a tombstone).\" }` or, with a schema, `{ \"error\": \"The value doesn't match the Avro schema: amount = undefined is not double\" }`"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: A value is required (null sends a tombstone).
        "401":
          $ref: "#/components/responses/Unauthorized"
