          schema:
            type: string
      requestBody:
        description: '`{ "configs": { "cleanup.policy": "compact", "retention.ms": null }, "partitions": 16 }`'
        content:
          application/json:
            schema:
              type: object
              properties:
                configs:
                  type: object
                  properties:
                    cleanup.policy:
                      type: string
