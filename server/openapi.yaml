# The Tabletsgo HTTP API, served as Swagger UI at /api/docs (server/openapi.js).
# Every route in server.js is described here; tests/openapi.test.js fails when
# the two disagree. info.version is replaced by the running app's version.
openapi: 3.1.0
info:
  title: Tabletsgo API
  version: 0.0.0
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  description: |-
    The HTTP API behind Tabletsgo: every route `server.js` serves.

    ## Conventions

    - **Base URL:** `http://localhost:3000` (port from `PORT`, default `3000`). All endpoints live under `/api`.
    - **Content type:** requests and responses are JSON. The JSON body limit is `10mb`.
    - **CORS:** enabled for all origins (`cors()` with defaults).
    - **Auth:** sign in at Hayat (see **Signing in (Hayat)**) and send its access token as `Authorization: Bearer <token>` — use **Authorize** on this page. Workspace, member and every per-connection route require it: unauthenticated → `401`, not a member → `403`.
    - **Error shape:** errors return `{ "error": "<message>" }` with `400` (bad input), `401` (bad login), `404` (not found) or `500` (server error). The query, insert and test routes return database errors in the body too — see each route.
    - **Query params** (where supported): `database` is the target database on the same server (PostgreSQL multi-database browsing; on Redis the numbered database, as `db0`…`dbN` or a bare index), `schema` is the target schema (PostgreSQL, default `public`), `limit` is the row cap for table data (default `200`).
    - **Engines:** `sqlite`, `postgresql`, `redis`, `kafka`. Routes that only make sense for a relational engine (`/columns`, `/indexes`, `/diagram`, `/insert`, `/analyze`, `/table/{table}`, backups) reject a Redis connection with a `400` naming the type; `/tables` and `/objects` return `[]`. Redis browses its keyspace through the `/redis/*` routes and runs commands through the shared `/query` route.

    ## Who may do what

    Hayat decides. Two tiers: **instance** — tabletsgo's admin role at Hayat's root, for `/api/admin/*` and updates, carrying no workspace data access; and **workspace** — grants on the workspace's tenant node and below, asked for by permission (see **Permissions**), never by role name.

    ## Static frontend

    If a `dist/` build exists, it is served as static files with an SPA fallback: any non-`/api/...` GET returns `dist/index.html`. Otherwise unknown routes return `404 { "error": "Not found" }`.
servers:
  - url: /
    description: This instance
security:
  - bearerAuth: []
tags:
  - name: Signing in (Hayat)
    description: |-
      Tabletsgo keeps no accounts. People sign in at **Hayat** — an OpenID provider — and every request carries the Hayat access token as `Authorization: Bearer` (use **Authorize** on this page). The token is verified offline against Hayat's published keys and must have been issued to tabletsgo's sign-in client; an account that isn't active in Hayat is treated as signed out.

      <details><summary>More about signing in</summary>

      - **No login, password, invite, sign-up or Google/GitHub routes** — all of that is Hayat's, on Hayat's hosted pages. Sign-out ends the Hayat session (RP-initiated logout).
      - **No session store.** A token is verified on every request; who someone is (`GET /api/auth/me`) and what they may do are asked of Hayat's service API and cached for a few seconds, emptied as soon as Hayat's Watch stream reports a change.
      - **Instance admin** is a grant, not a column: `tabletsgo.instance.manage` at Hayat's root, which the `tabletsgo.admin` role carries.

      </details>
  - name: Signing in (solo)
    description: |-
      **Solo mode** (`TABLETSGO_MODE=solo`, the default without Hayat) is tabletsgo for one person: one owner, one workspace, no Hayat. The owner holds every permission and is the instance admin. In enterprise mode every route under this tag answers `404`.

      <details><summary>More about solo sign-in</summary>

      - **First run.** A new solo instance prints a six-word setup code to its log. `POST /api/auth/solo/setup` takes it with the owner's name, email and password, so whoever can reach the port but not read the log can't claim the instance.
      - **Tokens.** Setup, sign-in and refresh answer with a 15-minute `accessToken` (send it as `Authorization: Bearer`, exactly like a Hayat token) and set a 30-day refresh token in the `tabletsgo_solo_refresh` cookie — `HttpOnly`, `SameSite=Strict`, `Path=/api/auth/solo`.
      - **Ending sessions.** A password change and `logout` with `everywhere: true` end every session at once.
      - **Forgotten password:** `npm run solo:reset-password` on the server (`docker compose exec tabletsgo npm run solo:reset-password`).
      - **Limits.** Five failed attempts per minute per address, then `429`.

      </details>
  - name: Permissions
    description: |-
      Every workspace-scoped route asks for a **permission** — `requirePermission(req, res, wsId, 'storage.manage')` — and Hayat answers it from the grants on the workspace's tenant node and above (roles, groups and grants are edited in Hayat's console). Routes and the console use short keys; tabletsgo's contract declares them in Hayat as `tabletsgo.<key>`.

      <details><summary>More about permissions</summary>

      | Key | Hayat key | Scope | Allows |
      | --- | --- | --- | --- |
      | `instance.manage` | `tabletsgo.instance.manage` | root | The admin area: modules, mail server, updates. |
      | `workspace.manage` | `tabletsgo.workspace.manage` | tenant | `experiments` and `sessions` on `PUT /api/workspaces/:id`. |
      | `workspace.delete` | `tabletsgo.workspace.delete` | tenant | `DELETE /api/workspaces/:id` (tabletsgo's data only). |
      | `notifications.manage` | `tabletsgo.notifications.manage` | tenant | `notifications` on `PUT /api/workspaces/:id`. |
      | `storage.manage` | `tabletsgo.storage.manage` | tenant | Create/edit/delete storage destinations. |
      | `ssh.manage` | `tabletsgo.ssh.manage` | tenant | SSH keys and gateways. |
      | `connections.create` | `tabletsgo.connections.create` | tenant | `POST /api/connections`, `/api/connections/import`. |
      | `connections.manage` | `tabletsgo.connections.manage` | connection | Edit/delete/export a connection it reaches. |
      | `connections.transfer` | `tabletsgo.connections.transfer` | connection | `PUT /api/connections/:id/owner`. |
      | `connection.open` | `tabletsgo.connection.open` | connection | Open a connection: query, browse, edit data, its dashboards and workflows. |
      | `members.manage`, `teams.manage`, `resources.organise`, `resources.grant` | `hayat.*` | tenant/group | Hayat's own — shown so the console can point at Hayat's console. |

      Roles tabletsgo's contract suggests: `tabletsgo.admin` (root), `tabletsgo.owner` (every workspace key), `tabletsgo.connection-user` (open), `tabletsgo.connection-manager` (manage + open).

      A refusal is `403 { "error": "You do not have permission to do that.", "permission": "<key>" }` inside the workspace and `403 { "error": "Forbidden" }` outside it.

      </details>
  - name: Workspaces
    description: |-
      A workspace is a **Hayat tenant**: Hayat owns its existence, name, roster and owner, and tabletsgo never creates, renames or deletes one. Tabletsgo keeps its own settings per workspace (`workspaces.settings`): beta experiments, notification preferences and the session policy.

      <details><summary>More about workspaces</summary>

      - **Membership** is the tenant's roster. It gates data: a member sees every connection in the workspace; opening one is `connection.open`.
      - **Notifications:** `settings.notifications.backupFailure` is `{ enabled, memberIds }`; a scheduled backup that ends up failed emails every listed member (addresses from Hayat's directory).

      </details>
  - name: Instance administration
    description: |-
      Every route below requires tabletsgo's admin role — `tabletsgo.instance.manage` granted at Hayat's root; anything else gets `403 { "error": "Admin access required" }`. The surface is modules, the mail server and updates. Accounts, workspaces, roles and sign-in methods are administered in Hayat's console.

      <details><summary>More about instance administration</summary>

      ### Email (SMTP)

      The instance's **one** mail server for what tabletsgo itself sends (backup-failure and module notices). **Resolution order:** this saved config → the `SMTP_*` env vars. Stored in `app_settings` under `smtp`, the password encrypted at rest and never returned.

      ### Modules

      Which databases and features this instance offers, and their settings. `engine` modules are connection types; `feature` modules are capabilities (`backup`). Stored in `app_settings` under `modules`; **a module with no stored choice is on**. An engine still in use is only turned off with `force` — its connections are then **locked, not deleted**: every `/api/connections/:id` route answers `403 { locked: true }` except `DELETE` and the handshake, its webhook refuses, and the schedulers skip it. At least one engine stays on.

      </details>
  - name: Connections
    description: |-
      **Who may change a connection record.** `PUT`, `DELETE` and `/export` all use one rule: hold **`connections.manage`** at the connection (a grant on it, a group above it, or the workspace) *or* be the connection's own **`ownerId`** (that one connection, whatever your role). That is what lets a plain member run the connections they own — edit them, back them up — without being given the whole workspace. Failing it returns `403 { "error": "You need to own this connection to <action>." }`. Using the *database* behind a connection is a different question entirely — see Connection access.

      <details><summary>More about connections</summary>

      ### Connection export / import

      Moves a whole connection — its settings **and** every artifact hanging off it — as
      one portable JSON document. Included: connection settings, folders (all four types,
      with their tree + colors), table→folder assignments, saved queries (a schema draft
      brings its diagram design — the table, group and note positions — with it),
      workflows, dashboards and the backup schedule. Deliberately **excluded**: history/audit rows
      (query history, workflow runs, backup runs, schema migrations) and connection access
      grants — they describe one instance, not the connection's configuration.

      The document is dialect-agnostic: connection settings ride along as an opaque
      `connection.settings` object, so a new database type needs no change here.

      ### Connection access

      Opening a connection is the `tabletsgo.connection.open` permission in Hayat, asked at the connection's node: a grant on it or on a group above it (the `connection-user` role), the roster of a **group it is filed under** (placement — the contract sets `via_placement`), or owning it. Hayat refuses anyone not on the workspace's roster (`requires_membership`). **Nothing granted means nobody.** Enforced by the `GET /api/connections` filter and the `/api/connections/:id/*` guard; changed in Hayat's console (`GET /api/connections/:id/access` links there).

      Every connection and storage destination is mirrored into Hayat's tree when it is created, renamed, re-owned or deleted — always by tabletsgo, never on its own in Hayat.

      </details>
  - name: Saved queries
    description: |-
      #### The schema design document (`layout`)

      <details><summary>More about saved queries</summary>

      The same shape wherever a draft is stored, and the same shape the editor's
      **Export → Design (JSON)** file carries under its own `layout` key:

      | Field | Meaning |
      | --- | --- |
      | `version` | document version (currently `1`) |
      | `tables` | table name → `{ x, y }`; includes tables currently hidden from the diagram, so hiding one never loses its place |
      | `notes` | canvas sticky notes: `{ id, x, y, w, h, text, color }` |
      | `groups` | group regions: `{ id, name, color, tables[], x, y, w, h }`. On a connection the `id` is the table folder's — the folder row wins and the rectangle is the fallback for a group whose member tables are all hidden (or which arrived with an imported design, in a draft that has no folders of its own) |

      The server validates only that it is a JSON object, never its contents: this is
      the editor's document, and a draft written by a newer client must still open on
      an older server rather than 400. Send `null` to forget an arrangement.

      </details>
  - name: Folders
    description: |-
      Folders are polymorphic: one tree per resource `type`. `type=query` groups saved queries (uncapped nesting), `type=dashboard` groups dashboards (3-level cap), `type=workflow` groups workflows (3-level cap), `type=table` groups the connected database's tables (3-level cap). The `type` param defaults to `query` for older clients. Each item points back via its own `folderId` — except tables, which live in the user's database and are mapped by name in `connection_tables` (see the `/tables/:table/folder` endpoint below). Every folder may carry a `color`.

      <details><summary>More about folders</summary>



      </details>
  - name: Table folders
    description: |-
      Tables are grouped by the generic folders tree above, using `type=table`. Each table belongs to **at most one** folder; table names are plain strings, so the contract is database-agnostic across every dialect. Folder create/list/update/ delete all go through `/api/connections/:id/folders` — the only extra endpoint is membership:

      <details><summary>More about table folders</summary>

      > **Migrated from domains.** Meta migration v5 folded every domain into this tree
      > (same id, name and color), so previously assigned tables keep their grouping.
      > The `/api/connections/:id/domains*` endpoints are gone.

      </details>
  - name: Query history
    description: Persisted log of query executions, recorded by the SQL editor.
  - name: Workflows
    description: |-
      Node-graph automations (React Flow) run against the connection. A workflow's `graph` is `{ nodes, edges }` in React Flow shape; each node's `type` is one of `manual` (trigger), `schedule` (trigger), `webhook` (trigger), `query`, `http`, `js`, `switch`, `loop`, `export`, `storage`, and its config lives in `node.data`: - `query`: `{ sql }` — the SQL may inline scalar values from the node's input as `{{input.path}}` (dotted paths supported, e.g. `{{input.row.id}}`); values are rendered as SQL literals (strings quoted with `''` doubling, numbers bare, booleans `TRUE`/`FALSE`, missing → `NULL`; a non-scalar value fails the node). Add an `:ident` modifier — `{{input.field:ident}}` — to render the value as a quoted SQL **identifier** instead (double-quoted with `""` doubling), for the few statements that take a bare name and can't be parameterized, e.g. `VACUUM (ANALYZE) {{input.relname:ident}}`. The value must be a non-empty string; NULL/number/boolean fail the node so an identifier slot never silently vanishes or injects. · `http`: `{ method, url, headers, body }` · `js`: `{ code }` - `js`: `{ code }` — the body receives `input`, returns the node output. Besides `input`/`console`, a curated **`crypto`** helper is in scope (no `require`): `crypto.hmac(algo, key, data, enc="hex")`, `crypto.hash(algo, data, enc="hex")`, `crypto.base64(s)`, `crypto.base64url(s)`, `crypto.hex(s)`, `crypto.randomUUID()`, `crypto.timingSafeEqual(a, b)`. Typical use: sign an outbound request, e.g. `return { ...input, sig: crypto.hmac('sha256', 'secret', JSON.stringify(input.body)) }`, then reference `input.sig` in a downstream `http` node's headers. - `webhook`: `{ token }` — a trigger fired by an inbound HTTP request to the public hook route (see below). Passes the request as the run's initial input. - `switch`: `{ cases: [{ expr, label }] }` · `loop`: `{ itemsExpr }` - `schedule`: `{ frequency: "manual"|"hourly"|"daily", hourOfDay?: 0-23 }` — UTC. **Breaking change:** this replaces the old freeform `{ cron }` field, which is now inert. - `export` ("Export SQL"): no config — dumps the workflow's own connection to a SQL file. Output: `{ filePath, sizeBytes, dialect }`. sqlite/postgresql only. - `storage` ("Store to Storage"): `{ destinationIds: string[], retentionDays?: number, encrypt?: boolean }` — uploads the upstream node's `{ filePath }` output to each listed storage destination (see below). `encrypt` (default off) encrypts the file with a server-derived key (AES-256-GCM, scrypt off `ENCRYPTION_KEY`) before upload; `retentionDays` (default `0` = never) deletes objects older than that under the same connection's key prefix after a successful upload. Output: `{ uploaded: [{ destinationId, ok, key?, sizeBytes?, error?, encrypted?, prunedCount?, pruneError? }] }`.

      <details><summary>More about workflows</summary>

      Edges thread a single `input` (a node's output) to the next node; `sourceHandle`
      selects a branch (`out` default; `case-N`/`default` for switch; `body`/`done` for loop).
      Trigger nodes (`manual`/`schedule`/`webhook`) pass the run's initial input straight
      through — `null` normally, the `input` posted to `/run` (e.g. a dashboard table row
      from a row-action button), or the `{ body, query, headers, method }` of the inbound
      request for a webhook run.

      A workflow can be scheduled: set `workflows.schedule_enabled = 1` (via `PUT
      .../workflows/:wid { "scheduleEnabled": true }`) with a graph containing exactly
      one `schedule` node whose `frequency` is `hourly`/`daily` — the server then
      computes `next_run_at` and a minutely cron tick (`WORKFLOW_SCHEDULER_ENABLED`)
      fires it automatically, same execution path as a manual run. Every execution
      (manual or scheduled) is persisted to `workflow_runs` (see below).

      A workflow can be marked `protected` (`protected: 1`) — it then behaves like any
      other workflow (listed, editable, runnable) except `DELETE` on it always 409s.
      Nothing sets this automatically today; backups (below) are a separate system,
      not a workflow.

      > ⚠️ **Security:** the `/run` executor runs arbitrary SQL, makes server-side HTTP
      > requests (internal URLs reachable — SSRF), and evaluates user JavaScript in a
      > `node:vm` context, which is **not** a hard sandbox. This is acceptable because
      > the routes sit behind auth + workspace-membership — the same trust level as the
      > "run any SQL" query editor. Do not expose to untrusted users. Guards: per-JS 3s
      > CPU timeout, ~5000-step budget, ~1000 loop iterations, ~20s overall cap for
      > ordinary graphs — graphs containing `export`/`storage` get a 30-minute cap instead,
      > since a full database dump + upload can legitimately take longer.

      ⚠️ **Security:** the token is the *only* gate — anyone holding the URL can run the
      workflow (which itself can run SQL / make server-side HTTP calls / eval JS, per the
      warning above). Treat the URL as a secret; regenerate the token to revoke it.

      </details>
  - name: Dashboards
    description: |-
      Analytics dashboards (New Relic-style) rendered by the frontend. A dashboard is a name + one JSON `config` blob: `{ "variables": [...], "widgets": [...] }` — dynamic variables (query-backed or static lists) and chart/table/metric/text widgets whose SQL may reference variables as `{{name}}`. The server stores the config opaquely (its shape is owned by `src/features/dashboard/types.ts`) and runs no SQL itself — widget queries execute through the existing `POST /api/connections/:id/query`, so dashboards work with every database type the query endpoint supports (SQLite, PostgreSQL, future dialects).

      <details><summary>More about dashboards</summary>

      Dashboards can be organized into folders (see **Dashboard folders** below); each
      dashboard carries an optional `folderId` (`null` = root).

      </details>
  - name: Storage destinations
    description: |-
      S3-compatible object storage (AWS S3, MinIO, R2, Backblaze B2, …) that backup schedules upload dumps to (and that user-built workflows can also target via a `storage` node). Same split as connections: plain columns for dialect-agnostic fields, `accessKeyId`/`secretAccessKey`/`sessionToken` encrypted into `credentials` (AES-256-GCM, key namespaced separately from connection credentials).

      <details><summary>More about storage destinations</summary>

      ### Reserved "local" destination (server disk)

      A backup schedule can also store dumps on the server's own disk instead of (or
      alongside) S3 — the default when no S3 destination is configured. This is the
      reserved destination id **`"local"`**: it is *not* a `storage_destinations` row
      and is never returned by `GET /api/storages`, but it is accepted wherever a
      `destinationId` is (backup schedule `destinationIds`, and the `destinationId`
      path segment of the run download/delete/restore endpoints). Files are written
      under `data/backups/<sanitized connection name>/<YYYY-MM-DD>/<dump>` (mirroring
      the S3 key layout), and encryption/retention/download/delete/restore all behave
      identically to an S3 destination. If a schedule's `destinationIds` is empty, the
      backup falls back to `["local"]` at run time.

      </details>
  - name: SSH keys & gateways
    description: |-
      A database on a private network is reached through a bastion. In the UI this is the sidebar's **SSH** group: **Host** (`/ssh/hosts`) lists gateways, **Key** (`/ssh/keys`) lists keys — the API keeps the name *gateway*. A **key** is a keypair the workspace holds — generated on the server or imported — whose public half is shown so it can be appended to the bastion's `~/.ssh/authorized_keys`. A **gateway** is the bastion itself (host, port, user) plus how it logs in: one of the workspace's keys, or a password. A connection names a gateway with `sshGatewayId`.

      <details><summary>More about ssh keys & gateways</summary>

      When a tunneled connection is used, the db layer (`server/db/tunnel.js`) opens a
      listener on `127.0.0.1:<random>`, forwards every socket through an SSH session to
      the connection's host:port, and hands the driver the connection pointed at that
      listener — so queries, the Redis keyspace routes and `pg_dump`/`pg_restore`
      backups all go through it. TLS still verifies the real database host name. The
      tunnel is cached per connection and closed with its idle session; editing the
      gateway drops it (and the connection's pools) so the next query dials the new
      settings.

      Secrets never leave the server: a private key, its passphrase and a gateway
      password are AES-256-GCM sealed (own key namespace), and reads report
      `hasPassphrase` / `hasPassword` instead. Reads need membership; every write (and
      `/test`) needs **`ssh.manage`**.

      **How a host is reached (`transport`).**
      - `"tcp"` (default) — a direct TCP connection to `host:port`. This covers any
        SSH server, including **Railway** (`host: "ssh.railway.com"`, `username`: the
        service's domain or instance ID, a key registered with Railway; connections then
        use private-network addresses like `postgres.railway.internal:5432`, or
        `127.0.0.1` only when logging in as the database's own service). The username
        must be the service's public domain or its **service instance ID** (dashboard:
        open the service, ⌘K / Ctrl+K → *Copy Service Instance ID*) — a
        `.railway.internal` name is refused with a `400`, because Railway doesn't
        recognise it and logs the session into its interactive *dev.new* menu, where
        every forward is refused. That refusal, if it happens anyway, is diagnosed as a
        wrong username rather than an unreachable database.
      - `"cloudflare"` — an SSH server behind a **Cloudflare Tunnel** protected by
        Cloudflare Access. `host` is the Access application's hostname (`port` is
        ignored); the SSH stream is carried over `wss://<host>` in binary WebSocket
        frames, as `cloudflared access ssh` does, authenticated with an Access
        **service token** (`Cf-Access-Client-Id` / `Cf-Access-Client-Secret`). No
        `cloudflared` binary is needed. `ws://` is accepted only for loopback (tests).

      The UI's provider presets (SSH server / Railway / Cloudflare Access) are not
      stored: they are derived from `transport` and `host`.

      **Host key pinning.** The first successful login records the gateway's host key
      fingerprint (`hostFingerprint`); every later login must present the same key or
      is refused. Changing a gateway's host or port forgets the pin, and so does
      `"resetHostKey": true` on `PUT` (for a bastion that was legitimately rebuilt).

      </details>
  - name: Backup
    description: |-
      The **Backup module** (see Modules): while an instance admin has it turned off, every route below answers `403 { "error": "Backup is turned off on this instance. …" }` and the scheduler skips its tick. Nothing is deleted.

      <details><summary>More about backup</summary>

      A standalone system — its own tables (`backup_schedules`, `backup_runs`) and
      scheduler tick, **not** a workflow. It reuses the same export/upload/encrypt/
      retention primitives a `storage` workflow node uses, but orchestrates them
      directly (`runBackupOnce` → `execExportSql` → `execStoreToStorage`). One
      schedule per connection. All schedule config (create + edit) is driven from
      the frontend's Edit Connection → Backup tab; the connection's own Backup tab
      is a read-only viewer (status, calendar, version list).

      **Connection configuration in a backup.** With `includeConfig` on, each run
      uploads a second artifact next to the database dump: the connection's export
      document (the same JSON `GET /api/connections/:id/export` returns — settings,
      folders, saved queries, workflows, dashboards, the schedule itself), named
      `<uuid>.connection.json` in the same date folder, honoring the schedule's
      `encrypt`. It is **always written without secrets** — the file may sit in a
      bucket for years; rebuilding from it means re-entering the password via
      `POST /api/connections/import`.

      The config artifact is recorded **on** each destination's upload entry
      (`configKey` / `configSizeBytes` / `configEncrypted`), not as an entry of its
      own, so every lookup by `destinationId` (download, delete, restore) still
      resolves the dump — the thing a restore needs. A failed config upload records
      `configError` on the entry and does **not** fail the run: the dump already
      succeeded, and failing would re-dump the whole database on every retry.
      Retention pruning is unchanged — the dump's prune pass already sweeps the
      whole folder by date, so both artifacts age out together.

      </details>
  - name: Schema migrations
    description: |-
      Audit trail of DDL commits. The frontend executes staged DDL via the existing `/query` endpoint (below) as before; once a batch commits successfully, it calls `POST .../schema/migrations` once to record what ran (and its best-effort rollback SQL) and bump the connection's `schemaVersion`. One version per successful commit batch, not per statement.

      <details><summary>More about schema migrations</summary>

      Each migration carries a `status` (`active` | `rollbacked`). `POST
      .../schema/rollback` restores the schema to a target version by running the
      down SQL of every still-active version newer than it and marking those
      `rollbacked`, then resets `schemaVersion` back to the target (it does **not**
      bump forward). Version numbers are therefore not globally unique — a rolled-back
      `v2` and a later fresh `v2` can coexist; `status` distinguishes them.

      </details>
  - name: Schema & data browsing
    description: |-
      > All routes below accept optional `?database=` and `?schema=` query params > (PostgreSQL). MySQL reads only `database` (its schemas are databases); SQLite ignores both.

      <details><summary>More about schema & data browsing</summary>

      ### Connection sessions

      A **session is one open connection to the database** — the Postgres pool for a
      database, the ioredis client for a db index, the SQLite file handle — *not* a
      browser tab. Everyone browsing the same target shares one session and shows up as
      a participant on it, so five people on one database count as one session.

      Sessions are registered by the db layer itself: any call that touches a database
      opens or refreshes the session for the handle it's about to use, and the session
      disappears (releasing the handle) after `SESSION_IDLE_TTL_MS` with no activity.
      There is no "open session" endpoint — nothing to leak or get out of sync with the
      real sockets. They live in the session store (in-process, or Redis when
      `SESSION_REDIS_URL` is set), which is what makes the count correct across replicas.

      **The limit** resolves most-specific-first: the workspace's
      `settings.sessions.maxPerConnection` → `MAX_SESSIONS_PER_CONNECTION` → unlimited.
      0 at both levels means unlimited (the shipped default). A connection carries no
      override of its own — a cap protects the database server, so it's a workspace
      decision, not one to re-answer per connection. Opening a
      *new* session past the limit fails with `429` (`GET /handshake` reports it as
      `reason: "at_capacity"` instead — see above). Backup/restore are deliberately
      exempt: a scheduled dump must not fail because people are browsing.

      > Under a race two replicas can each open a handle at the same instant and exceed
      > the limit by one. The count is never *under*-reported, which is the side that
      > matters for protecting a database.

      </details>
  - name: Mutations
  - name: Table data export / import
    description: |-
      The console's **Export / Import** tab: table rows out to a file and back in, as CSV, JSON or SQL. Engine-agnostic (`server/data-transfer.js` over the db layer's `getTableData` / `insertRows` / `runScript` / `tableDdl`), so it works the same on SQLite and PostgreSQL and on any engine that implements those ops. A tableless engine (Redis) has no tables to export and answers an import with a `400` naming its type. Not to be confused with `GET /api/connections/:id/export`, which moves the connection's *configuration*.

      <details><summary>More about table data export / import</summary>

      **Formats**

      | Format | Holds | Notes |
      |---|---|---|
      | `csv`  | one table | header row + one line per row; an empty cell is `NULL` both ways |
      | `json` | any number of tables | the `tabletsgo.data` document below; on import a bare array of row objects (into the table named after the file) or a `{ "<table>": [rows] }` map also works |
      | `sql`  | any number of tables | `CREATE TABLE/INDEX IF NOT EXISTS` (with `includeSchema`) then one `INSERT` per row; table names unqualified so the script replays into whichever schema it is imported into |

      Bytes are written as `\x…` hex text in CSV/JSON (as an engine-specific literal in
      SQL). Multi-table exports are ordered parents-first by foreign key, so a replay
      never inserts a row before the row it references.

      ```json
      {
        "format": "tabletsgo.data",
        "version": 1,
        "exportedAt": "2026-10-02T08:00:00.000Z",
        "source": { "type": "postgresql" },
        "tables": [
          {
            "name": "users",
            "ddl": ["CREATE TABLE IF NOT EXISTS \"users\" (…);"],
            "columns": ["id", "name"],
            "rows": [{ "id": 1, "name": "Ada" }]
          }
        ]
      }
      ```

      `ddl` is present only when exported with `includeSchema`.

      </details>
  - name: Redis keyspace
    description: |-
      Redis has no tables, so the generic `/tables` and `/objects` routes return `[]` for it and the console's sidebar reads the keyspace through these routes instead. Everything else — running commands, workflow query nodes, dashboard widgets — goes through the shared `POST /api/connections/:id/query` route above.

      <details><summary>More about redis keyspace</summary>

      All four routes accept the `database` query param (`db0`…`dbN` or a bare index) and
      answer `400 { "error": "Not a Redis connection (type: postgresql)." }` on any other
      engine, `404` when the connection doesn't exist.

      </details>
  - name: Streams
    description: |-
      The browsing side of a log-shaped engine (Kafka today). The routes are named for the capability, not the engine: each calls a generic op in `server/db`, so an engine without the stream capability answers `400 { "error": "Topics are not supported for sqlite connections." }` (or `"Consumer groups are not supported…"`) and another log-shaped engine can implement the same ops without a route change. Running commands, workflow query nodes and dashboard widgets go through the shared `POST /api/connections/:id/query` route (see the Kafka command language under it below).

      <details><summary>More about streams</summary>

      Access is the usual per-connection guard — whoever can open the connection can use
      these. Deleting a topic or group, and applying an offset reset, must echo the name
      back as `confirm`. Broker errors carry a status: `404` unknown topic/group, `409`
      already exists / group not empty, `403` the cluster's ACLs refused, `400` invalid.

      Reads are bounded: no consumer group is joined and nothing is committed, and every
      read stops at the Kafka module's **messages per read** (default 500), **bytes
      fetched per read** (default 16 MiB) or **read time limit** (default 8000 ms). An
      instance admin sets these in Admin → Modules → Kafka (`PUT /api/admin/modules/kafka`),
      without a restart.

      </details>
  - name: Kafka ecosystem services
    description: |-
      Schema Registry, Kafka Connect and ksqlDB are reached over HTTP from settings on the Kafka connection: `schemaRegistryUrl`, `connectUrl`, `ksqlUrl`, each with an optional `<service>Username` / `<service>Password` (Basic auth; for Confluent Cloud the API key and secret). They are dialed the way the brokers are — through the connection's SSH tunnel when it has one — trust its `caCert`, skip verification when `tls` is `insecure`, and present its client certificate when one is set.

      <details><summary>More about kafka ecosystem services</summary>

      A connection without the service answers
      `400 { "error": "This connection has no Schema Registry — add its URL in the connection settings." }`;
      a service that can't be reached `502`, one that doesn't answer `504`, one that
      refuses the credentials `403`. The service's own error message is passed through.

      ### The Kafka command language (`POST /api/connections/:id/query`)

      On a Kafka connection the `sql` body field takes commands, one per line (`#` comments).
      One command returns its own result; several return one summary row per command
      (`#`, `command`, `status`, `reply`), so a failure in the middle is visible.

      | Command | Returns |
      | --- | --- |
      | `TOPICS [LIKE 'orders.*'] [INTERNAL]` | topic, partitions, replication, under_replicated |
      | `DESCRIBE <topic>` | per partition: leader, replicas, isr, earliest, latest, messages, under_replicated (isr shorter than replicas) |
      | `CONFIG <topic> [SET key=value, …]` | config, value, default — or a message once changed |
      | `CONSUME <topic> [PARTITION n] [FROM earliest\|latest\|-N\|OFFSET n\|'ISO'] [LIMIT n] [DECODE fmt] [WHERE …]` | the message columns above |
      | `PRODUCE <topic> [PARTITION n] [KEY 'k'] [HEADERS {…}] VALUE <rest of line>` | message (`VALUE null` = tombstone) |
      | `GROUPS [TOPIC <topic>]` | group, state, members, lag, topics — with `TOPIC`, only the groups reading it, and lag on that topic alone (no `topics` column) |
      | `LAG <group>` (or `DESCRIBE GROUP <group>`) | topic, partition, committed, end, lag, member |
      | `CLUSTER` | node_id, host, port, controller, cluster_id |
      | `CREATE TOPIC <name> [PARTITIONS n] [REPLICATION r] [WITH key=value, …]` | message |
      | `DROP TOPIC <name> CONFIRM` | message — refused without `CONFIRM` |

      - **Example:** `POST http://localhost:3000/api/connections/<id>/query` with
        `{ "sql": "CONSUME orders.paid FROM -50 LIMIT 20 WHERE value.method = 'card'" }`

      ---

      </details>
  - name: System updates
    description: |-
      In-app update checking and the guided update flow. Detection compares the running image identity `(version, sha)` — baked at build time via the `APP_VERSION` / `GIT_SHA` build args — against the latest published GitHub Release and its `release.json` contract asset.

      <details><summary>More about system updates</summary>

      **Applying** uses an auto-detected `applyMethod`:
      - `docker` — the Docker socket is mounted (and we're in a container). The server
        pulls the new image and recreates its own container via the Engine API, handing
        the final stop/rename/start swap to a short-lived detached `docker:cli` helper.
      - `manual` — no socket; the server returns the `docker compose pull` command for the UI.

      Reads (`/version`, `/update/check`) require any authenticated user. Mutating routes
      (`/backup`, `/backup/:file/download`, `/preflight`, `/update/apply`) require the caller
      to be an **admin of at least one workspace** — otherwise `403 { "error": "Admin access required" }`.

      The image (`ghcr.io/aidapedia/tabletsgo`), release repo (`aidapedia/tabletsgo`) and
      helper image (`docker:cli`) are constants in `server/system-update.js`. Related env:
      `DOCKER_SOCKET` (default `/var/run/docker.sock`).

      </details>
  - name: Health
paths:
  /api/auth/config:
    get:
      tags:
        - Signing in (Hayat)
      summary: What the browser needs to sign in
      description: "Public — nobody is signed in yet. `mode` says which sign-in to show. **enterprise:** the console starts an authorization-code + PKCE sign-in at `issuer` with `clientId` (Hayat's public client for tabletsgo, `HAYAT_WEB_CLIENT_ID`) and sends the access token it gets back as `Authorization: Bearer` on every call; `consoleUrl` is Hayat's console, where members, groups, roles and accounts are managed (`null` when `HAYAT_CONSOLE_URL` is unset). **solo:** the console shows its own sign-in (see Signing in (solo)), or the first-run setup while `setupRequired`. `people` says whether there is anyone but the caller to see — members, access lists — and is what the console gates those pages on."
      security: []
      responses:
        "200":
          description: "`{ mode: 'enterprise', issuer, clientId, consoleUrl, people: true }` or `{ mode: 'solo', setupRequired, people: false }`"
          content:
            application/json:
              schema:
                type: object
                properties:
                  mode:
                    type: string
                    enum: [solo, enterprise]
                  people:
                    type: boolean
                  setupRequired:
                    type: boolean
                    description: solo only
                  issuer:
                    type: string
                    description: enterprise only
                  clientId:
                    type: string
                    description: enterprise only
                  consoleUrl:
                    type:
                      - string
                      - "null"
                    description: enterprise only
              examples:
                enterprise:
                  value:
                    mode: enterprise
                    issuer: https://auth.example.com
                    clientId: 0193f3a2-9a7e-7c1d-b1a8-5d1f2e3c4b5a
                    consoleUrl: https://hayat.example.com
                    people: true
                solo:
                  value:
                    mode: solo
                    setupRequired: false
                    people: false
  /api/auth/me:
    get:
      tags:
        - Signing in (Hayat)
      summary: The caller, as Hayat knows them
      description: The person the bearer token belongs to. `role` is `admin` when they hold tabletsgo's admin role (`tabletsgo.instance.manage`) at Hayat's root, else `user`. `timezone` is the zone set on their Hayat account (`null` = follow the browser). `accountUrl` is where they change their name, password, time zone and sign-in methods — Hayat's console, or `null` without `HAYAT_CONSOLE_URL`.
      responses:
        "200":
          description: "`{ user: { id, email, name, role, timezone, picture }, accountUrl }`"
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id: {}
                      email: {}
                      name: {}
                      role: {}
                      timezone: {}
                      picture: {}
                  accountUrl: {}
              example:
                user:
                  id: 0193f3a2-0000-7000-8000-000000000001
                  email: olive@example.com
                  name: Olive
                  role: user
                  timezone: Asia/Jakarta
                  picture: null
                accountUrl: https://hayat.example.com/account
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/auth/solo/setup:
    post:
      tags:
        - Signing in (solo)
      summary: Claim a new solo instance
      description: "Only while `GET /api/auth/config` says `setupRequired`. `code` is the six-word setup code the instance printed to its log on boot (case and surrounding spaces don't matter). Makes the owner, signs them in and sets the refresh cookie. `timezone` is optional (an IANA zone; `null` follows the browser)."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SoloSetup"
            example:
              code: amber-falcon-river-stone-maple-orbit
              name: Dev
              email: dev@example.com
              password: correct-horse-battery
              timezone: Asia/Jakarta
      responses:
        "201":
          description: Set up and signed in. The refresh token is in the `Set-Cookie` header.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SoloTokens"
        "400":
          description: An invalid email, or a password under 8 characters
        "403":
          description: The setup code is wrong
        "404":
          description: Enterprise mode
        "409":
          description: Already set up — sign in instead
        "429":
          description: Too many attempts from this address; wait a minute
  /api/auth/solo/login:
    post:
      tags:
        - Signing in (solo)
      summary: Sign in as the owner
      description: Email and password. A v1.0 account's old password hash is replaced with scrypt on its first sign-in.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
            example:
              email: dev@example.com
              password: correct-horse-battery
      responses:
        "200":
          description: Signed in. The refresh token is in the `Set-Cookie` header.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SoloTokens"
        "401":
          description: Wrong email or password
        "404":
          description: Enterprise mode
        "409":
          description: Not set up yet
        "429":
          description: Too many attempts from this address; wait a minute
  /api/auth/solo/refresh:
    post:
      tags:
        - Signing in (solo)
      summary: A fresh access token from the refresh cookie
      description: Reads the `tabletsgo_solo_refresh` cookie and answers with a new access token (and a new cookie). Refused from another origin.
      security: []
      responses:
        "200":
          description: A new access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SoloTokens"
        "401":
          description: No cookie, or it expired or was ended — sign in again
        "403":
          description: Called from another origin
        "404":
          description: Enterprise mode
  /api/auth/solo/logout:
    post:
      tags:
        - Signing in (solo)
      summary: Sign out
      description: Clears the refresh cookie. With `everywhere`, ends every session on every device, which takes a signed-in caller.
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                everywhere:
                  type: boolean
            example:
              everywhere: true
      responses:
        "204":
          description: Signed out
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Enterprise mode
  /api/auth/solo/account:
    put:
      tags:
        - Signing in (solo)
      summary: Change the owner's name, email or time zone
      description: Fields left out keep their value. `timezone` is an IANA zone, or `null` to follow the browser.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                timezone:
                  type:
                    - string
                    - "null"
            example:
              name: Dev
              timezone: Europe/Berlin
      responses:
        "200":
          description: "`{ user }`, as `GET /api/auth/me` shows it"
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: {}
              example:
                user:
                  id: 6f1c2a3b-4d5e-4f60-8a7b-9c0d1e2f3a4b
                  email: dev@example.com
                  name: Dev
                  role: admin
                  timezone: Europe/Berlin
                  picture: null
        "400":
          description: An invalid email
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Enterprise mode
  /api/auth/solo/password:
    put:
      tags:
        - Signing in (solo)
      summary: Change the owner's password
      description: Needs the current password. Every other session ends; this one gets fresh tokens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current, next]
              properties:
                current:
                  type: string
                next:
                  type: string
            example:
              current: correct-horse-battery
              next: a-longer-better-one
      responses:
        "200":
          description: Changed. New tokens for this session; the refresh token is in the `Set-Cookie` header.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SoloTokens"
        "400":
          description: The new password is under 8 characters
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The current password is wrong
        "404":
          description: Enterprise mode
        "429":
          description: Too many attempts from this address; wait a minute
  /api/workspaces:
    get:
      tags:
        - Workspaces
      summary: List the caller's workspaces
      description: The caller's Hayat tenants — a workspace *is* one. `permissions` is what they may do here, in tabletsgo's short keys (see Permissions); ask it, never `role`, which is only a label (`owner` for the tenant's owner in Hayat). `experiments` and `notifications` are tabletsgo's own settings for the workspace. `manageUrl` opens the tenant in Hayat's console, where its name, members and groups are changed.
      responses:
        "200":
          description: "`[{ id, name, role, permissions, memberCount, experiments, notifications, manageUrl }]`"
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: {}
                    name: {}
                    role: {}
                    permissions: {}
                    memberCount: {}
                    experiments: {}
                    notifications: {}
                    manageUrl: {}
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/workspaces/{id}:
    get:
      tags:
        - Workspaces
      summary: Read a workspace
      description: "`404` unless the caller is on the tenant's roster. `sessions` is `{ maxPerConnection, instanceDefault }` (0 = unlimited). Whoever holds `notifications.manage` also gets `smtp`, the instance mail server, read-only (`null` when there is none). `manageUrl` and `treeUrl` open the tenant and its resource tree in Hayat's console."
      parameters:
        - name: id
          in: path
          required: true
          description: Workspace id
          schema:
            type: string
      responses:
        "200":
          description: "`{ id, name, role, permissions, memberCount, experiments, notifications, sessions, smtp?, manageUrl, treeUrl }`"
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {}
                  name: {}
                  role: {}
                  permissions: {}
                  memberCount: {}
                  experiments: {}
                  notifications: {}
                  sessions: {}
                  smtp: {}
                  manageUrl: {}
                  treeUrl: {}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Not a member, or no such workspace
    put:
      tags:
        - Workspaces
      summary: Change tabletsgo's settings for a workspace
      description: "Checked **field by field**: `name`, `experiments` and `sessions` need `workspace.manage`, `notifications` needs `notifications.manage`. `name` renames the workspace in **solo** mode; in **enterprise** mode it is refused with `400`, since the name is the Hayat tenant's (rename it in Hayat's console). `experiments` is a partial `{ [key]: boolean }` merged onto the stored flags; `sessions` is `{ maxPerConnection }` (0 = unlimited); `notifications.backupFailure` (`{ enabled, memberIds }`) replaces the stored value."
      parameters:
        - name: id
          in: path
          required: true
          description: Workspace id
          schema:
            type: string
      requestBody:
        description: "`{ name?, experiments?, notifications?, sessions? }`"
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Solo mode only
                experiments: {}
                notifications: {}
                sessions: {}
            example:
              sessions:
                maxPerConnection: 5
      responses:
        "200":
          description: "`{ ok: true }`"
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
        "400":
          description: "`name` was sent in enterprise mode (rename the workspace in Hayat), or it is blank"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Missing the permission a field needs
    delete:
      tags:
        - Workspaces
      summary: Remove everything tabletsgo holds for a workspace
      description: Requires **workspace.delete**. Closes its connections' database handles, removes their (and its storage destinations') mirrors from Hayat's tree, then deletes its connections and everything under them, storage destinations, SSH hosts and keys, schema drafts and settings. **The tenant stays in Hayat** — deleting it is an instance admin's action there, possible once nothing is filed under it.
      parameters:
        - name: id
          in: path
          required: true
          description: Workspace id
          schema:
            type: string
      responses:
        "200":
          description: "`{ ok: true, connectionsDeleted }`"
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {}
                  connectionsDeleted:
                    type: integer
                    example: 3
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Missing `workspace.delete`
  /api/workspaces/{id}/members:
    get:
      tags:
        - Workspaces
      summary: List workspace members (read-only)
      description: "The tenant's roster in Hayat. Each person carries `roles` — the roles they hold on the workspace itself, from Hayat's grants (`via`: `user` granted to them, `group` through a group they are on, `everyone` granted to the whole workspace) — and `permissions`, what those add up to here (short keys). Read-only: people are added, removed and given roles in Hayat's console (`manageUrl` on the workspace). `role` is a label — `owner` for the tenant's owner, else `member`."
      parameters:
        - name: id
          in: path
          required: true
          description: Workspace id
          schema:
            type: string
      responses:
        "200":
          description: "`[{ userId, email, name, status, role, isOwner, createdAt, roles: [{ role, name, via, groupName }], permissions }]`"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkspaceMember"
              example:
                - userId: 01a1bf47-cfa1-7c3e-9a51-6f0e2b7d1c11
                  email: admin@hayat.test
                  name: Ada Admin
                  status: active
                  role: owner
                  isOwner: true
                  createdAt: 1794556800000
                  roles:
                    - { role: tabletsgo.owner, name: Workspace owner (tabletsgo), via: user, groupName: null }
                    - { role: hayat.tenant-admin, name: Tenant admin, via: user, groupName: null }
                  permissions: [workspace.manage, connections.create, storage.manage, ssh.manage]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not a member
  /api/workspaces/{id}/members/{userId}:
    get:
      tags:
        - Workspaces
      summary: One member and their access (read-only)
      description: "The member as in the list, plus `access`: every grant that reaches them in this workspace and every node they own, from Hayat. `kind` is `workspace`, `group`, `connection` or `storage`; `id` is the connection's or storage destination's tabletsgo id (the Hayat node id for the workspace and groups). `via` says how it reaches them — `owner` (they own it; no role), `user`, `group` (`groupName` names it) or `everyone`. `inherit` means it reaches what is filed below as well. Change any of it in Hayat's console."
      parameters:
        - name: id
          in: path
          required: true
          description: Workspace id
          schema:
            type: string
        - name: userId
          in: path
          required: true
          description: The member's Hayat user id
          schema:
            type: string
      responses:
        "200":
          description: "`{ ...member, access: [{ kind, id, name, via, role, roleName, inherit, groupName }] }`"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/WorkspaceMember"
                  - type: object
                    properties:
                      access:
                        type: array
                        items:
                          type: object
                          properties:
                            kind: { type: string, enum: [workspace, group, connection, storage] }
                            id: { type: string }
                            name: { type: string }
                            via: { type: string, enum: [owner, user, group, everyone] }
                            role: { type: string, nullable: true }
                            roleName: { type: string, nullable: true }
                            inherit: { type: boolean }
                            groupName: { type: string, nullable: true }
              example:
                userId: 01a1bf47-cfa1-7c3e-9a51-6f0e2b7d1c11
                email: bob@hayat.test
                name: Bob
                status: active
                role: member
                isOwner: false
                createdAt: 1794556800000
                roles: []
                permissions: []
                access:
                  - { kind: connection, id: c_8f2a, name: orders-db, via: group, role: tabletsgo.connection-user, roleName: Connection user, inherit: true, groupName: Backend }
                  - { kind: storage, id: s_41d0, name: nightly-backups, via: owner, role: null, roleName: null, inherit: true, groupName: null }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not a member
        "404":
          description: That person is not on this workspace's roster
  /api/admin/smtp:
    get:
      tags:
        - Instance administration
      summary: The mail server + the env layer
      description: '`smtp` is the saved config, password-masked: `{ host, port, secure, user, from, hasPassword }` — `host: ""` means nothing is saved. `env` is the non-secret env layer under it (`{ host, port, secure, user, from }`) or `null` when `SMTP_HOST` is unset; the admin form pre-fills from it.'
      responses:
        "200":
          description: "`{ smtp, env }`"
          content:
            application/json:
              schema:
                type: object
                properties:
                  smtp: {}
                  env: {}
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags:
        - Instance administration
      summary: Save the mail server config
      description: '(the saved, masked config). Fields left out keep their stored value. Omit `pass` (or send `""`) to keep the stored password; send `null` to clear it. Saving `host: ""` disables the saved config — the instance falls back to `env`.'
      requestBody:
        description: "`{ host?, port?, secure?, user?, from?, pass? }`"
        content:
          application/json:
            schema:
              type: object
              properties:
                host: {}
                port: {}
                secure: {}
                user: {}
                from: {}
                pass: {}
            example:
              host: smtp.example.com
              port: 587
              secure: false
              user: apikey
              pass: s3cret
              from: Tabletsgo <no-reply@example.com>
      responses:
        "200":
          description: "`{ smtp }`"
          content:
            application/json:
              schema:
                type: object
                properties:
                  smtp: {}
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags:
        - Instance administration
      summary: Drop it (fall back to env)
      description: Drops the saved config entirely; the instance falls back to the `SMTP_*` env vars, or to sending no mail at all.
      responses:
        "200":
          description: "`{ ok: true, smtp }`"
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  smtp: {}
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/admin/smtp/test:
    post:
      tags:
        - Instance administration
      summary: Send a test email
      description: or `400 { error }`. `to` defaults to the caller's own email. `smtp` (same shape as `PUT`; a blank `pass` reuses the stored one) tests unsaved form values; omit it to test what is in effect instance-wide right now. TLS-mismatch errors are translated into a readable hint instead of the raw OpenSSL text.
      requestBody:
        description: "`{ to?, smtp? }`"
        content:
          application/json:
            schema:
              type: object
              properties:
                to: {}
                smtp: {}
      responses:
        "200":
          description: "`{ ok: true }`"
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/modules:
    get:
      tags:
        - Instance administration
      summary: What's on, for hiding what isn't, and the settings in effect, for applying them
      description: |-
        What's on, for hiding what isn't, and the settings in effect, for applying them.
        - **401** without a token.
      responses:
        "200":
          description: '`{ "modules": [{ "id": "sqlite", "kind": "engine", "label": "SQLite", "enabled": true, "settings": { "tableRowLimit": 50000, "queryTimeoutSec": 30 } }, …] }`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  modules:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: sqlite
                        kind:
                          type: string
                          example: engine
                        label:
                          type: string
                          example: SQLite
                        enabled:
                          type: boolean
                          example: true
                        settings:
                          type: object
                          properties:
                            tableRowLimit:
                              type: integer
                              example: 50000
                            queryTimeoutSec:
                              type: integer
                              example: 30
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/admin/modules:
    get:
      tags:
        - Instance administration
      summary: The admin view
      description: "The admin view: identity, state, settings and — for an engine — who uses it."
      responses:
        "200":
          description: |-
            `usage` is `null` for a feature. `step` is what one click of the admin form's
            stepper moves a setting by.
          content:
            application/json:
              schema:
                type: object
                properties:
                  modules:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: kafka
                        kind:
                          type: string
                          example: engine
                        label:
                          type: string
                          example: Kafka
                        description:
                          type: string
                        enabled:
                          type: boolean
                          example: true
                        usage:
                          type: object
                          properties:
                            connections:
                              type: integer
                              example: 4
                            workspaces:
                              type: integer
                              example: 2
                        settings:
                          type: array
                          items:
                            type: object
                            properties:
                              key:
                                type: string
                                example: readMaxMessages
                              label:
                                type: string
                                example: Messages per read
                              help:
                                type: string
                              unit:
                                type: string
                                example: messages
                              type:
                                type: string
                                example: int
                              min:
                                type: integer
                                example: 1
                              max:
                                type: integer
                                example: 100000
                              step:
                                type: integer
                                example: 100
                              value:
                                type: integer
                                example: 1000
                              default:
                                type: integer
                                example: 500
              example:
                modules:
                  - id: kafka
                    kind: engine
                    label: Kafka
                    description: "Event streaming: …"
                    enabled: true
                    usage:
                      connections: 4
                      workspaces: 2
                    settings:
                      - key: readMaxMessages
                        label: Messages per read
                        help: …
                        unit: messages
                        type: int
                        min: 1
                        max: 100000
                        step: 100
                        value: 1000
                        default: 500
                      - key: readTimeoutMs
                        label: Read time limit
                        help: …
                        unit: ms
                        type: int
                        min: 500
                        max: 120000
                        step: 1000
                        value: 8000
                        default: 8000
                  - id: backup
                    kind: feature
                    label: Backup
                    description: …
                    enabled: true
                    usage: null
                    settings: []
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags:
        - Instance administration
      summary: Change several modules at once — what the wizard sends
      description: |-
        Change several modules at once — what the wizard sends. The whole patch is
        validated before any of it is saved.
        - **409** (an engine still in use):
          ```json
          { "error": "1 connection uses Kafka. Turn it off anyway to lock it — nothing is deleted.", "module": "kafka",
            "connections": [{ "id": "06f0…", "name": "orders-events", "workspaceId": "a4a7…", "workspaceName": "Payments", "ownerName": "Rina", "ownerEmail": "rina@acme.com" }] }
          ```
      requestBody:
        description: '`{ "modules": { "<id>": { "enabled"?: boolean, "settings"?: { "<key>": number | string | null } } } }` — a setting of `null` goes back to its default.'
        content:
          application/json:
            schema:
              type: object
              properties:
                modules:
                  type: object
                  properties:
                    <id>:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                        settings:
                          type: object
                          properties:
                            <key>:
                              oneOf:
                                - type: number
                                - type: string
                                - type: "null"
            example:
              modules:
                redis:
                  enabled: false
                kafka:
                  settings:
                    readMaxMessages: 1000
      responses:
        "200":
          description: '`{ "modules": [...] }` — the same shape as `GET /api/admin/modules`.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  modules:
                    type: array
                    items: {}
        "400":
          description: '`{ "error": "Unknown module: mysql" }`, `{ "error": "Messages per read must be a whole number from 1 to 100000." }`, `{ "error": "Keep at least one database turned on — workspaces need something to connect to." }`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Unknown module: mysql"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/admin/modules/{id}:
    put:
      tags:
        - Instance administration
      summary: One module — what Admin → Modules sends
      description: |-
        One module — what Admin → Modules sends. Same rules and responses as the batch.

        The batch route takes `force` at the top level: `{ "modules": { … }, "force": true }`.

        ---
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: kafka
      requestBody:
        description: '`{ "enabled"?: boolean, "settings"?: { "<key>": number | string | null }, "force"?: boolean, "notify"?: boolean }` — `force` turns off an engine connections still use (they are locked); `notify` with it notifies their owners by email that their connections are locked — **one email per unique recipient address** (trimmed, case-insensitive), listing every connection that address owns. Sent through the instance mail server (Administration → Email).'
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
                settings:
                  type: object
                  properties:
                    <key>:
                      oneOf:
                        - type: number
                        - type: string
                        - type: "null"
                force:
                  type: boolean
                notify:
                  type: boolean
            example:
              enabled: false
              force: true
              notify: true
      responses:
        "200":
          description: "`{ \"modules\": [...], \"notified\"?: { \"owners\": 2, \"connections\": 4, \"failed\": [] } }` — `notified` only when `force` + `notify` turned an engine off; it is `{ \"error\": \"No mail server is configured — …\" }` when the email couldn't be sent (the engine is off either way)."
          content:
            application/json:
              schema:
                type: object
                properties:
                  modules:
                    type: array
                    items: {}
                  notified:
                    type: object
                    properties:
                      owners:
                        type: integer
                        example: 2
                      connections:
                        type: integer
                        example: 4
                      failed:
                        type: array
                        items: {}
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/connections:
    get:
      tags:
        - Connections
      summary: List connections
      description: |-
        List connections in a workspace the caller belongs to. Results are further filtered
        by **connection access** (see below): a connection with no access rows is visible to
        every workspace member; one with access rows is visible only to workspace owners, its
        assigned individual members, and everyone in its assigned groups.
      parameters:
        - name: workspace
          in: query
          description: "`workspace` (required — the workspace id). Missing → `[]`."
          schema:
            type: string
      responses:
        "200":
          description: "`Connection[]` (array of connection objects)"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Connection"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags:
        - Connections
      summary: Create connection
      description: |-
        Create a connection (**`connections.create`**). Server assigns the `id` (UUID). The
        `ownerId` defaults to the authenticated caller unless one is supplied in the body.
        The response includes the resolved `ownerName` / `ownerEmail`.
      requestBody:
        description: The connection **without** `id`. `ownerId` is optional.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Connection"
      responses:
        "200":
          description: the created connection (with `id`, `ownerId`, `ownerName`, `ownerEmail`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connection"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |-
            `{ "error": "You do not have permission to do that.", "permission": "connections.create" }`

            `{ "error": "Redis is turned off on this instance. …" }` — the type's module is off (see Modules). Import (`POST /api/connections/import`) refuses the same way.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: You do not have permission to do that.
                  permission:
                    type: string
                    example: connections.create
  /api/test-connection:
    post:
      tags:
        - Connections
      summary: Test connectivity (no save)
      description: |-
        Test connectivity without saving. Body is a connection-shaped object.

        - **SSH tunnel:** add `"sshGatewayId"` to test through a gateway (a throwaway tunnel, closed afterwards). This form **requires auth**: the caller must be a member of the gateway's workspace and hold `connections.create` there, or own/manage the existing connection named by the body's `id`. **401** without a token; **403** `{ "ok": false, "message": "That SSH host is not available to you." }` otherwise. A tunnel failure is a normal `200 { "ok": false, "message": "The SSH host 10.0.0.5:22 rejected user \"ubuntu\"." }`.
      security: []
      requestBody:
        description: |-
          (SQLite) `{ "type": "sqlite", "filepath": "./demo.db" }`

          (PostgreSQL) `{ "type": "postgresql", "host": "...", "port": 5432, "username": "...", "password": "...", "database": "...", "sslmode": "disable" }`

          (MySQL) `{ "type": "mysql", "host": "...", "port": 3306, "username": "...", "password": "...", "database": "...", "sslmode": "require" }`

          (Redis) `{ "type": "redis", "host": "...", "port": 6379, "username": "...", "password": "...", "database": "0", "tls": "require" }` — or `{ "type": "redis", "uri": "redis://user:pass@host:6379/0" }`
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  example: sqlite
                filepath:
                  type: string
                  example: ./demo.db
            examples:
              SQLite:
                value:
                  type: sqlite
                  filepath: ./demo.db
              PostgreSQL:
                value:
                  type: postgresql
                  host: ...
                  port: 5432
                  username: ...
                  password: ...
                  database: ...
                  sslmode: disable
              Redis:
                value:
                  type: redis
                  host: ...
                  port: 6379
                  username: ...
                  password: ...
                  database: "0"
                  tls: require
      responses:
        "200":
          description: |-
            (success) `{ "ok": true, "message": "Connected! 5 table(s) found." }` (Redis: `{ "ok": true, "message": "Connected to Redis 7.4.2 · 128 key(s) in db0." }`)

            (failure) `{ "ok": false, "message": "<driver error>" }` (note: failures still return HTTP 200)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Connected! 5 table(s) found.
        "400":
          description: '`{ "ok": false, "message": "Unsupported connection type: mysql" }`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Unsupported connection type: mysql"
        "403":
          description: "`{ \"ok\": false, \"message\": \"Redis is turned off on this instance. An instance administrator can turn it on in Admin → Modules.\" }` — the engine's module is off (see Modules)."
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Redis is turned off on this instance. An instance administrator can turn it on in Admin → Modules.
  /api/connections/{id}:
    put:
      tags:
        - Connections
      summary: Update connection
      description: |-
        Update a connection (manage-or-own, see above). Merges body into the existing
        record; drops cached pools/handles so the next query reconnects with new settings.
        The database `type` is fixed at creation — omit it, or send the current value.
        Switching between a direct connection and an SSH tunnel is `sshGatewayId`
        (`""` for direct, a gateway id of the same workspace for a tunnel).
      parameters:
        - name: id
          in: path
          required: true
          description: Connection id
          schema:
            type: string
          example: demo-sqlite
      requestBody:
        description: Partial or full connection fields to change.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Connection"
      responses:
        "200":
          description: the updated connection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connection"
        "400":
          description: '`{ "error": "A connection’s database type cannot be changed. Create a new connection instead." }` when `type` differs from the stored one'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: A connection’s database type cannot be changed. Create a new connection instead.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: '`{ "error": "Connection not found" }`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Connection not found
    delete:
      tags:
        - Connections
      summary: Delete connection (+ cascade)
      description: |-
        Delete a connection and cascade-delete its saved queries, folders (including
        table-folder membership), workflows, dashboards and history.
        Also closes any open pool/handle.
      parameters:
        - name: id
          in: path
          required: true
          description: Connection id
          schema:
            type: string
          example: demo-sqlite
      responses:
        "200":
          description: '`{ "ok": true }`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: '`{ "error": "Connection not found" }`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Connection not found
  /api/connections/{id}/owner:
    put:
      tags:
        - Connections
      summary: Transfer connection ownership
      description: |-
        Hand the connection to another member of the workspace (**`connections.transfer`**).

        Its own permission rather than part of `connections.manage`, because it is the one
        change that can take a connection *away* from the caller: the new owner may edit,
        back up and delete it, and the previous owner keeps that only if their role does.
      parameters:
        - name: id
          in: path
          required: true
          description: Connection id
          schema:
            type: string
          example: demo-sqlite
      requestBody:
        description: '`{ "ownerId": "user_456" }`'
        content:
          application/json:
            schema:
              type: object
              properties:
                ownerId:
                  type: string
                  example: user_456
            example:
              ownerId: user_456
      responses:
        "200":
          description: the updated connection (with the new `ownerId` / `ownerName` / `ownerEmail`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connection"
        "400":
          description: '`{ "error": "That person is not a member of this workspace." }` — ownership is not a way to grant workspace access. Also `400` if the target is an instance admin (they hold no membership at all), or if the connection has no `workspaceId`.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: That person is not a member of this workspace.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: '`{ "error": "You do not have permission to do that.", "permission": "connections.transfer" }`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: You do not have permission to do that.
                  permission:
                    type: string
                    example: connections.transfer
        "404":
          description: '`{ "error": "Connection not found" }`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Connection not found
  /api/connections/{id}/export:
    get:
      tags:
        - Connections
      summary: Build the export document for a connection
      description: |-
        Build the export document for a connection.

        Webhook tokens are stripped from workflow graphs — they're secrets and never
        round-trip through a file (import mints fresh ones).
      parameters:
        - name: id
          in: path
          required: true
          description: Connection id
          schema:
            type: string
          example: demo-sqlite
        - name: secrets
          in: query
          description: "`secrets` (optional — `1`/`true`/`yes` keeps the stored password; default omits every secret field and blanks a password embedded in a `uri`)"
          schema:
            type: string
          example: "1"
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  kind:
                    type: string
                    example: connection
                  version:
                    type: integer
                    example: 1
                  exportedAt:
                    type: integer
                    example: 1785227173000
                  app:
                    type: object
                    properties:
                      name:
                        type: string
                        example: tabletsgo
                      version:
                        type: string
                        example: 0.19.0
                  includesSecrets:
                    type: boolean
                    example: false
                  connection:
                    type: object
                    properties:
                      type:
                        type: string
                        example: postgresql
                      name:
                        type: string
                        example: Demo
                      environment:
                        type: string
                        example: local
                      folder:
                        type: string
                        example: ""
                      tags:
                        type: array
                        items:
                          type: string
                          example: analytics
                      settings:
                        type: object
                        properties:
                          host:
                            type: string
                            example: localhost
                          port:
                            type: integer
                            example: 5432
                          username:
                            type: string
                            example: app
                          database:
                            type: string
                            example: demo
                          sslmode:
                            type: string
                            example: disable
                  folders:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: f1
                        type:
                          type: string
                          example: table
                        name:
                          type: string
                          example: Core
                        color:
                          type: string
                          example: "#6366f1"
                        parentId:
                          type: "null"
                        ts:
                          type: integer
                          example: 1785227173134
                  tableFolders:
                    type: array
                    items:
                      type: object
                      properties:
                        tableName:
                          type: string
                          example: users
                        folderId:
                          type: string
                          example: f1
                  savedQueries:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: q1
                        name:
                          type: string
                          example: All rows
                        sql:
                          type: string
                          example: SELECT 1
                        kind:
                          type: string
                          example: query
                        folderId:
                          type: "null"
                        layout:
                          type: "null"
                        ts:
                          type: integer
                          example: 1785227173232
                  workflows:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: w1
                        name:
                          type: string
                          example: Nightly
                        graph:
                          type: object
                          properties:
                            nodes:
                              type: array
                              items: {}
                            edges:
                              type: array
                              items: {}
                        folderId:
                          type: "null"
                        scheduleEnabled:
                          type: boolean
                          example: true
                        ts:
                          type: integer
                          example: 1785227173259
                  dashboards:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: d1
                        name:
                          type: string
                          example: Overview
                        config:
                          type: object
                          properties:
                            variables:
                              type: array
                              items: {}
                            widgets:
                              type: array
                              items: {}
                        folderId:
                          type: "null"
                        ts:
                          type: integer
                          example: 1785227173300
                  backupSchedule:
                    type: object
                    properties:
                      frequency:
                        type: string
                        example: daily
                      hourOfDay:
                        type: integer
                        example: 2
                      destinationIds:
                        type: array
                        items:
                          type: string
                          example: local
                      retryLimit:
                        type: integer
                        example: 0
                      retryDelaySec:
                        type: integer
                        example: 60
                      retentionDays:
                        type: integer
                        example: 7
                      encrypt:
                        type: boolean
                        example: false
                      enabled:
                        type: boolean
                        example: true
              example:
                kind: connection
                version: 1
                exportedAt: 1785227173000
                app:
                  name: tabletsgo
                  version: 0.19.0
                includesSecrets: false
                connection:
                  type: postgresql
                  name: Demo
                  environment: local
                  folder: ""
                  tags:
                    - analytics
                  settings:
                    host: localhost
                    port: 5432
                    username: app
                    database: demo
                    sslmode: disable
                folders:
                  - id: f1
