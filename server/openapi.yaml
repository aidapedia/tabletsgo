  /api/hooks/wf/{wid}/{token}:
    post:
      tags:
        - Workflows
      summary: Fire a workflow webhook
      description: |-
        **Public** (unauthenticated) webhook trigger — the one workflow route not behind
        auth. Fires a workflow whose graph contains a `webhook` trigger node, guarding on
        the node's opaque `token` (constant-time compared). The workflow runs with the
        inbound request as its initial input: `{ body, query, headers, method }`. Records
        the run in `workflow_runs` with `trigger_kind: "webhook"`.

        ---
      security: []
      parameters:
        - name: wid
          in: path
          required: true
          description: Workflow id
          schema:
            type: string
          example: wf-1
        - name: token
          in: path
          required: true
          schema:
            type: string
          example: 9f3cxe21a
      requestBody:
        description: any JSON (exposed to the graph as `input.body`); query params as `input.query`.
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: '`{ "ok": true, "output": <terminal output>, "error": null }`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  output: {}
                  error:
                    type: "null"
        "401":
          description: '`{ "error": "Invalid webhook token" }`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Invalid webhook token
        "404":
          description: '`{ "error": "Not found" }` (unknown workflow) · `{ "error": "This workflow has no webhook trigger" }` · `{ "error": "Connection not found" }`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Not found
        "405":
          description: '`{ "error": "Use GET or POST" }`'
        "500":
          description: '`{ "ok": false, "output": ..., "error": "<message>" }` (a node failed)'
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: false
                  output: {}
                  error:
