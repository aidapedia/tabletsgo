# Tabletsgo on Coolify in enterprise mode, built from this repository's source —
# no published image. People, workspaces and access come from a Hayat that runs
# on its own (Hayat's repo: deploy/coolify).
#
# Coolify: New Resource → Git repository (this repo, branch v1.x.x or any other)
# → Build Pack "Docker Compose" → Base Directory "/deploy/coolify" → Docker
# Compose Location "/docker-compose.yml". (The build context below resolves from
# the Base Directory; with "/" the "../.." would climb out of the repo.) Then
# either set a domain on the tabletsgo service in Coolify:
#   tabletsgo      https://db.example.com:3000
# (the ":port" tells Coolify's proxy which container port to use), or — behind a
# Cloudflare Tunnel with cloudflared on this host — leave it empty and point the
# tunnel's public hostname at the port published on 127.0.0.1:
#   db.example.com → http://localhost:3100   (TABLETSGO_PORT, default 3100 — Hayat's console has 3000)
#
# Reaching Hayat's api role (HAYAT_API_URL) — it isn't public by default:
#   - same Coolify server: enable "Connect To Predefined Network" on both
#     resources and use the api container's name, http://hayat-api-<hayat resource uuid>:7443
#   - elsewhere: publish hayat-api through ingress (a domain or tunnel hostname
#     → its port 7443) and use that URL; every call carries a service token.
#
# Registering tabletsgo in Hayat (once, before the first deploy): write the
# bundle from a clone with
#   npm run hayat:bundle -- --out hayat-import.json --admin you@example.com
# and load it with `hayat import --file hayat-import.json --app-url
# <PUBLIC_URL> --out hayat-result.json` run with Hayat's settings (on Coolify: a
# one-off `docker run` of the hayat-api image on its network with its env). It
# prints HAYAT_CLIENT_ID, HAYAT_CLIENT_SECRET and HAYAT_WEB_CLIENT_ID.
#
# Required variables (Coolify lists them under Environment Variables):
#   ENCRYPTION_KEY       openssl rand -hex 32 — keep a copy; losing it makes every saved credential unreadable
#   PUBLIC_URL           https://db.example.com (the tabletsgo domain, the --app-url above)
#   HAYAT_ISSUER         https://auth.example.com (Hayat's auth role, as browsers reach it)
#   HAYAT_API_URL        Hayat's api role, as this server reaches it (see above)
#   HAYAT_CLIENT_ID / HAYAT_CLIENT_SECRET / HAYAT_WEB_CLIENT_ID   from `hayat import`
# Optional: HAYAT_CONSOLE_URL (Hayat's console, for "Manage in Hayat" links),
# HAYAT_AUTH_URL (the auth role as this server reaches it, when not HAYAT_ISSUER).
# The PostgreSQL password is generated by Coolify (SERVICE_PASSWORD_POSTGRES).
#
# Data lives on the server under /mnt/data/tabletsgo (bind mounts, not Docker
# volumes). Back up both directories together, with ENCRYPTION_KEY.
#
# First sign-in: the --admin person signs in at Hayat (signs up first if Hayat
# doesn't know them yet), then in Hayat's console creates a workspace (tenant)
# and grants "Workspace owner (tabletsgo)" to whoever runs it.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tabletsgo
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: tabletsgo
    volumes:
      - /mnt/data/tabletsgo/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tabletsgo -d tabletsgo"]
      interval: 5s
      retries: 20

  tabletsgo:
    build:
      context: ../..
      args:
        VITE_API_URL: /api
        GIT_SHA: ${SOURCE_COMMIT:-dev}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      TABLETSGO_MODE: enterprise
      META_DB_TYPE: postgresql
      META_DATABASE_URL: postgresql://tabletsgo:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/tabletsgo
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?}
      PUBLIC_URL: ${PUBLIC_URL:?}
      HAYAT_ISSUER: ${HAYAT_ISSUER:?}
      HAYAT_API_URL: ${HAYAT_API_URL:?}
      HAYAT_CLIENT_ID: ${HAYAT_CLIENT_ID:?}
      HAYAT_CLIENT_SECRET: ${HAYAT_CLIENT_SECRET:?}
      HAYAT_WEB_CLIENT_ID: ${HAYAT_WEB_CLIENT_ID:?}
      HAYAT_CONSOLE_URL: ${HAYAT_CONSOLE_URL:-}
      HAYAT_AUTH_URL: ${HAYAT_AUTH_URL:-}
      # Optional fallback mail server for tabletsgo's own notices (an admin's
      # Administration → Email setting wins). Invites and resets are Hayat's.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
    volumes:
      # The Hayat import bundle and anything else the instance writes for itself.
      - /mnt/data/tabletsgo/data:/app/data
    ports: ["127.0.0.1:${TABLETSGO_PORT:-3100}:3000"] # cloudflared: db.<domain> → http://localhost:<TABLETSGO_PORT>
