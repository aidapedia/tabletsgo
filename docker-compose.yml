services:
  tabletsgo:
    # Run the published image so `docker compose pull && up -d` upgrades in place
    # (this is what the in-app update flow drives). Pin a version with TABLETSGO_TAG.
    image: ghcr.io/aidapedia/tabletsgo:${TABLETSGO_TAG:-latest}
    # For local development against your working tree, comment out `image:` above
    # and uncomment this build block instead:
    # build:
    #   context: .
    #   args:
    #     # Baked into the static frontend build. Same-origin `/api` by default.
    #     VITE_API_URL: ${VITE_API_URL:-/api}
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - META_DB=/app/data/app.db
      # Required — encrypts connection credentials at rest. The server refuses
      # to start without it. Generate one with:
      #   node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      # Optional admin pre-seed — leave unset to use the in-browser setup wizard.
      - ADMIN_USERNAME=${ADMIN_USERNAME:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - WORKSPACE_NAME=${WORKSPACE_NAME:-}
      # Optional SMTP for member-invite emails — the fallback under the mail
      # server an admin configures in Administration > Email (that one wins).
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SMTP_SECURE=${SMTP_SECURE:-}
      # How long (ms) the pre-flight connection handshake waits before it reports
      # a timeout. Raise only for databases behind a slow tunnel/VPN.
      - HANDSHAKE_TIMEOUT_MS=${HANDSHAKE_TIMEOUT_MS:-}
      # Session store (logins + open-connection sessions). Points at the redis
      # service below; logins then survive a container restart and are shared by
      # every replica. Set to an empty value to fall back to the in-process store
      # (fine for a single container, but sessions are lost on restart).
      - SESSION_REDIS_URL=${SESSION_REDIS_URL-redis://redis:6379/0}
      # Optional session tuning: login lifetime, idle timeout before an open
      # database handle is released, and the instance-wide cap on concurrent
      # sessions per connection (0 = unlimited; workspace/connection override it).
      - SESSION_TTL_MS=${SESSION_TTL_MS:-}
      - SESSION_IDLE_TTL_MS=${SESSION_IDLE_TTL_MS:-}
      - MAX_SESSIONS_PER_CONNECTION=${MAX_SESSIONS_PER_CONNECTION:-}
      # In-app update checker. UPDATE_IMAGE/UPDATE_REPO default to the official
      # image + repo; override only for a fork. One-click apply needs the Docker
      # socket mounted (see the volumes section) — otherwise the wizard shows the
      # manual `docker compose pull` command.
      - UPDATE_IMAGE=${UPDATE_IMAGE:-}
      - UPDATE_REPO=${UPDATE_REPO:-}
      # Default for the per-user "auto-check for updates" toggle (Settings >
      # Updates). Off unless set truthy — handy to leave off when an orchestrator
      # (e.g. Coolify) manages updates. Users can still override per browser.
      - UPDATE_AUTO_CHECK=${UPDATE_AUTO_CHECK:-}
    volumes:
      # Persist app metadata (users / connections / saved queries) across
      # container restarts.
      - tabletsgo-data:/app/data
      # OPTIONAL — one-click in-app updates. Mounting the Docker socket lets
      # Tabletsgo pull the new image and recreate its own container from the
      # Settings > Updates wizard (no Watchtower, no env config). SECURITY: the
      # socket grants root-equivalent control of the host, and update actions are
      # already restricted to workspace admins. Leave commented to keep updates
      # manual (the wizard then shows a `docker compose pull` command instead).
      # - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - redis
    restart: unless-stopped

  # Session store — logins and open-connection sessions. This is TabletsGo's own
  # Redis; it has nothing to do with a Redis you connect to *as a database*.
  # Drop this service (and clear SESSION_REDIS_URL) to keep sessions in-process.
  redis:
    image: redis:7-alpine
    # appendonly so signed-in users survive a restart of this container.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - tabletsgo-sessions:/data
    restart: unless-stopped

volumes:
  tabletsgo-data:
  tabletsgo-sessions:
