services:
  tabletsgo:
    # Run the published image so `docker compose pull && up -d` upgrades in place
    # (this is what the in-app update flow drives).
    # The app migrates the metadata DB on boot, so a pulled image upgrades the
    # store the first time it starts.
    image: ghcr.io/aidapedia/tabletsgo:latest
    depends_on:
      # Only when the `postgresql` profile is enabled; ignored otherwise.
      metadata-postgres:
        condition: service_healthy
        required: false
    # For local development against your working tree, comment out `image:` above
    # and uncomment this build block instead:
    # build:
    #   context: .
    #   args:
    #     # Baked into the static frontend build. Same-origin `/api` by default.
    #     VITE_API_URL: ${VITE_API_URL:-/api}
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - META_DB=/app/data/app.db
      - META_DB_TYPE=${META_DB_TYPE:-sqlite}
      - META_DATABASE_URL=${META_DATABASE_URL:-}
      # Required — encrypts connection credentials at rest. The server refuses
      # to start without it. Generate one with:
      #   node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      # Required — sign-in and authorization are Hayat's. `hayat import` prints
      # these (README → Hayat). The server refuses to start without the first five.
      - HAYAT_ISSUER=${HAYAT_ISSUER:-}
      - HAYAT_API_URL=${HAYAT_API_URL:-}
      - HAYAT_CLIENT_ID=${HAYAT_CLIENT_ID:-}
      - HAYAT_CLIENT_SECRET=${HAYAT_CLIENT_SECRET:-}
      - HAYAT_WEB_CLIENT_ID=${HAYAT_WEB_CLIENT_ID:-}
      - HAYAT_CONSOLE_URL=${HAYAT_CONSOLE_URL:-}
      # Optional — Hayat's auth role as this container reaches it, when that isn't
      # HAYAT_ISSUER (inside Docker, `localhost` is the container itself).
      - HAYAT_AUTH_URL=${HAYAT_AUTH_URL:-}
      # Optional SMTP for tabletsgo's own notices — the fallback under the mail
      # server an admin configures in Administration > Email (that one wins).
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SMTP_SECURE=${SMTP_SECURE:-}
      # The address people reach this instance at. Set it behind a reverse proxy:
      # emailed links use it.
      - PUBLIC_URL=${PUBLIC_URL:-}
      # How long (ms) the pre-flight connection handshake waits before it reports
      # a timeout. Raise only for databases behind a slow tunnel/VPN.
      - HANDSHAKE_TIMEOUT_MS=${HANDSHAKE_TIMEOUT_MS:-}
      # Optional session tuning: idle timeout before an open database handle is
      # released, and the instance-wide cap on concurrent sessions per connection
      # (0 = unlimited; a workspace overrides it).
      - SESSION_IDLE_TTL_MS=${SESSION_IDLE_TTL_MS:-}
      - MAX_SESSIONS_PER_CONNECTION=${MAX_SESSIONS_PER_CONNECTION:-}
    volumes:
      # Persist app metadata (connections / saved queries) — and the Hayat import
      # bundle the upgrade writes — across
      # container restarts.
      - tabletsgo-data:/app/data
      # OPTIONAL — one-click in-app updates. Mounting the Docker socket lets
      # Tabletsgo pull the new image and recreate its own container from the
      # Settings > Updates wizard (no Watchtower, no env config). SECURITY: the
      # socket grants root-equivalent control of the host, and update actions are
      # already restricted to workspace admins. Leave commented to keep updates
      # manual (the wizard then shows a `docker compose pull` command instead).
      # - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  metadata-postgres:
    image: postgres:17-alpine
    profiles: [postgresql]
    environment:
      - POSTGRES_DB=tabletsgo
      - POSTGRES_USER=tabletsgo
      - POSTGRES_PASSWORD=${META_POSTGRES_PASSWORD:-}
    volumes:
      - tabletsgo-postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U tabletsgo -d tabletsgo']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  tabletsgo-data:
  tabletsgo-postgres:
