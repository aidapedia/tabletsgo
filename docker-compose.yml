services:
  tabletsgo:
    build:
      context: .
      args:
        # Baked into the static frontend build. Same-origin `/api` by default.
        VITE_API_URL: ${VITE_API_URL:-/api}
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - META_DB=/app/data/app.db
      # Optional admin pre-seed — leave unset to use the in-browser setup wizard.
      - ADMIN_USERNAME=${ADMIN_USERNAME:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - WORKSPACE_NAME=${WORKSPACE_NAME:-}
      # Optional SMTP for member-invite emails (also settable per-workspace in the UI).
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SMTP_SECURE=${SMTP_SECURE:-}
    volumes:
      # Persist app metadata (users / connections / saved queries) across
      # container restarts. The demo SQLite DB re-seeds itself on a fresh start.
      - tabletsgo-data:/app/data
    restart: unless-stopped

volumes:
  tabletsgo-data:
